/* ===== Invoice edit: account reconciliation ===== */
function saInvoiceAccountForMethod(method,preferIds){
  const t={cash:'cash',bkash:'bkash',nagad:'nagad',bank:'bank'}[String(method||'').toLowerCase()];
  if(!t)return null;
  const typed=accounts.filter(a=>String(a.type||'').toLowerCase()===t);
  return typed.find(a=>(preferIds||[]).includes(String(a.id)))||typed[0]||null;
}
function saInvoicePostedTxs(rec){
  return moneyTransactions.filter(t=>String(t.ref)===String(rec.id)&&/^(Sale|Delivered (Sale|Mix)|Purchase)/i.test(String(t.note||'')));
}
function saInvoiceScaleCents(weights,target){
  const sum=weights.reduce((a,b)=>a+b,0);
  if(!weights.length)return[];
  if(sum<=0){const out=weights.map(()=>0);out[0]=target;return out}
  const out=weights.map(w=>Math.floor(target*w/sum));
  out[out.length-1]+=target-out.reduce((a,b)=>a+b,0);
  return out;
}
/* Returns {ok,postings:[{accountId,cents}],split} without mutating anything. */
function saPlanInvoicePostings(type,old,total,method,newDueCents){
  const oldTxs=saInvoicePostedTxs(old);
  const oldIds=oldTxs.map(t=>String(t.accountId));
  const totalCents=moneyToCents(total);
  const m=String(method||'');
  if(m==='Due')return{ok:true,postings:[],split:[]};
  if(m==='Mix'){
    const paidCents=Math.max(0,totalCents-newDueCents);
    const byAcc=new Map();
    oldTxs.forEach(t=>byAcc.set(String(t.accountId),(byAcc.get(String(t.accountId))||0)+moneyToCents(t.amount||0)));
    let ids=[...byAcc.keys()].filter(id=>accounts.some(a=>String(a.id)===id)),weights=ids.map(id=>byAcc.get(id));
    if(!ids.length){const a=saInvoiceAccountForMethod('Cash')||accounts[0];if(!a)return{ok:false,msg:'কোনো অ্যাকাউন্ট পাওয়া যায়নি'};ids=[String(a.id)];weights=[1]}
    const cents=saInvoiceScaleCents(weights,paidCents);
    const postings=ids.map((id,i)=>({accountId:id,cents:cents[i]})).filter(x=>x.cents>0);
    const split=postings.map(x=>{const a=accounts.find(z=>String(z.id)===x.accountId);return{accountId:x.accountId,amount:x.cents/100,accountName:a?.name||'',accountType:a?.type||''}});
    return{ok:true,postings,split};
  }
  const acc=saInvoiceAccountForMethod(m,oldIds);
  if(!acc)return{ok:false,msg:m+' টাইপের কোনো অ্যাকাউন্ট নেই — আগে অ্যাকাউন্ট তৈরি করুন'};
  return{ok:true,postings:totalCents>0?[{accountId:String(acc.id),cents:totalCents}]:[],split:null};
}
function saApplyInvoicePostings(type,old,plan,date,time){
  const isSale=type==='sale';
  const oldTxs=saInvoicePostedTxs(old);
  const key=list=>list.map(x=>x.accountId+':'+x.cents).sort().join('|');
  const oldNorm=[];oldTxs.forEach(t=>{const id=String(t.accountId),c=moneyToCents(t.amount||0),e=oldNorm.find(x=>x.accountId===id);if(e)e.cents+=c;else oldNorm.push({accountId:id,cents:c})});
  if(key(oldNorm.filter(x=>x.cents))===key(plan.postings)&&oldTxs.every(t=>t.type===(isSale?'in':'out')))return false;
  const baseNote=oldTxs[0]?.note||'';
  const ref6=String(old.id).slice(-6);
  // reverse old postings
  oldTxs.forEach(t=>{const a=accounts.find(x=>String(x.id)===String(t.accountId));if(a){const c=moneyToCents(t.amount||0);a.balance=centsToMoney(moneyToCents(a.balance||0)+(t.type==='in'?-c:c))}});
  const oldIds=new Set(oldTxs.map(t=>t));
  moneyTransactions=moneyTransactions.filter(t=>!oldIds.has(t));
  // post new amounts
  plan.postings.forEach(p=>{
    const a=accounts.find(x=>String(x.id)===p.accountId);if(!a)return;
    a.balance=centsToMoney(moneyToCents(a.balance||0)+(isSale?p.cents:-p.cents));
    const note=baseNote||((isSale?'Sale':'Purchase')+(plan.split?' Mix':'')+' ('+ref6+')');
    logMoneyTx({type:isSale?'in':'out',amount:p.cents/100,accountId:p.accountId,note,ref:old.id,date,time});
  });
  saveAccounts();saveMoneyTxLog();updateHeaderCash();
  return true;
}

function saveInvoiceEdit(){
  const items=window.__editInvItems;const type=window.__editInvoiceType;const id=window.__editInvoiceId;
  if(!items||!items.length){saToast('কমপক্ষে ১টি আইটেম থাকতে হবে','error');return}
  const date=document.getElementById('edit-inv-date').value;
  const time=document.getElementById('edit-inv-time').value;
  const method=document.getElementById('edit-inv-method').value;
  const d=Number(document.getElementById('edit-inv-discount').value||0);
  const vp=Number(document.getElementById('edit-inv-vat').value||0);
  const st=items.reduce((a,x)=>a+(Number(x.qty)||0)*(Number(x.rate)||0),0);
  const tx=Math.max(0,st-d);const vt=tx*vp/100;const total=tx+vt;
  if(type==='sale'){
    const idx=salesRecords.findIndex(x=>String(x.id)===String(id));if(idx<0)return;
    const old=salesRecords[idx];
    const saleMoneyPosted=old.moneyPosted!==false;
    const saleNewDue=(method==='Due')?total:(method==='Mix'?Math.min(total,Number(old.dueAmount||0)):0);
    let salePlan=null;
    if(saleMoneyPosted){salePlan=saPlanInvoicePostings('sale',old,total,method,moneyToCents(saleNewDue));if(!salePlan.ok){saToast(salePlan.msg,'error',4000);return}}
    (old.items||[]).forEach(it=>{if(it.isService||!it.productId)return;const p=productsList.find(x=>x.id===it.productId);if(p&&!p.nonStock&&it.formType!=='mobile')adjustProductVariantStock(p,it.variantKey||'original',Number(it.qty||0));if(p&&it.formType==='mobile')adjustProductVariantStock(p,it.variantKey||'original',1)});
    items.forEach(it=>{if(it.isService||!it.productId)return;const p=productsList.find(x=>x.id===it.productId);if(p&&!p.nonStock&&it.formType!=='mobile')adjustProductVariantStock(p,it.variantKey||'original',-Number(it.qty||0));if(p&&it.formType==='mobile')adjustProductVariantStock(p,it.variantKey||'original',-1)});
    const oldDue=Number(old.dueAmount||(String(old.paymentMethod).toLowerCase()==='due'?old.total:0));
    const newDue=saleNewDue;
    const diffDue=newDue-oldDue;
    if(diffDue!==0){const c=customers.find(x=>x.id===old.customerId);if(c){c.balance=Math.max(0,Number(c.balance||0)+diffDue);saveCustomers()}const w=wholesalers.find(x=>x.id===old.wholesalerId);if(w){w.balance=Math.max(0,Number(w.balance||0)+diffDue);saveWholesalers()}}
    if(salePlan)saApplyInvoicePostings('sale',old,salePlan,date,time);
    const saleSplit=method==='Mix'?(salePlan?.split||old.splitPayments||[]):(String(old.paymentMethod)==='Mix'?[]:old.splitPayments);
    salesRecords[idx]={...old,date,time,paymentMethod:method,splitPayments:saleSplit,heldAmount:saleMoneyPosted?old.heldAmount:total,items,productName:items.map(x=>x.name).join(', '),qty:items.reduce((a,x)=>a+Number(x.qty||0),0),amount:total,total,subtotal:st,discount:d,vat:vt,vatPercent:vp,dueAmount:newDue,imeiList:items.filter(x=>x.imei).map(x=>x.imei),updatedAt:Date.now()};
    saveSalesRecords();saveProducts();
  }else{
    const idx=purchaseRecords.findIndex(x=>String(x.id)===String(id));if(idx<0)return;
    const old=purchaseRecords[idx];
    const purNewDue=(method==='Due')?total:(method==='Mix'?Math.min(total,Number(old.dueAmount||0)):0);
    const purPlan=saPlanInvoicePostings('purchase',old,total,method,moneyToCents(purNewDue));
    if(!purPlan.ok){saToast(purPlan.msg,'error',4000);return}
    (old.items||[]).forEach(it=>{if(!it.productId)return;const p=productsList.find(x=>x.id===it.productId);if(p&&!p.nonStock)adjustProductVariantStock(p,it.variantKey||'original',-Number(it.qty||0))});
    items.forEach(it=>{if(!it.productId)return;const p=productsList.find(x=>x.id===it.productId);if(p)adjustProductVariantStock(p,it.variantKey||'original',Number(it.qty||0))});
    const oldDue=Number(old.dueAmount||(String(old.paymentMethod).toLowerCase()==='due'?old.total:0));
    const newDue=purNewDue;
    const diffDue=newDue-oldDue;
    if(diffDue!==0){const s=suppliers.find(x=>x.id===old.supplierId);if(s){s.balance=Math.max(0,Number(s.balance||0)+diffDue);saveSuppliers()}}
    saApplyInvoicePostings('purchase',old,purPlan,date,time);
    const purSplit=method==='Mix'?(purPlan.split||old.splitPayments||[]):(String(old.paymentMethod)==='Mix'?[]:old.splitPayments);
    purchaseRecords[idx]={...old,date,time,paymentMethod:method,splitPayments:purSplit,items,productName:items.map(x=>x.name).join(', '),qty:items.reduce((a,x)=>a+Number(x.qty||0),0),amount:total,total,subtotal:st,discount:d,vat:vt,vatPercent:vp,dueAmount:newDue,updatedAt:Date.now()};
    savePurchaseRecords();saveProducts();
  }
  logAction('invoice_edit','Edited '+type+' '+String(id).slice(-6));
  hideModal('invoice-edit-modal');
  renderSalesList();renderSaleTrackList();renderPurchaseList();renderProducts();updateDashboard();
  saToast('✅ ইনভয়েস সফলভাবে এডিট হয়েছে','success');
}

  fillAccountSelect('customer-payment-account','acc_cash');
}

function saveCustomerPayment(){
  const c=window.saResolveEntity(customers,window.__activeCustomerId ?? window.__activeCustomerIndex);if(!c)return;
  const dueCents=Math.max(0,moneyToCents(customerBalance(c)));
  let amt=Number(document.getElementById('customer-payment-amount')?.value||0);
  const amtCents=moneyToCents(amt);
  const aid=document.getElementById('customer-payment-account')?.value||'acc_cash';
  const date=document.getElementById('customer-payment-date')?.value||localDateKey(new Date());
  const time=document.getElementById('customer-payment-time')?.value||new Date().toTimeString().slice(0,5);
  const sw=document.getElementById('cust-pay-send-wa')?.checked;
  const trxNote=String(document.getElementById('customer-payment-trx')?.value||'').trim();
  if(!Number.isFinite(amt)||amtCents<=0){saToast('সঠিক পরিমাণ দিন','error');return}
  if(amtCents>dueCents){saToast('বকেয়ার চেয়ে বেশি টাকা গ্রহণ করা যাবে না: '+money(dueCents/100),'error');return}
  const acc=accounts.find(a=>a.id===aid);if(!acc){saToast('একাউন্ট পাওয়া যায়নি','error');return}
  amt=amtCents/100;acc.balance=centsToMoney(moneyToCents(acc.balance||0)+amtCents);saveAccounts();
  if(!Array.isArray(c.manualLedger))c.manualLedger=[];
  const createdAt=Date.now();
  c.manualLedger.push({id:'pay_'+createdAt,type:'credit',amount:amt,note:'Payment ('+acc.name+')'+(trxNote?' • '+trxNote:''),trxId:trxNote,date,time,createdAt});
  c.balance=centsToMoney(dueCents-amtCents);c.updatedAt=createdAt;
  saveCustomers();logMoneyTx({type:'in',amount:amt,accountId:aid,note:'Customer: '+c.name+(trxNote?' • '+trxNote:''),trxId:trxNote,ref:c.id,date,time,createdAt});
  logAction('customer_payment',money(amt)+' from '+c.name);
  hideModal('customer-payment-modal');renderCustomerList();updateDashboard();updateHeaderCash();
  saToast('✅ '+money(amt)+' গৃহীত হয়েছে','success');
  if(sw)setTimeout(()=>sendPaymentReceiptWhatsApp(customers.indexOf(c),amt),400);
}

function openCustomerLedger(i){
  const c=customers[i];if(!c)return;
  const rows=customerLedgerRecords(i,c);
  const ph=c.photo?'<img src="'+c.photo+'" style="width:60px;height:60px;border-radius:50%;object-fit:cover;margin-bottom:8px;">':'';
  showModal('customer-ledger-modal',`<div class="modal-card customer-ledger-modal-card"><div class="customer-ledger-topbar"><button class="ledger-back" onclick="hideModal('customer-ledger-modal')"><i class="fa-solid fa-chevron-left"></i></button><div class="ledger-title">Ledger</div></div><div class="customer-ledger-body">${ph}<div class="customer-ledger-customer">${esc(c.name)}</div><div class="customer-ledger-balance-big">বকেয়া: ${money(customerBalance(c))}</div><div class="customer-ledger-table-wrap"><table class="customer-ledger-table"><thead><tr><th>Date</th><th>Ref</th><th class="money">Dr</th><th class="money">Cr</th><th class="money">Bal</th></tr></thead><tbody>${rows.length?rows.slice(0,100).map(r=>'<tr><td>'+esc(r.date)+(r.time?'<br><small>'+esc(r.time)+'</small>':'')+'</td><td>'+esc(r.ref)+'</td><td class="money">'+Number(r.debit||0).toFixed(2)+'</td><td class="money">'+Number(r.credit||0).toFixed(2)+'</td><td class="money">'+Number(r.balance||0).toFixed(2)+'</td></tr>').join(''):'<tr><td colspan="5" style="text-align:center;padding:25px;">কোনো ইতিহাস পাওয়া যায়নি</td></tr>'}</tbody></table></div><button class="customer-ledger-close" onclick="hideModal('customer-ledger-modal')">Close</button></div></div>`);
}

function customerLedgerRecords(i,c){
  const rows=[];
  salesRecords.forEach(r=>{
    const same=(r.customerId&&c.id&&r.customerId===c.id)||(r.customerName&&String(r.customerName)===String(c.name));
    if(!same||r.moneyPosted===false)return;
    const total=Math.max(0,Number(r.total??r.amount??0));
    const method=String(r.paymentMethod||'').toLowerCase();
    const due=Math.min(total,Math.max(0,Number(r.dueAmount??(method==='due'?total:0))));
    if(total<=0)return;
    const createdAt=Number(r.createdAt||0)||Date.now(),refId=String(r.id).slice(-6);
    const paid=Math.max(0,total-due);
    rows.push({createdAt,date:r.date||'',time:r.time||'',ref:'Sale ('+(r.paymentMethod||'Due')+'): '+refId,debit:total,credit:0});
    if(paid>0)rows.push({createdAt:createdAt+0.001,date:r.date||'',time:r.time||'',ref:'Partial payment: '+refId,debit:0,credit:paid});
  });
  (c.manualLedger||[]).forEach(r=>{rows.push({createdAt:Number(r.createdAt||0)||Date.now(),date:r.date||'',time:r.time||'',ref:r.type==='credit'?'Payment':'Manual',debit:r.type==='credit'?0:Number(r.amount||0),credit:r.type==='credit'?Number(r.amount||0):0,note:r.note||''})});
  const chrono=[...rows].sort((a,b)=>a.createdAt-b.createdAt);let bal=0;chrono.forEach(x=>{bal+=Number(x.debit||0)-Number(x.credit||0);x.balance=bal});chrono.sort((a,b)=>b.createdAt-a.createdAt);
  return chrono;
}

/* ===== SUPPLIER MANAGEMENT ===== */
function supplierIsOpeningLedger(entry){return /\bopening\b/i.test(String(entry?.note||''))||String(entry?.id||'').startsWith('open_')}
function supplierIsPaymentLedger(entry){return entry?.type==='credit'||(entry?.type==='debit'&&!supplierIsOpeningLedger(entry))}
function supplierPurchaseDue(record){const total=Math.max(0,Number(record?.total??record?.amount??0));if(record?.dueAmount!==undefined&&record?.dueAmount!==null)return Math.max(0,Math.min(total,Number(record.dueAmount)||0));return String(record?.paymentMethod||'').toLowerCase()==='due'?total:0}
function supplierPurchasePaid(record){return Math.max(0,Number(record?.total??record?.amount??0)-supplierPurchaseDue(record))}
function supplierManualPayments(s){return (s?.manualLedger||[]).filter(supplierIsPaymentLedger).reduce((sum,l)=>sum+Math.max(0,Number(l.amount||0)),0)}
function supplierTotalPaid(s,purchases){return (purchases||[]).reduce((sum,r)=>sum+supplierPurchasePaid(r),0)+supplierManualPayments(s)}
function supplierSalesFor(supplierId){
  const out=[];
  salesRecords.forEach(r=>(r.items||[]).forEach(it=>{
    const allocations=Array.isArray(it.batchAllocations)&&it.batchAllocations.length?it.batchAllocations:null;
    if(allocations){allocations.forEach(a=>{if(a.supplierId===supplierId){const qty=Number(a.qty||0);out.push({record:r,item:it,qty,amount:qty*Number(it.rate||0),buyAmount:qty*Number(a.buyPrice??it.buyPrice??0),supplierId})}})}
    else if(it.supplierId===supplierId){const qty=Number(it.qty||0);out.push({record:r,item:it,qty,amount:qty*Number(it.rate||0),buyAmount:qty*Number(it.buyPrice||0),supplierId})}
  }));
  return out;
}
function renderSupplierList(){
  const c=document.getElementById('supplier-list-container');if(!c)return;
  const q=(document.getElementById('supp-search-input')?.value||'').trim().toLowerCase();
  const f=suppliers.filter(s=>[s.name,s.phone,s.address,s.nid].some(v=>String(v||'').toLowerCase().includes(q)));
  if(!f.length){c.innerHTML='<div class="empty-list-box">'+(q?'আপনার অনুসন্ধানের সঙ্গে কোনো Supplier মেলেনি':'কোনো Supplier নেই। Add + চাপ দিয়ে নতুন Supplier যোগ করুন।')+'</div>'}
  else c.innerHTML=f.map(s=>{
    const purchases=purchaseRecords.filter(r=>r.supplierId===s.id);
    const totalPurchase=purchases.reduce((sum,r)=>sum+Number(r.total??r.amount??0),0);
    const totalPaid=supplierTotalPaid(s,purchases);
    const sales=supplierSalesFor(s.id);
    const totalSales=sales.reduce((sum,x)=>sum+x.amount,0);
    const stockRows=[];
    productsList.forEach(p=>(p.batches||[]).forEach(b=>{if(b.supplierId===s.id&&Number(b.remainingQty||0)>0)stockRows.push({productId:p.id,qty:Number(b.remainingQty||0)})}));
    const stockQty=stockRows.reduce((sum,x)=>sum+x.qty,0);
    const productCount=new Set(stockRows.map(x=>x.productId)).size;
    const bal=supplierBalance(s);
    const avatar=s.photo?'<img src="'+s.photo+'" alt="">':'<i class="fa-solid fa-user-tie"></i>';
    const phone=s.phone?'📞 '+esc(s.phone):'📞 ফোন নম্বর নেই';
    const address=s.address?'📍 '+esc(s.address):'';
    return `<article class="supplier-card">
      <div class="supplier-card-avatar">${avatar}</div>
      <div class="supplier-card-main">
        <div class="supplier-card-title-row"><h4 class="supplier-card-title">${esc(s.name)}</h4>${s.consignment?'<span class="status-badge successful">Consignment</span>':''}</div>
        <div class="supplier-card-meta">${phone}${address?' &nbsp; • &nbsp; '+address:''}</div>
        <div class="supplier-card-meta">📦 ${productCount}টি পণ্য • ${stockQty} pcs স্টকে</div>
        <div class="supplier-card-stats">
          <div class="supplier-card-stat"><span>মোট Purchase</span><strong>${money(totalPurchase)}</strong></div>
          <div class="supplier-card-stat"><span>মোট Sales</span><strong>${money(totalSales)}</strong></div>
          <div class="supplier-card-stat paid"><span>মোট Payment</span><strong>${money(totalPaid)}</strong></div>
          <div class="supplier-card-stat due"><span>বাকি Due</span><strong>${money(bal)}</strong></div>
          <div class="supplier-card-stat"><span>বর্তমান Stock</span><strong>${stockQty} pcs</strong></div>
        </div>
      </div>
      <div class="supplier-card-actions">
        <button class="btn-blue-pill" style="background:#16a34a;" onclick="openSupplierProfile('${esc(s.id)}')"><i class="fa-solid fa-user"></i> Profile</button>
        <button class="btn-blue-pill" onclick="openSupplierAction(${suppliers.indexOf(s)})"><i class="fa-solid fa-ellipsis"></i> Menu</button>
      </div>
    </article>`;
  }).join('');
  const ft=document.getElementById('supp-footer-info');
  if(ft){const totalDue=suppliers.reduce((sum,x)=>sum+supplierBalance(x),0);ft.innerText='মোট Supplier: '+f.length+' / '+suppliers.length+' • মোট বকেয়া: '+money(totalDue)}
}

function saveSupplier(){
  const ei=Number(window.__editingSupplierIndex??-1);
  const name=(document.getElementById('supp-add-name')?.value||'').trim();
  const phone=(document.getElementById('supp-add-phone')?.value||'').trim();
  const nid=(document.getElementById('supp-add-nid')?.value||'').trim();
  const address=(document.getElementById('supp-add-address')?.value||'').trim();
  const opening=Number(document.getElementById('supp-add-opening')?.value||0);
  const photo=window.__supplierPhotoTemp||null;
  const canNid=hasPerm('canViewSupplierNid');
  const nid_front=canNid?(window.__supplierNidFrontTemp||null):null;
  const nid_back=canNid?(window.__supplierNidBackTemp||null):null;
  const consignment=document.getElementById('supp-add-consignment')?.checked||false;
  if(!name){saToast('সরবরাহকের নাম দিন','error');return}
  if(ei>=0&&suppliers[ei]){suppliers[ei].name=name;suppliers[ei].phone=phone;suppliers[ei].nid=nid;suppliers[ei].address=address;suppliers[ei].photo=photo;if(canNid){suppliers[ei].nid_front=nid_front;suppliers[ei].nid_back=nid_back}suppliers[ei].consignment=consignment;suppliers[ei].updatedAt=Date.now();saveSuppliers();hideModal('supplier-add-modal');renderSupplierList();saToast('✅ আপডেট সম্পন্ন','success');return}
  const dt=getDateTime();
  suppliers.push({id:'supp_'+uid(),name,phone,nid,address,photo,nid_front,nid_back,status:'Active',balance:opening>0?opening:0,manualLedger:opening>0?[{id:'open_'+Date.now(),type:'debit',amount:opening,note:'Opening',date:dt.date,time:dt.time,createdAt:Date.now()}]:[],createdAt:dt.timestamp,consignment});
  saveSuppliers();hideModal('supplier-add-modal');renderSupplierList();
  logAction('supplier_create','Created '+name);saToast('✅ সরবরাহক যোগ হয়েছে','success');
}

function openSupplierAction(i){

function saveWholesalerPayment(){
  const i=Number(window.__activeWholesalerIndex);const w=wholesalers[i];if(!w)return;
  const dueCents=Math.max(0,moneyToCents(wholesalerBalance(w)));
  let amt=Number(document.getElementById('ws-payment-amount')?.value||0);
  const amtCents=moneyToCents(amt);
  const aid=document.getElementById('ws-payment-account')?.value||'acc_cash';
  const date=document.getElementById('ws-payment-date')?.value||localDateKey(new Date());
  const time=document.getElementById('ws-payment-time')?.value||new Date().toTimeString().slice(0,5);
  if(!Number.isFinite(amt)||amtCents<=0){saToast('সঠিক পরিমাণ দিন','error');return}

  const acc=accounts.find(a=>a.id===aid);if(!acc){saToast('একাউন্ট পাওয়া যায়নি','error');return}
  amt=amtCents/100;acc.balance=centsToMoney(moneyToCents(acc.balance||0)+amtCents);saveAccounts();

  w.balance=centsToMoney(dueCents-amtCents);
  saveWholesalers();logMoneyTx({type:'in',amount:amt,accountId:aid,note:'Wholesaler: '+w.shopName,ref:w.id,date,time,createdAt});
  hideModal('wholesaler-payment-modal');renderWholesalerList();updateDashboard();updateHeaderCash();

function wholesalerLedgerRecords(w){
  const rows=[];
  salesRecords.forEach(r=>{
    if(!(r.wholesalerId===w.id||String(r.customerName)===String(w.shopName)))return;
    if(r.moneyPosted===false)return;
    const t=Math.max(0,Number(r.total??r.amount??0));if(t<=0)return;
    const method=String(r.paymentMethod||'').toLowerCase();
    const due=Math.min(t,Math.max(0,Number(r.dueAmount??(method==='due'?t:0))));
    const paid=Math.max(0,t-due),at=Number(r.createdAt||0)||Date.now(),ref=String(r.id).slice(-6);
    rows.push({createdAt:at,date:r.date||'',time:r.time||'',ref:'Sale ('+(r.paymentMethod||'Due')+'): '+ref,debit:t,credit:0});
    if(paid>0)rows.push({createdAt:at+0.001,date:r.date||'',time:r.time||'',ref:'Payment at sale: '+ref,debit:0,credit:paid});
  });
  (w.manualLedger||[]).forEach(r=>{rows.push({createdAt:r.createdAt||Date.now(),date:r.date||'',time:r.time||'',ref:r.type==='credit'?'Payment':'Manual',debit:r.type==='credit'?0:Number(r.amount||0),credit:r.type==='credit'?Number(r.amount||0):0})});
  const chrono=[...rows].sort((a,b)=>a.createdAt-b.createdAt);let bal=0;chrono.forEach(x=>{bal+=Number(x.debit||0)-Number(x.credit||0);x.balance=bal});chrono.sort((a,b)=>b.createdAt-a.createdAt);
  return chrono;
}

/* ===== QR & BARCODE SCANNER ===== */
let scanStream=null,scanTimer=null,scanTarget=null,h5scanner=null,scanBusy=false,torchOn=false,scanTrack=null;
async function triggerBarcodeScan(t){
  if(document.getElementById('scanner-screen'))stopScan();
  scanTarget=t;scanBusy=false;
  const s=document.createElement('div');s.id='scanner-screen';s.className='scanner-screen';
  s.innerHTML='<div class="scanner-video-wrap" id="scanner-video-wrap"><video id="scan-video" playsinline muted autoplay></video><div class="scanner-guide-top">QR / বারকোড স্ক্যান করুন • Tap to focus</div><div class="scan-box"><div class="scan-line"></div><div class="scan-area-text">ALIGN CODE HERE</div></div><div id="scan-reader" style="position:absolute;inset:0;display:none;"></div></div>'
    +'<div class="scanner-controls"><div class="scanner-manual-box" id="scanner-manual-box"><input type="text" id="scanner-manual-input" placeholder="কোড লিখুন (QR / Barcode / IMEI)" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" onclick="submitScannerManual()">OK</button></div>'
    +'<div class="scanner-control-row"><button class="scanner-btn torch" id="scanner-torch-btn" onclick="toggleScannerTorch()"><i class="fa-solid fa-bolt"></i> Flash OFF</button><button class="scanner-btn manual" id="scanner-manual-btn" onclick="openScannerManualEntry()">⌨️ Manual</button><button class="scanner-btn close" onclick="stopScan()">✕ Close</button></div></div>';
  document.body.appendChild(s);
  const manualInput=document.getElementById('scanner-manual-input');
  manualInput?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitScannerManual()}});
  const v=document.getElementById('scan-video');
  document.getElementById('scanner-video-wrap')?.addEventListener('pointerup',refocusScanner);
  if(!navigator.mediaDevices?.getUserMedia){saToast('ক্যামেরা সাপোর্ট নেই — কোড হাতে লিখুন','info',3500);openScannerManualEntry();return}
  try{
    if('BarcodeDetector' in window){
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
      if(!document.getElementById('scanner-screen')){stream.getTracks().forEach(tr=>tr.stop());return}
      scanStream=stream;
      scanTrack=scanStream.getVideoTracks()[0]||null;
      if(scanTrack)try{await scanTrack.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
      v.srcObject=scanStream;await v.play();
      const det=new BarcodeDetector();
      scanTimer=setInterval(async()=>{if(scanBusy||v.readyState<2)return;scanBusy=true;try{const c=await det.detect(v);if(c.length){onScanResult(c[0].rawValue);return}}catch(e){}scanBusy=false},250);
    }else{
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js');
      if(!document.getElementById('scanner-screen'))return;
      document.getElementById('scan-reader').style.display='block';v.style.display='none';
      h5scanner=new Html5Qrcode('scan-reader');
      await h5scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250},videoConstraints:{width:{ideal:1920},height:{ideal:1080},facingMode:'environment',advanced:[{focusMode:'continuous'}]}},txt=>onScanResult(txt),()=>{});
      try{await h5scanner.applyVideoConstraints({width:{ideal:1920},height:{ideal:1080},facingMode:'environment',advanced:[{focusMode:'continuous'}]})}catch(e){}
      await new Promise(resolve=>requestAnimationFrame(resolve));bindScannerVideoTrack();
    }
  }catch(e){
    /* camera denied / unavailable: keep the screen open and fall back to manual entry */
    if(!document.getElementById('scanner-screen'))return;
    saToast('ক্যামেরা চালু করা যায়নি — কোড হাতে লিখুন','info',4000);
    openScannerManualEntry();
  }
}

function openScannerManualEntry(){
  const box=document.getElementById('scanner-manual-box');if(!box)return;
  box.classList.add('show');
  const input=document.getElementById('scanner-manual-input');
  if(input)setTimeout(()=>input.focus(),50);
}
function submitScannerManual(){
  const input=document.getElementById('scanner-manual-input');
  const value=String(input?.value||'').trim();
  if(!value){saToast('কোড লিখুন','error');input?.focus();return}
  onScanResult(value);
}

function bindScannerVideoTrack(){
  if(scanTrack)return scanTrack;
  const video=document.querySelector('#scan-reader video');const stream=video?.srcObject;
  if(stream?.getVideoTracks)scanTrack=stream.getVideoTracks()[0]||null;
  return scanTrack;
}
async function refocusScanner(event){
  const track=bindScannerVideoTrack();if(!track||typeof track.applyConstraints!=='function')return;
  const video=document.querySelector('#scan-video')||document.querySelector('#scan-reader video');
  const rect=video?.getBoundingClientRect(),x=rect?Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)):.5,y=rect?Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height)):.5;
  try{await track.applyConstraints({advanced:[{focusMode:'single-shot',pointsOfInterest:[{x,y}]}]});setTimeout(()=>{try{track.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}},700)}catch(e){
    try{await track.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e2){}
  }
}

async function toggleScannerTorch(){
  const next=!torchOn;
  try{
    if(scanTrack&&typeof scanTrack.applyConstraints==='function'){
      const caps=scanTrack.getCapabilities?.()||{};
      if(!caps.torch){saToast('এই ক্যামেরায় Flashlight সাপোর্ট নেই','info');return}
      await scanTrack.applyConstraints({advanced:[{torch:next}]});
    }else if(h5scanner&&typeof h5scanner.applyVideoConstraints==='function'){
      await h5scanner.applyVideoConstraints({advanced:[{torch:next}]});
    }else{saToast('এই ডিভাইসে Flashlight চালু করা যায়নি','info');return}
    torchOn=next;
    const btn=document.getElementById('scanner-torch-btn');
    if(btn){btn.classList.toggle('active',torchOn);btn.innerHTML='<i class="fa-solid fa-bolt"></i> Flash '+(torchOn?'ON':'OFF')}
  }catch(e){saToast('Flashlight পরিবর্তন করা যায়নি','error')}
}

function loadScript(s){return new Promise((res,rej)=>{if(window.Html5Qrcode)return res();const sc=document.createElement('script');sc.src=s;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}

function onScanResult(code){
  const value=String(code??'').trim();
  if(!value)return;
  if(!document.getElementById('scanner-screen'))return; /* ignore duplicate detections after close */
  const t=scanTarget;
  stopScan();
  if(navigator.vibrate){try{navigator.vibrate(120)}catch(e){}}
  playPOSSound('scan');
  if(t==='__SALE_CART_SCAN__'||t==='__SALE_PICKER_SCAN__'){scanSaleBarcodeToCart(value);return}
  if(t==='__PURCHASE_CART_SCAN__'||t==='__PURCHASE_PICKER_SCAN__'){scanPurchaseBarcodeToCart(value);return}
  const el=t?document.getElementById(t):null;
  if(el){el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}));saToast('✅ '+value,'success',1500)}
  else saToast('স্ক্যান কোড: '+value,'info',3000);
}

function stopScan(){
  if(scanTimer){clearInterval(scanTimer);scanTimer=null}
  if(scanTrack&&torchOn){try{scanTrack.applyConstraints({advanced:[{torch:false}]})}catch(e){}}
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
  scanTrack=null;torchOn=false;
  if(h5scanner){const h=h5scanner;h5scanner=null;h.stop().then(()=>h.clear()).catch(()=>{})}
  scanTrack=null;scanBusy=false;torchOn=false;
  const s=document.getElementById('scanner-screen');if(s)s.remove();
}

 class="form-group"><label style="font-size:12px;font-weight:700;">Status</label><select id="stf-status" class="form-control" ${isEdit&&user.role==='owner'?'disabled':''}><option value="true" ${isEdit&&user.active!==false?'selected':''}>✅ Active</option><option value="false" ${isEdit&&user.active===false?'selected':''}>❌ Inactive</option></select></div><div class="sa-modal-actions"><button class="btn-action btn-secondary" onclick="hideModal('staff-modal')">Cancel</button><button class="btn-action btn-success" onclick="saveStaffUser(${isEdit?"'"+esc(userId)+"'":'null'})">Save</button></div></div>`);

function saveStaffUser(editingId){
  if(!requireOwnerAccess())return;
  const name=document.getElementById('stf-name').value.trim();
  const mobile=document.getElementById('stf-mobile').value.trim();
  const userId=document.getElementById('stf-id').value.trim().toLowerCase();
  const password=document.getElementById('stf-pass').value.trim();
  const role=document.getElementById('stf-role').value;
  const basicSalary=Number(document.getElementById('stf-salary').value||0);
  const active=document.getElementById('stf-status').value==='true';
  if(!name){saToast('নাম দিন','error');return}
  if(!userId){saToast('User ID দিন','error');return}
  if(!editingId&&users.some(u=>String(u.id||'').trim().toLowerCase()===userId)){saToast('এই User ID আগেই ব্যবহৃত হয়েছে','error');return}
  if(!password||password.length<4){saToast('Password কমপক্ষে ৪ ডিজিট হতে হবে','error');return}
  const target=editingId?users.find(u=>String(u.id)===String(editingId)):null;
  if(editingId&&!target)return;
  if(target?.role!=='owner'&&!['staff','manager'].includes(role)){saToast('নতুন Owner অ্যাকাউন্ট এখানে তৈরি করা যাবে না','error');return}
  if(target?.role==='owner'&&!active){saToast('Owner একাউন্ট সক্রিয় থাকতে হবে','error');return}
  if(editingId){const user=target;user.name=name;user.mobile=mobile;user.password=password;user.basicSalary=basicSalary;if(user.role!=='owner'){if(user.role!==role)user.permissions=getDefaultPermissions(role);user.role=role}user.active=active;logAction('staff_edit','Edited '+user.id);saToast('✅ স্টাফ তথ্য সংরক্ষিত','success')}
  else{if(users.some(u=>u.id===userId)){saToast('এই User ID আগেই ব্যবহৃত হয়েছে','error');return}users.push({id:userId,name,mobile,password,role,active,basicSalary,createdAt:Date.now(),lastLogin:null,permissions:getDefaultPermissions(role)});logAction('staff_create','Created '+userId);saToast('✅ নতুন স্টাফ তৈরি হয়েছে','success')}
  saveUsers();if(editingId&&String(editingId)===String(currentUser?.id)){currentUser={...target}}
  hideModal('staff-modal');renderStaffList();renderSidebar();syncStaffPageAccessUI();
}

function deleteStaffUser(userId){
  if(!requireOwnerAccess())return;
  if(String(userId)===String(currentUser?.id)){saToast('নিজের আইডি ডিলিট করা যাবে না','error');return}
  const user=users.find(u=>u.id===userId);if(!user)return;
  if(user.role==='owner'){saToast('Owner একাউন্ট ডিলিট করা যাবে না','error');return}
  if(!confirm('স্টাফ একাউন্টটি ডিলিট করতে চান?'))return;
  users=users.filter(u=>u.id!==userId);saveUsers();
  logAction('staff_delete','Deleted '+userId);renderStaffList();renderSidebar();
}

function toggleStaffBlock(userId){
  if(!requireOwnerAccess())return;
  const user=users.find(u=>String(u.id)===String(userId));if(!user)return;
  if(user.role==='owner'){saToast('Owner অ্যাকাউন্ট ব্লক করা যাবে না','error');return}
  if(String(user.id)===String(currentUser?.id)){saToast('নিজেকে ব্লক করা যাবে না','error');return}
  const block=user.active!==false;
  if(!confirm(block?'এই স্টাফকে Block করলে তার সক্রিয় সেশন বন্ধ হবে এবং নতুন বিক্রি করা যাবে না। চালিয়ে যাবেন?':'এই স্টাফকে Unblock করে আবার লগইন করার অনুমতি দেবেন?'))return;
  user.active=!block;user.blockedAt=block?Date.now():null;user.blockedBy=currentUser?.id||null;saveUsers();
  logAction(block?'staff_block':'staff_unblock',(block?'Blocked ':'Unblocked ')+user.id);
  renderStaffList();renderSidebar();saToast(block?'🚫 স্টাফ ব্লক করা হয়েছে':'✅ স্টাফ আনব্লক করা হয়েছে','success');
}

function openPermModal(userId){
  if(!requireOwnerAccess())return;
  const user=users.find(u=>u.id===userId);if(!user)return;
  if(user.role==='owner'){saToast('Owner-এর পারমিশন পরিবর্তন করা যাবে না','error');return}
  const perms=user.permissions||getDefaultPermissions(user.role);
  const pageHtml=ALL_PAGES.map(p=>{const c=(perms.pages||[]).includes(p.id);return '<label class="perm-item '+(c?'checked':'')+'" onclick="togglePermItem(this, event)"><input type="checkbox" data-perm-page="'+p.id+'" '+(c?'checked':'')+'><span>'+esc(p.label)+'</span></label>'}).join('');
  const actionHtml=ALL_ACTIONS.map(a=>{const c=!!perms[a.id];return '<label class="perm-item '+(c?'checked':'')+'" onclick="togglePermItem(this, event)"><input type="checkbox" data-perm-action="'+a.id+'" '+(c?'checked':'')+'><span>'+esc(a.label)+'</span></label>'}).join('');
  showModal('perm-modal',`<div class="modal-card" style="max-width:720px;"><div class="modal-header">${esc(user.name)} — Permissions</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;"><button type="button" class="btn-blue-pill" onclick="applyStaffPermissionPreset('staff')">Staff preset</button><button type="button" class="btn-blue-pill edit" onclick="applyStaffPermissionPreset('manager')">Manager preset</button><button type="button" class="btn-blue-pill danger" onclick="applyStaffPermissionPreset('clear')">Clear all</button></div><div style="font-size:13px;font-weight:800;margin:10px 0 6px;">📄 PAGES ACCESS</div><div class="perm-grid">${pageHtml}</div><div style="font-size:13px;font-weight:800;margin:16px 0 6px;">⚙️ ACTIONS ACCESS</div><div class="perm-grid">${actionHtml}</div><div style="font-size:13px;font-weight:800;margin:16px 0 6px;">💰 MAX DISCOUNT %</div><div class="form-group"><input type="number" id="perm-max-disc" class="form-control" value="${Number(perms.maxDiscountPercent??0)}" min="0" max="100" step="0.1"></div><div class="sa-modal-actions"><button class="btn-action btn-secondary" onclick="hideModal('perm-modal')">Cancel</button><button class="btn-action btn-success" onclick="savePerm('${esc(userId)}')">Save Permissions</button></div></div>`);
}

function applyStaffPermissionPreset(preset){
  if(!requireOwnerAccess())return;
  const base=preset==='manager'?getDefaultPermissions('manager'):preset==='staff'?getDefaultPermissions('staff'):{pages:[],maxDiscountPercent:0};
  document.querySelectorAll('#perm-modal [data-perm-page]').forEach(cb=>{cb.checked=(base.pages||[]).includes(cb.dataset.permPage);cb.closest('.perm-item')?.classList.toggle('checked',cb.checked)});
  document.querySelectorAll('#perm-modal [data-perm-action]').forEach(cb=>{cb.checked=!!base[cb.dataset.permAction];cb.closest('.perm-item')?.classList.toggle('checked',cb.checked)});
  const max=document.getElementById('perm-max-disc');if(max)max.value=Number(base.maxDiscountPercent||0);
}

function togglePermItem(label,event){if(event)event.preventDefault();const cb=label.querySelector('input[type="checkbox"]');if(!cb)return;cb.checked=!cb.checked;if(cb.checked)label.classList.add('checked');else label.classList.remove('checked')}

function savePerm(userId){
  if(!requireOwnerAccess())return;
  const user=users.find(u=>u.id===userId);if(!user)return;
  const pages=[];document.querySelectorAll('#perm-modal [data-perm-page]').forEach(cb=>{if(cb.checked)pages.push(cb.dataset.permPage)});
  const maxDiscountPercent=Number(document.getElementById('perm-max-disc').value);
  if(!Number.isFinite(maxDiscountPercent)||maxDiscountPercent<0||maxDiscountPercent>100){saToast('Max discount ০ থেকে ১০০% এর মধ্যে দিন','error');return}
  const perms={pages,maxDiscountPercent};
  ALL_ACTIONS.forEach(a=>{const cb=document.querySelector('#perm-modal [data-perm-action="'+a.id+'"]');perms[a.id]=cb?cb.checked:false});
  if(!perms.canManageSalary)perms.pages=perms.pages.filter(p=>p!=='staff');
  user.permissions=perms;saveUsers();
  logAction('permission_change','Updated '+userId);
  hideModal('perm-modal');saToast('✅ পারমিশন সংরক্ষিত হয়েছে','success');
}

/* ===== SALARY ENGINE ===== */
function getCurrentMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}

function formatMonth(m){const [y,mo]=m.split('-');const mn=['January','February','March','April','May','June','July','August','September','October','November','December'];return mn[parseInt(mo)-1]+' '+y}

function getSalaryRecord(sid,m){return salaryRecords.find(s=>s.staffId===sid&&s.month===m)}

function ensureSalaryRecord(sid,m){let rec=getSalaryRecord(sid,m);if(!rec){const staff=users.find(u=>u.id===sid);rec={id:'sal_'+uid(),staffId:sid,staffName:staff?.name||'Unknown',month:m,basicSalary:staff?.basicSalary||0,payments:[],createdAt:Date.now(),updatedAt:Date.now()};salaryRecords.push(rec);saveSalaryRecords()}return rec}

function getSalaryPaidAmount(rec){return (rec.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0)}

function getSalaryDue(rec){return Math.max(0,Number(rec.basicSalary||0)-getSalaryPaidAmount(rec))}

function renderSalaryTab(){
  const box=document.getElementById('salary-list-container');if(!box)return;
  const month=document.getElementById('salary-month-filter')?.value||getCurrentMonth();
  const staffList=users.filter(u=>u.role!=='owner');
  if(!staffList.length){box.innerHTML='<div class="empty-list-box">কোনো স্টাফ নেই</div>';return}
  let tb=0,tp=0,td=0;
  box.innerHTML=staffList.map(staff=>{const rec=ensureSalaryRecord(staff.id,month);const paid=getSalaryPaidAmount(rec);const due=getSalaryDue(rec);tb+=Number(rec.basicSalary||0);tp+=paid;td+=due;const pc=(rec.payments||[]).length;const init=(staff.name||'U').slice(0,2).toUpperCase();return '<div class="staff-card" style="flex-direction:column;align-items:stretch;"><div style="display:flex;gap:10px;align-items:center;"><div class="staff-avatar '+(staff.role==='manager'?'manager':'staff')+'">'+esc(init)+'</div><div class="staff-info" style="flex:1;"><h4>'+esc(staff.name)+' <span class="role-badge '+staff.role+'">'+staff.role+'</span></h4><p>'+esc(formatMonth(month))+'</p></div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;"><div style="background:#e3f2fd;padding:8px;border-radius:8px;text-align:center;"><div style="font-size:10px;">Basic</div><div style="font-size:14px;font-weight:900;color:#0d47a1;">'+money(rec.basicSalary||0)+'</div></div><div style="background:#e8f5e9;padding:8px;border-radius:8px;text-align:center;"><div style="font-size:10px;">Paid ('+pc+')</div><div style="font-size:14px;font-weight:900;color:#1b5e20;">'+money(paid)+'</div></div><div style="background:'+(due>0?'#ffebee':'#f5f5f5')+';padding:8px;border-radius:8px;text-align:center;"><div style="font-size:10px;">Due</div><div style="font-size:14px;font-weight:900;color:'+(due>0?'#b71c1c':'#666')+';">'+money(due)+'</div></div></div><div style="display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;"><button class="btn-blue-pill edit" style="flex:1;" onclick="openSetSalaryModal(\''+esc(staff.id)+'\',\''+month+'\')">⚙️ Set</button><button class="btn-blue-pill" style="flex:1;background:#4caf50;" onclick="openSalaryPaymentModal(\''+esc(staff.id)+'\',\''+month+'\')">💰 Pay</button><button class="btn-blue-pill" style="flex:1;background:#7b1fa2;" onclick="openSalaryHistoryModal(\''+esc(staff.id)+'\',\''+month+'\')">📋</button></div></div>'}).join('');
  const sum=document.getElementById('salary-summary-bar');
  if(sum)sum.innerHTML='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;"><div style="background:#fff;border:1px solid #e1e5e9;border-radius:11px;padding:12px;text-align:center;"><div style="font-size:11px;">Basic</div><div style="font-size:16px;font-weight:900;color:#0d47a1;">'+money(tb)+'</div></div><div style="background:#fff;border:1px solid #e1e5e9;border-radius:11px;padding:12px;text-align:center;"><div style="font-size:11px;">Paid</div><div style="font-size:16px;font-weight:900;color:#2e7d32;">'+money(tp)+'</div></div><div style="background:#fff;border:1px solid #e1e5e9;border-radius:11px;padding:12px;text-align:center;"><div style="font-size:11px;">Due</div><div style="font-size:16px;font-weight:900;color:#c62828;">'+money(td)+'</div></div></div>';
}

function openSetSalaryModal(sid,m){const staff=users.find(u=>u.id===sid);if(!staff)return;const rec=ensureSalaryRecord(sid,m);showModal('salary-set-modal',`<div class="modal-card" style="max-width:420px;"><div class="modal-header">Set Salary</div><div style="background:#f5f7f9;padding:12px;border-radius:10px;margin-bottom:12px;"><div style="font-size:13px;font-weight:700;">${esc(staff.name)}</div><div style="font-size:11px;color:#666;">${esc(formatMonth(m))}</div></div><div class="form-group"><label style="font-size:12px;font-weight:700;">Basic *</label><input type="number" id="salary-basic-input" class="form-control" value="${rec.basicSalary||''}" step="0.01" min="0"></div><div class="sa-modal-actions"><button class="btn-action btn-secondary" onclick="hideModal('salary-set-modal')">Cancel</button><button class="btn-action btn-success" onclick="saveSalaryBasic('${esc(sid)}','${m}')">Save</button></div></div>`)}

function saveSalaryBasic(sid,m){if(!requirePermission('canManageSalary'))return;const basic=Number(document.getElementById('salary-basic-input')?.value||0);if(!Number.isFinite(basic)||basic<0){saToast('সঠিক বেতন দিন','error');return}const rec=ensureSalaryRecord(sid,m);rec.basicSalary=basic;rec.updatedAt=Date.now();saveSalaryRecords();const staff=users.find(u=>u.id===sid);if(staff){staff.basicSalary=basic;saveUsers()}hideModal('salary-set-modal');renderSalaryTab();saToast('✅ বেতন নির্ধারণ সম্পন্ন','success')}

function openSalaryPaymentModal(sid,m){const staff=users.find(u=>u.id===sid);if(!staff)return;const rec=ensureSalaryRecord(sid,m);const due=getSalaryDue(rec);const paid=getSalaryPaidAmount(rec);if(Number(rec.basicSalary||0)<=0){saToast('আগে বেসিক বেতন নির্ধারণ করুন','error');return}if(due<=0){saToast('বকেয়া বেতন নেই','info');return}showModal('salary-payment-modal',`<div class="modal-card" style="max-width:460px;"><div class="modal-header">Salary পরিশোধ</div><div style="background:linear-gradient(135deg,#e8f5e9,#c8e6c9);padding:14px;border-radius:10px;margin-bottom:14px;"><div style="font-size:13px;font-weight:700;">${esc(staff.name)}</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;"><div style="text-align:center;"><div style="font-size:10px;">Basic</div><div style="font-size:14px;font-weight:900;color:#0d47a1;">${money(rec.basicSalary)}</div></div><div style="text-align:center;"><div style="font-size:10px;">Paid</div><div style="font-size:14px;font-weight:900;color:#2e7d32;">${money(paid)}</div></div><div style="text-align:center;"><div style="font-size:10px;">Due</div><div style="font-size:14px;font-weight:900;color:#c62828;">${money(due)}</div></div></div></div><div class="form-group"><label style="font-size:12px;font-weight:700;">Amount *</label><input type="number" id="salary-pay-amount" class="form-control" value="${due}" step="0.01" min="0" max="${due}"></div><div class="form-group"><label style="font-size:12px;font-weight:700;">Account *</label><select id="salary-pay-account" class="form-control"></select></div><div class="sa-modal-actions"><button class="btn-action btn-secondary" onclick="hideModal('salary-payment-modal')">Cancel</button><button class="btn-action btn-success" onclick="saveSalaryPayment('${esc(sid)}','${m}')">Pay</button></div></div>`);fillAccountSelect('salary-pay-account','acc_cash')}

function normalizeBrandPrefixedName(name,brandName,previousBrand=''){
  let clean=String(name||'').trim();
  const stripPrefix=brand=>{
    const value=String(brand||'').trim();if(!value)return;
    const escaped=value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    clean=clean.replace(new RegExp('^'+escaped+'(?:\\s+|[-–:]\\s*|$)','i'),'').trim();
  };
  stripPrefix(previousBrand);stripPrefix(brandName);
  return [String(brandName||'').trim(),clean].filter(Boolean).join(' ');
}

  else if(f.type==='number'){html+=`<input type="number" class="form-control" data-field-id="${esc(f.id)}" value="${esc(v)}" onchange="updateProductFieldTemp('${esc(f.id)}',this.value)">`}

}

/* ===== QR LABEL PRINTING ===== */
function updateQRLabelPrintSummary(){
  const input=document.getElementById('qr-label-quantity'),layout=document.getElementById('qr-label-layout'),summary=document.getElementById('qr-label-print-summary');
  if(!input||!layout||!summary)return;
  const raw=Number(input.value),quantity=Number.isFinite(raw)?Math.min(500,Math.max(1,Math.floor(raw))):1;
  const perPage=layout.value==='a4-30'?30:24,pages=layout.value==='thermal'?quantity:Math.ceil(quantity/perPage);
  summary.textContent=layout.value==='thermal'?quantity+'টি স্টিকার • '+pages+'টি ৫০×৩০ মিমি পেজে প্রিন্ট হবে':quantity+'টি স্টিকার • '+pages+'টি A4 শিটে প্রিন্ট হবে';
}

function makeQRDataUrl(text,size){
  if(!window.QRCode)return '';
  const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-9999px;top:0;';document.body.appendChild(holder);
  try{
    new QRCode(holder,{text:String(text),width:size||200,height:size||200,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});
    const canvas=holder.querySelector('canvas'),img=holder.querySelector('img');
    if(canvas){try{return canvas.toDataURL('image/png')}catch(e){}}
    return img&&img.src?img.src:'';
  }catch(e){return ''}
  finally{holder.remove()}
}

function renderQRLabelPreview(pid){
  const p=productsList.find(x=>x.id===pid),prev=document.getElementById('qr-label-preview'),key=document.getElementById('qr-variant-select')?.value;
  if(!p||!prev||!key||!(p.variants&&p.variants[key]))return;
  const v=p.variants[key],payload=buildVariantQRPayload(p.id,key);
  prev.innerHTML='<div class="product-name">'+esc(p.name)+'</div><div class="free-code" style="color:#1976d2;">🏷️ '+esc(variantLabel(key))+'</div><div id="qrcode-holder"></div><div class="auto-code">'+esc(p.autoCode||'')+'</div><div class="barcode-text">'+esc(v.qrCode||'')+'</div>';
  const holder=document.getElementById('qrcode-holder');
  const src=makeQRDataUrl(payload,200);
  if(holder)holder.innerHTML=src?'<img src="'+src+'" alt="QR code" style="width:130px;height:130px;display:block;">':'<div style="font-size:11px;color:#b45309;padding:8px;">QR generator is unavailable offline. Variant code remains saved on this device.</div>';
  updateQRLabelPrintSummary();
}

    +'<div class="form-group"><label style="font-size:12px;font-weight:700;">প্রিন্ট লেআউট</label><select id="qr-label-layout" class="form-control" onchange="updateQRLabelPrintSummary()"><option value="thermal">থার্মাল রোল — প্রতি পেজে ১টি</option><option value="a4-24">A4 স্টিকার শিট — ২৪টি (৪ × ৬)</option><option value="a4-30">A4 স্টিকার শিট — ৩০টি (৫ × ৬)</option></select><div id="qr-label-print-summary" style="font-size:12px;font-weight:700;color:#374151;margin-top:6px;"></div></div>'
    +'<div class="sa-modal-actions"><button class="btn-action btn-secondary" id="qr-label-close-button">Close</button><button class="btn-action btn-success" id="qr-label-print-button">Print Labels</button></div></div>';

  document.getElementById('qr-label-print-button')?.addEventListener('click',()=>doPrintQRLabel(pid));
  document.getElementById('qr-label-close-button')?.addEventListener('click',()=>hideModal('qr-label-modal'));
  setTimeout(()=>{renderQRLabelPreview(pid);updateQRLabelPrintSummary()},60);

function doPrintQRLabel(pid){
  const p=productsList.find(x=>x.id===pid);if(!p)return;
  const key=document.getElementById('qr-variant-select')?.value;
  if(!key||!(p.variants&&p.variants[key])){saToast('ভেরিয়েন্ট নির্বাচন করুন','error');return}
  if(ensureProductVariantQrCodes(p))saveProducts();
  const variant=p.variants[key],payload=buildVariantQRPayload(p.id,key);
  const qrSrc=makeQRDataUrl(payload,240);
  if(!qrSrc){saToast('QR কোড তৈরি হয়নি','error');return}
  const input=document.getElementById('qr-label-quantity'),rawQuantity=Number(input?.value);
  if(!Number.isInteger(rawQuantity)||rawQuantity<1||rawQuantity>500){saToast('১ থেকে ৫০০-এর মধ্যে পূর্ণসংখ্যা দিন','error');input?.focus();return}
  const w=window.open('','_blank','width=400,height=500');if(!w){saToast('Popup ব্লক রয়েছে','error');return}
  const quantity=rawQuantity,layout=document.getElementById('qr-label-layout')?.value||'thermal';
  const columns=layout==='a4-30'?5:4,perPage=layout==='a4-30'?30:24;
  const labelHTML='<div class="label"><div class="qr"><img src="'+qrSrc+'" alt="QR code"></div><div class="info"><div class="name">'+esc(p.name)+'</div><div class="vname">'+esc(variantLabel(key))+'</div><div class="auto">'+esc(p.autoCode||'')+'</div><div class="code">'+esc(variant.qrCode||'')+'</div></div></div>';
  let pages='';
  if(layout==='thermal'){
    pages=Array.from({length:quantity},()=>'<section class="thermal-page">'+labelHTML+'</section>').join('');
  }else{
    for(let start=0;start<quantity;start+=perPage){
      const count=Math.min(perPage,quantity-start);
      pages+='<section class="a4-page" style="--cols:'+columns+';--rows:6;">'+Array.from({length:count},()=>labelHTML).join('')+'</section>';
    }
  }
  const baseCSS='*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:Arial,sans-serif;color:#000}.label{display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed #bbb;margin:4px;padding:4px}.name{font-weight:900;text-transform:uppercase}.vname{font-weight:900;border:1px solid #000;border-radius:3px;padding:0 3px;display:inline-block}.auto{font-weight:900;letter-spacing:1px}.code{font-weight:700;word-break:break-all}.qr img{display:block;object-fit:contain}';
  const pageCSS=layout==='thermal'
    ?'@media print{@page{size:50mm 30mm;margin:0}html,body{width:50mm;margin:0;padding:0}.thermal-page{width:50mm;height:30mm;margin:0;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden;break-inside:avoid;page-break-inside:avoid}.thermal-page:not(:last-child){break-after:page;page-break-after:always}.thermal-page:last-child{break-after:auto;page-break-after:auto}.label{width:48mm;height:28mm;margin:0;border:0;padding:1mm;flex-direction:row;gap:1.5mm;overflow:hidden}.qr img{width:18mm;height:18mm}.info{width:27mm;text-align:left;overflow:hidden}.name{font-size:7pt;line-height:1.1;max-height:8mm;overflow:hidden;margin:0 0 .8mm}.vname{font-size:7pt;margin:0 0 .8mm}.auto{font-size:8pt}.code{font-size:5.5pt;margin-top:.5mm}}'
    :'@media print{@page{size:A4 portrait;margin:0}html,body{width:210mm;margin:0;padding:0}.a4-page{width:210mm;height:297mm;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:0;overflow:hidden;break-inside:avoid;page-break-inside:avoid}.a4-page:not(:last-child){break-after:page;page-break-after:always}.a4-page:last-child{break-after:auto;page-break-after:auto}.label{min-width:0;min-height:0;margin:0;border:1px dashed #888;padding:2mm;flex-direction:column;overflow:hidden;break-inside:avoid}.info{width:100%;text-align:center}.name{max-width:100%;font-size:8pt;line-height:1.1;max-height:9mm;overflow:hidden;margin:1mm 0}.vname{font-size:8pt;margin-bottom:1mm}.qr img{width:20mm;height:20mm}.auto{font-size:9pt}.code{font-size:6.5pt;margin-top:.5mm}}';
  const printScript='<scr'+'ipt>window.onload=()=>{const imgs=[...document.images];Promise.all(imgs.map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>setTimeout(()=>window.print(),300))}</scr'+'ipt>';
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>QR Labels</title><style>'+baseCSS+pageCSS+'</style></head><body>'+pages+printScript+'</body></html>');
  w.document.close();hideModal('qr-label-modal');logAction('qr_print','QR for '+p.name+' ('+variantLabel(key)+')');saToast('✅ প্রিন্ট কমান্ড পাঠানো হয়েছে','success');
}

/* ===== CATEGORIES & FIELDS ===== */
function categoryNameKey(name){return String(name||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLowerCase()}
function categoryNameExists(name,parentId,exceptId){
  const key=categoryNameKey(name);
  return !!key&&categories.some(c=>String(c.parentId||'')===String(parentId||'')&&c.id!==exceptId&&categoryNameKey(c.name)===key);
}
function categorySubTypeForName(name){
  const key=categoryNameKey(name);
  return key==='original'?'original':key==='copy'?'copy':key==='old'?'old':null;
}
function addRootCategory(){
  const inp=document.getElementById('cat-root-input');const names=splitNames(inp.value);
  if(!names.length){saToast('ক্যাটাগরি নাম দিন','error');return}
  const added=[];
  names.forEach(rawName=>{
    const name=String(rawName||'').trim().replace(/\s+/g,' ');
    if(!name||categoryNameExists(name,null))return;
    const parentId='cat_'+uid();
    categories.push({id:parentId,name,parentId:null,emoji:'📁',formType:'regular',fields:[],createdAt:Date.now()});
    
    added.push(name);
  });
  saveCats();inp.value='';renderCategoryTree();fillProductFilters();
  saToast(added.length?'✅ '+added.length+'টি নতুন Parent Category তৈরি হয়েছে':'এই Parent Category নামগুলো আগে থেকেই আছে',added.length?'success':'info');
}

function renderCategoryTree(){
  const c=document.getElementById('category-tree');if(!c)return;
  if(!categories.length){c.innerHTML='<div class="empty-list-box">কোনো ক্যাটাগরি নেই</div>';return}
  const parents=categories.filter(cat=>!cat.parentId&&!cat.subType);
  c.innerHTML=parents.map(cat=>{
    const children=categories.filter(x=>x.parentId===cat.id);
    const prodCount=productsList.filter(p=>p.categoryId===cat.id).length;
    const childCount=children.reduce((s,ch)=>s+productsList.filter(p=>p.categoryId===ch.id).length,0);
    const totalCount=prodCount+childCount;
    const fieldCount=(cat.fields||[]).length;
    return `<div class="cat-tree-node"><div class="cat-tree-parent"><div class="label"><span onclick="openCategoryEmojiPicker('${esc(cat.id)}')" style="cursor:pointer;">${cat.emoji||'📁'}</span> ${esc(cat.name)} <span class="count">${totalCount}</span>${fieldCount?`<span class="ftag">${fieldCount} fields</span>`:''}</div><div class="cat-actions"><button style="background:#fbbf24;color:#000;" onclick="openCategoryEmojiPicker('${esc(cat.id)}')">😊</button><button style="background:#0ea5e9;" onclick="openFieldsModal('${esc(cat.id)}')">⚙️ Fields</button><button style="background:#ff9800;" onclick="renameCategory('${esc(cat.id)}')">✏️</button><button style="background:#e53935;" onclick="deleteCategory('${esc(cat.id)}')">🗑️</button></div></div>${children.length?`<div class="cat-tree-children">${children.map(ch=>{const cCount=productsList.filter(p=>p.categoryId===ch.id).length;const chFldCount=(ch.fields||[]).length;return `<div class="cat-tree-child"><div class="child-label">${ch.emoji||''} ${esc(ch.name)} <span class="child-count">(${cCount} pcs)</span>${chFldCount?`<span class="child-count">• ${chFldCount} fields</span>`:''}</div><div class="cat-actions"><button style="background:#fbbf24;color:#000;padding:4px 8px;font-size:10px;" onclick="openCategoryEmojiPicker('${esc(ch.id)}')">😊</button><button style="background:#0ea5e9;padding:4px 8px;font-size:10px;" onclick="openFieldsModal('${esc(ch.id)}')">⚙️</button><button style="background:#ff9800;padding:4px 8px;font-size:10px;" onclick="renameCategory('${esc(ch.id)}')">✏️</button><button style="background:#e53935;padding:4px 8px;font-size:10px;" onclick="deleteCategory('${esc(ch.id)}')">🗑️</button></div></div>`}).join('')}</div>`:''}</div>`;
  }).join('');
}

function searchIMEI(){
  const raw=(document.getElementById('imei-search-input')?.value||'').trim(),result=document.getElementById('imei-search-result');if(!result)return;
  if(!raw){result.innerHTML='';return}
  const q=normalizeImei(raw),matches=value=>String(value||'').toLowerCase().includes(raw.toLowerCase())||(q&&normalizeImei(value).includes(q)),purchases=[],sales=[],stocks=[];
  purchaseRecords.forEach(record=>(record.items||[]).forEach(item=>{if(matches(item.imei))purchases.push({record,item})}));
  salesRecords.forEach(record=>(record.items||[]).forEach(item=>{if(matches(item.imei))sales.push({record,item})}));
  const stockIds=new Set(),addStock=p=>{if(p&&!stockIds.has(p.id)){stockIds.add(p.id);stocks.push(p)}};
  productsList.forEach(product=>{const serial=getProductSerialInfo(product),cf=Object.values(product.customFields||{}),vs=Object.values(product.variants||{});
    if(matches(serial.value)||matches(product.imei)||(product.imeiList||[]).some(matches)||cf.some(v=>matches(v))||vs.some(v=>v&&matches(v.sku))||matches(product.freeCode)||matches(product.barcode)||matches(product.autoCode))addStock(product)});
  [...purchases,...sales].forEach(e=>{const p=productsList.find(x=>x.id===e.item.productId);if(p)addStock(p)});
  if(!purchases.length&&!sales.length&&!stocks.length){result.innerHTML='<div class="empty-list-box">কোনো তথ্য পাওয়া যায়নি</div>';return}
  const recordCard=(type,entry)=>{
    const {record,item}=entry,isSale=type==='sale',supplier=suppliers.find(s=>s.id===record.supplierId||s.id===item.supplierId),person=isSale?(record.customerName||'Walk-in'):(supplier?.name||record.supplierName||item.supplierName||'General'),amount=Number(item.qty||0)*Number(item.rate||item.buyPrice||0);
    return `<div class="imei-result-card"><div class="hdr">${isSale?'💰':'📦'} ${esc(item.name||record.productName||'Product')} <span class="imei-type-badge ${isSale?'sale':'purchase'}">${isSale?'SALE':'PURCHASE'}</span></div><div class="row"><b>Invoice:</b> ${esc(String(record.id).slice(-8).toUpperCase())}</div><div class="row"><b>Date:</b> ${esc(record.date||'—')} ${esc(record.time||'')}</div><div class="row"><b>${isSale?'Customer':'Supplier'}:</b> ${supplier&&!isSale?`<a href="#" onclick="event.preventDefault();openSupplierProfile('${esc(supplier.id)}')">${esc(person)}</a>`:esc(person)}</div><div class="row"><b>IMEI:</b> ${esc(item.imei||'—')}</div><div class="row"><b>Qty / line amount:</b> ${Number(item.qty||0)} • ${money(amount)}</div><button class="btn-action btn-blue" style="margin-top:8px;" onclick="printInvoiceById('${esc(record.id)}','${type}')">Print invoice</button></div>`;
  };
  const stockCards=stocks.map(product=>{
    const serial=getProductSerialInfo(product),category=categories.find(c=>c.id===product.categoryId),subId=getProductSubcategoryId(product),purchaseMatches=purchaseRecords.flatMap(record=>(record.items||[]).filter(item=>item.productId===product.id&&item.imei&&matches(item.imei)).map(item=>({record,item}))),saleMatches=salesRecords.flatMap(record=>(record.items||[]).filter(item=>item.productId===product.id&&item.imei&&matches(item.imei)).map(item=>({record,item}))),last=purchaseMatches.sort((a,b)=>Number(b.record.createdAt||0)-Number(a.record.createdAt||0))[0],supplier=last?suppliers.find(s=>s.id===last.record.supplierId):suppliers.find(s=>s.id===product.supplierId),supplierNames=[...new Set((product.batches||[]).filter(batch=>Number(batch.remainingQty||0)>0).map(batch=>batch.supplierName||suppliers.find(s=>s.id===batch.supplierId)?.name).filter(Boolean))],photo=product.image?`<img src="${product.image}" style="width:62px;height:62px;object-fit:cover;border-radius:9px;float:right;margin-left:8px;">`:'';
    const supplierRow=supplier?`<div class="row"><b>Supplier:</b> <a href="#" onclick="event.preventDefault();openSupplierProfile('${esc(supplier.id)}')">${esc(supplier.name)}</a>${last?` • Purchase ${esc(last.record.date||'')} • Buy ${money(last.item.rate||last.item.buyPrice||0)}`:''}</div>`:`<div class="row"><b>Supplier(s):</b> ${esc(supplierNames.join(', ')||product.supplierName||'—')}</div>`;
    const history=(purchaseMatches.length||saleMatches.length)?`<div style="margin-top:8px;font-weight:800;font-size:11px;">IMEI history</div>${purchaseMatches.map(x=>`<div class="row">📥 Purchase ${esc(x.record.date||'')} • ${esc(x.record.supplierName||'Supplier')} • ${money(x.item.rate||x.item.buyPrice||0)}</div>`).join('')}${saleMatches.map(x=>`<div class="row">📤 Sold ${esc(x.record.date||'')} • ${esc(x.record.customerName||'Walk-in')} • ${money(Number(x.item.qty||0)*Number(x.item.rate||0))}</div>`).join('')}`:'';
    return `<div class="imei-result-card">${photo}<div class="hdr">📱 ${esc(product.name)} <span class="imei-type-badge ${saleMatches.length?'sale':'stock'}">${saleMatches.length?'SOLD':'STOCK'}</span></div>${serial.hasValue?`<div class="row"><b>${esc(serial.fieldName)}:</b> ${esc(serial.value)}</div>`:''}<div class="row"><b>Category:</b> ${esc(categoryNamePath(category?.id||'',subId))}</div><div class="row"><b>Stock:</b> ${Number(product.stock||0)} • <b>Buy:</b> ${money(product.buyPrice||0)} • <b>Sale:</b> ${money(product.salePrice||0)}</div>${supplierRow}<div class="row"><b>Barcode / Code:</b> ${esc(product.barcode||'—')} / ${esc(product.freeCode||product.autoCode||'—')}</div>${history}<div style="clear:both"></div></div>`;
  }).join('');
  result.innerHTML=[...stockCards,...purchases.map(entry=>recordCard('purchase',entry)),...sales.map(entry=>recordCard('sale',entry))].join('');
}

function saveProduct(){
  let name=(document.getElementById('prod-name')?.value||'').trim();
  if(!name){saToast('পণ্যের নাম দিন','error');return}
  const catId=document.getElementById('prod-category-id')?.value||'';
  const subCategoryId=(window.__productTempData?.subCategoryId)||(productsList.find(p=>p.id===window.__editingProductId)?.subCategoryId)||null;
  const brandId=document.getElementById('prod-brand')?.value||null;
  const brandName=brands.find(b=>b.id===brandId)?.name||null;
  name=normalizeBrandPrefixedName(name,brandName,window.__productLastBrandName||'');
  const existingSupplierId=productsList.find(p=>p.id===window.__editingProductId)?.supplierId||null;
  const barcode=(document.getElementById('prod-barcode')?.value||'').trim();
  const freeCode=(document.getElementById('prod-freecode')?.value||'').trim();
  const nonStock=document.getElementById('prod-nonstock')?.checked||false;
  const active=document.getElementById('prod-active')?.checked!==false;
  const cat=categories.find(c=>c.id===catId);
  if(!name){saToast('পণ্যের নাম দিন','error');return}
  if(!cat||cat.parentId){saToast('একটি Parent Category নির্বাচন করুন','error');return}
  const merged=getMergedFields(catId,subCategoryId),customFields={};
  try{
    merged.fields.forEach(f=>{
      const el=document.querySelector(`#product-modal [data-field-id="${f.id}"]`);
      const v=el?el.value.trim():'';
      if(f.required&&!v){saToast('"'+f.name+'" ফিল্ড পূরণ করা বাধ্যতামূলক','error');throw new Error('required')}
      customFields[f.id]=v;
    });
  }catch(e){return}
  const serialCandidate=getProductSerialInfo({categoryId:catId,subCategoryId,customFields});
  if(serialCandidate.hasValue){
    const serial=normalizeImei(serialCandidate.value);
    const stockDuplicate=productsList.some(p=>p.id!==window.__editingProductId&&normalizeImei(getProductSerialInfo(p).value)===serial);
    const purchaseDuplicate=purchaseRecords.some(r=>(r.items||[]).some(it=>normalizeImei(it.imei)===serial&&it.productId!==window.__editingProductId));
    const saleDuplicate=salesRecords.some(r=>(r.items||[]).some(it=>normalizeImei(it.imei)===serial&&it.productId!==window.__editingProductId&&!wasSaleImeiReturned(r.id,it.imei)));
    if(stockDuplicate||purchaseDuplicate||saleDuplicate){saToast('এই IMEI অন্য স্টক/ক্রয়/বিক্রয় রেকর্ডে রয়েছে','error');return}
  }
  const formType=getFormTypeByCategoryId(catId);
  const eid=window.__editingProductId;
  const existingProduct=eid?productsList.find(p=>p.id===eid):null;
  const variants=collectProductVariantInputs(existingProduct);if(!variants)return;
  const newProductId=eid||('prod_'+uid());
  {const usedQr=collectVariantQrCodes();Object.keys(variants).forEach(k=>{if(!String(variants[k].qrCode??'').trim())variants[k].qrCode=genVariantCode(newProductId,k,usedQr)})}
  const dupMsg=findVariantDuplicate(variants,eid||null);
  if(dupMsg){playPOSSound('error');saToast(dupMsg,'error',5000);return}
  const vKeys=Object.keys(variants);
  const stock=vKeys.reduce((sum,k)=>sum+Number(variants[k].stock||0),0);
  const lowStockLimit=Number(document.getElementById('prod-low')?.value??existingProduct?.lowStockLimit??5);
  if(!Number.isFinite(lowStockLimit)||lowStockLimit<0){saToast('সঠিক Low Stock Alert দিন','error');return}
  const primaryV=variants.original||variants[vKeys[0]],buyPrice=Number(primaryV.buyPrice||0),salePrice=Number(primaryV.salePrice||0);
  const image=window.__productImageTemp||existingProduct?.image||null;
  const supplierId=existingSupplierId||null;
  const supplierName=suppliers.find(s=>s.id===supplierId)?.name||null;
  if(eid){
    const idx=productsList.findIndex(x=>x.id===eid);if(idx<0)return;
    productsList[idx]={...productsList[idx],name,categoryId:catId,subCategoryId,type:formType==='mobile'?'mobile':'regular',formType,buyPrice,salePrice,stock,variants,lowStockLimit,brandId,brandName,supplierId,supplierName,barcode:barcode||productsList[idx].barcode,freeCode,customFields,nonStock,active,image,updatedAt:Date.now()};

function categoryProfileMatch(item,categoryId,subCategoryId){
  const itemCat=categories.find(c=>c.id===item.categoryId);

  const selected=categories.find(c=>c.id===categoryId),selectedRoot=selected?.parentId||selected?.id;
  if(rootId!==selectedRoot)return false;
  return !selected?.parentId||itemSub===categoryId||itemSub===subCategoryId;
}

function getKnownDeviceModels(){
  const out=new Set();
  productsList.forEach(p=>getMergedFields(p.categoryId,getProductSubcategoryId(p)).fields.filter(f=>/model|device/i.test(f.name||'')).forEach(f=>{const v=String(p.customFields?.[f.id]||'').trim();if(v)out.add(v)}));
  serviceList.forEach(s=>{if(String(s.defaultModel||'').trim())out.add(String(s.defaultModel).trim())});
  return [...out].sort((a,b)=>a.localeCompare(b));
}

function updateStockAdjustVariant(pid){
  const p=productsList.find(x=>x.id===pid),key=document.getElementById('stock-adjust-variant')?.value||'original';if(!p)return;
  const stock=Number(getProductVariant(p,key).stock||0),input=document.getElementById('stock-adjust-value'),label=document.getElementById('stock-adjust-current');
  if(input)input.value=stock;
  if(label)label.textContent='নির্বাচিত ভ্যারিয়েন্টের বর্তমান স্টক: '+stock+' • মোট স্টক: '+Number(p.stock||0);
}
function saveStockAdjust(pid){
  const p=productsList.find(x=>x.id===pid);if(!p)return;
  const input=document.getElementById('stock-adjust-value'),newVariantStock=Number(input?.value),variantKey=document.getElementById('stock-adjust-variant')?.value||'original',oldStock=Number(p.stock||0),oldVariantStock=Number(getProductVariant(p,variantKey).stock||0),newStock=oldStock-oldVariantStock+newVariantStock,supplierId=document.getElementById('stock-adjust-supplier')?.value||null;
  const note=(document.getElementById('stock-adjust-note')?.value||'').trim();
  if(!Number.isFinite(newVariantStock)||newVariantStock<0){saToast('শূন্য বা তার বেশি সঠিক স্টক দিন','error');return}
  if(getFormTypeByCategoryId(p.categoryId)==='mobile'&&(!Number.isInteger(newVariantStock)||newStock>1)){saToast('IMEI-ভিত্তিক Mobile পণ্যের মোট স্টক ০ অথবা ১ হতে পারে','error');return}
  const delta=newVariantStock-oldVariantStock,supplier=suppliers.find(s=>s.id===supplierId);
  if(!Array.isArray(p.batches))p.batches=[];
  if(supplier&&p.supplierId===supplierId){
    const totalBatched=p.batches.reduce((sum,b)=>sum+Number(b.remainingQty||0),0),unattributed=Math.max(0,oldStock-totalBatched);
    if(unattributed>0)p.batches.push({batchId:'bat_'+uid(),supplierId,supplierName:supplier.name,buyPrice:Number(p.buyPrice||0),qty:unattributed,remainingQty:unattributed,date:'',purchaseInvoiceId:null,createdAt:Number(p.createdAt||Date.now()),isAdjustment:true,note:'Legacy stock attribution'});
  }else{
    let totalBatched=p.batches.reduce((sum,b)=>sum+Number(b.remainingQty||0),0);
    if(totalBatched<oldStock){
      const gap=oldStock-totalBatched;
      p.batches.push({batchId:'bat_'+uid(),supplierId:null,supplierName:'Unassigned adjustment',buyPrice:Number(p.buyPrice||0),qty:gap,remainingQty:gap,date:'',purchaseInvoiceId:null,createdAt:Number(p.createdAt||Date.now()),isAdjustment:true,note:'Legacy stock synchronization'});
    }else if(totalBatched>oldStock){
      let excess=totalBatched-oldStock;
      p.batches.slice().sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)).forEach(batch=>{
        if(excess<=0)return;
        const trim=Math.min(excess,Number(batch.remainingQty||0));
        batch.remainingQty=Number(batch.remainingQty||0)-trim;excess-=trim;
      });
    }
  }
  if(supplier&&delta<0){
      const available=(p.batches||[]).filter(b=>String(b.variantKey||'original')===String(variantKey)&&String(b.supplierId||'')===String(supplierId)).reduce((sum,b)=>sum+Number(b.remainingQty||0),0);
    if(Math.abs(delta)>available){saToast('এই Supplier-এর attributable stock '+available+'—এর বেশি কমানো যাবে না','error');return}
  }
  if(supplier&&delta!==0){
    if(delta>0)p.batches.push({batchId:'bat_'+uid(),supplierId,supplierName:supplier.name,buyPrice:Number(getProductVariant(p,variantKey).buyPrice||0),variantKey,qty:delta,remainingQty:delta,date:localDateKey(new Date()),purchaseInvoiceId:null,createdAt:Date.now(),isAdjustment:true,note});
    else{
      let remaining=Math.abs(delta);
      p.batches.filter(b=>String(b.variantKey||'original')===String(variantKey)&&b.supplierId===supplierId&&Number(b.remainingQty)>0).sort((a,b)=>Number(a.createdAt||0)-Number(b.createdAt||0)).forEach(b=>{if(!remaining)return;const take=Math.min(remaining,Number(b.remainingQty||0));b.remainingQty=Number(b.remainingQty||0)-take;remaining-=take});
    }
  }else if(!supplier&&delta!==0){
    if(delta>0)p.batches.push({batchId:'bat_'+uid(),supplierId:null,supplierName:'Unassigned adjustment',buyPrice:Number(getProductVariant(p,variantKey).buyPrice||0),variantKey,qty:delta,remainingQty:delta,date:localDateKey(new Date()),purchaseInvoiceId:null,createdAt:Date.now(),isAdjustment:true,note:note||'Stock adjustment without supplier'});
    else{
      let remaining=Math.abs(delta);
      p.batches.filter(b=>String(b.variantKey||'original')===String(variantKey)&&Number(b.remainingQty)>0).sort((a,b)=>Number(a.createdAt||0)-Number(b.createdAt||0)).forEach(b=>{if(!remaining)return;const take=Math.min(remaining,Number(b.remainingQty||0));b.remainingQty=Number(b.remainingQty||0)-take;remaining-=take});
    }
  }
  setProductVariantStock(p,variantKey,newVariantStock);p.updatedAt=Date.now();if(!Array.isArray(p.stockAdjustments))p.stockAdjustments=[];
  p.stockAdjustments.push({id:'adj_'+uid(),date:localDateKey(new Date()),createdAt:Date.now(),oldStock,newStock,oldVariantStock,newVariantStock,variantKey,delta,supplierId,supplierName:supplier?.name||null,note});
  saveProducts();hideModal('stock-adjust-modal');renderProducts();updateDashboard();if(currentSupplierProfileId)renderSupplierProfile();
  logAction('stock_adjust',p.name+' ('+variantKey+'): '+oldStock+' → '+newStock+(supplier?' ('+supplier.name+')':''),pid);
  saToast('✅ স্টক আপডেট হয়েছে'+(supplier?' • '+supplier.name:''),'success');
}

function rootCategoryList(){return categories.filter(c=>!c.parentId&&!c.subType)}
function variantRecordRefs(id,catId){let n=0;[salesRecords,purchaseRecords].forEach(l=>l.forEach(r=>(r.items||[]).forEach(it=>{if(it.variantKey===id&&(!catId||getRootCategoryId(it.categoryId||'')===catId))n++})));returnRecords.forEach(r=>{if(!catId&&r.variantKey===id)n++});return n}
function variantStats(id){
  const ps=productsList.filter(p=>p.variants&&p.variants[id]),buys=ps.map(p=>Number(p.variants[id].buyPrice||0)),sells=ps.map(p=>Number(p.variants[id].salePrice||0));
  const rng=a=>a.length?(Math.min(...a)===Math.max(...a)?money(a[0]):money(Math.min(...a))+' – '+money(Math.max(...a))):'—';
  return{products:ps,stock:ps.reduce((s,p)=>s+Number(p.variants[id].stock||0),0),buy:rng(buys),sell:rng(sells),refs:variantRecordRefs(id)};
}
function variantUsedInCategory(id,catId){
  return productsList.some(p=>getRootCategoryId(p.categoryId)===catId&&p.variants&&p.variants[id])||variantRecordRefs(id,catId)>0;
}

    if(dropped.length){saToast('"'+variantLabel(dropped[0])+'" ভেরিয়েন্টে স্টক আছে—আগে স্টক সমন্বয় করুন, তারপর বাদ দিন','error',4000);return null}
