 if(!localStorage.getItem(BACKUP)){
  const keys=Object.keys(localStorage).filter(k=>k.startsWith('pos_'));
  const snap={createdAt:new Date().toISOString(),data:{}};keys.forEach(k=>snap.data[k]=localStorage.getItem(k));
  localStorage.setItem(BACKUP,JSON.stringify(snap));
 }
}catch(e){console.warn('migration backup skipped',e)}
(categories||[]).forEach(c=>{if(!c.parentId&&c.autoPurchase===undefined)c.autoPurchase=true;});
try{localStorage.setItem('pos_categories',JSON.stringify(categories));}catch(_){}
try{buildRegistry()}catch(e){console.warn('IMEI migration report failed',e)}
// Ensure category setting is visible while preserving the original tree renderer.
const oldTree=window.renderCategoryTree;
if(typeof oldTree==='function')window.renderCategoryTree=function(){
 oldTree();
 const host=document.getElementById('category-tree');if(!host)return;
 (categories||[]).filter(c=>!c.parentId&&!c.subType).forEach(cat=>{
  const node=[...host.querySelectorAll('.cat-tree-node')].find(n=>n.textContent.includes(cat.name));
  if(!node||node.querySelector('[data-auto-purchase="'+cat.id+'"]'))return;
  const bar=document.createElement('div');bar.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:#fff7ed;border-radius:8px;margin-top:8px;font-size:12px';
  bar.innerHTML='<span>অটো পারচেজ (স্টক কম হলে)</span><label style="display:flex;gap:6px;align-items:center;font-weight:800"><input data-auto-purchase="'+String(cat.id).replace(/"/g,'&quot;')+'" type="checkbox" '+(cat.autoPurchase!==false?'checked':'')+'> '+(cat.autoPurchase!==false?'চালু':'বন্ধ')+'</label>';
  node.appendChild(bar);
 });
};
document.addEventListener('change',function(e){
 const el=e.target;if(!el||!el.matches('[data-auto-purchase]'))return;
 const c=(categories||[]).find(x=>String(x.id)===String(el.dataset.autoPurchase));if(!c)return;
 c.autoPurchase=!!el.checked;try{localStorage.setItem('pos_categories',JSON.stringify(categories));}catch(_){}
 if(typeof saToast==='function')saToast('অটো পারচেজ '+(c.autoPurchase?'চালু':'বন্ধ'),'success');
 if(typeof renderCategoryTree==='function')renderCategoryTree();
});
const originalAuto=window.createAutoPurchaseEntry;
if(typeof originalAuto==='function')window.createAutoPurchaseEntry=function(sale,item,supplierId,supplierName,buyPrice){
 const p=(productsList||[]).find(x=>String(x.id)===String(item?.productId));const root=typeof getRootCategoryId==='function'?getRootCategoryId(item?.categoryId||p?.categoryId):'';
 const cat=(categories||[]).find(c=>String(c.id)===String(root||p?.categoryId));
 if(cat&&cat.autoPurchase===false)return null;
 return originalAuto.apply(this,arguments);
};
// IMEI registration API shared by legacy screens and future edits.
window.saRegisterIMEI=registryAdd;
window.saGetIMEIRegistry=()=>window.imeiRegistry;
window.saIMEIDuplicateReport=()=>safeJson(localStorage.getItem('pos_imei_duplicate_report'),{});
// Validate sale cart before original commit; the legacy function remains authoritative for all other checks.
const oldFinalize=window.finalizeSaleCommit;
if(typeof oldFinalize==='function')window.finalizeSaleCommit=function(cart){
 const list=cart||[],bad=[];
 for(const it of list){
  if(!it||it.isService||it.isManual)continue;
  const p=(productsList||[]).find(x=>String(x.id)===String(it.productId));if(!p)continue;
  const root=typeof getRootCategoryId==='function'?getRootCategoryId(it.categoryId||p.categoryId):'';
  const cat=(categories||[]).find(c=>String(c.id)===String(root||p.categoryId));
  if(cat?.autoPurchase===false){
   const vObj=typeof getProductVariant==='function'?getProductVariant(p,it.variantKey||'original'):null;
   const stock=vObj?Number(vObj.stock||0):Number(p.stock||0);
   const already=list.filter(x=>String(x.productId)===String(it.productId)&&String(x.variantKey||'original')===String(it.variantKey||'original')).reduce((a,x)=>a+Number(x.qty||0),0);
   if(already>stock){bad.push({name:it.name,stock});}
  }
  if(it.imei){const n=norm(it.imei);if(list.filter(x=>norm(x.imei)===n).length>1){if(typeof saToast==='function')saToast('একই IMEI কার্টে একাধিকবার আছে','error');return;} }
 }
 if(bad.length){if(typeof saToast==='function')saToast('স্টকে মাত্র '+bad[0].stock+' পিস আছে: '+bad[0].name,'error');return;}
 return oldFinalize.apply(this,arguments);
};
// Wholesaler profile as a dedicated mobile-friendly overlay, linked from the existing list.
window.closeWholesalerProfile=function(){document.getElementById('ws-profile-overlay')?.remove()};
window.openWholesalerProfile=function(id){
 const w=(wholesalers||[]).find(x=>String(x.id)===String(id));if(!w)return;
 const sales=(salesRecords||[]).filter(r=>String(r.wholesalerId||r.carigorId||r.customerId||'')===String(id)||(r.items||[]).some(i=>String(i.wholesalerId||'')===String(id)));
 const total=sales.reduce((a,r)=>a+Number(r.total||r.amount||0),0);
 const paid=sales.reduce((a,r)=>a+Number(r.paidAmount||r.paid||0),0);
 const due=typeof wholesalerBalance==='function'?Number(wholesalerBalance(w)||0):Math.max(0,total-paid);
 const profit=sales.reduce((a,r)=>a+Number(r.profit||0),0);
 const bought=sales.flatMap(r=>(r.items||[]).map(i=>({r,i})));
 const html='<div class="modal-overlay active" id="ws-profile-overlay" style="z-index:10000"><div class="modal-card" style="max-width:760px"><div class="modal-header">🏪 দোকানদার প্রোফাইল</div><h2>'+esc(w.shopName||'দোকানদার')+'</h2><p>মালিক: '+esc(w.ownerName||'—')+' · মোবাইল: '+esc(w.phone||'—')+'</p><p>ঠিকানা: '+esc(w.address||'—')+'</p><div class="summary-grid" style="margin-top:12px"><div class="summary-card"><div class="summary-details"><div class="title">ক্রেডিট লিমিট</div><div class="value">'+money(w.creditLimit||0)+'</div></div></div><div class="summary-card"><div class="summary-details"><div class="title">বর্তমান বাকি</div><div class="value">'+money(due)+'</div></div></div><div class="summary-card"><div class="summary-details"><div class="title">মোট বিক্রি</div><div class="value">'+money(total)+'</div></div></div><div class="summary-card"><div class="summary-details"><div class="title">মোট পেমেন্ট</div><div class="value">'+money(paid)+'</div></div></div><div class="summary-card"><div class="summary-details"><div class="title">মোট লাভ</div><div class="value">'+money(profit)+'</div></div></div></div><h3 class="section-title">কেনা পণ্য ও ইনভয়েস</h3>'+ (bought.length?bought.map(({r,i})=>'<div class="tx-row"><b>'+esc(i.name||'পণ্য')+'</b> · '+esc(i.variantName||i.variantKey||'—')+' · Qty '+Number(i.qty||0)+' · '+money(i.rate||0)+'<div class="tx-meta">'+esc(r.date||'')+' '+esc(r.time||'')+' · IMEI '+esc(i.imei||'—')+' · Invoice '+esc(r.invoiceNo||r.id||'—')+'</div></div>').join(''):'<div class="empty-list-box">কোনো বিক্রির রেকর্ড পাওয়া যায়নি</div>')+'<button class="btn-action btn-secondary" onclick="closeWholesalerProfile()">বন্ধ করুন</button></div></div>';
 document.body.insertAdjacentHTML('beforeend',html);
};
const oldWsList=window.renderWholesalerList;
if(typeof oldWsList==='function')window.renderWholesalerList=function(){oldWsList();const c=document.getElementById('wholesaler-list-container');if(!c)return;c.querySelectorAll('.entity-card').forEach(card=>{if(card.querySelector('[data-ws-profile]'))return;const h=card.querySelector('h4');if(!h)return;const w=(wholesalers||[]).find(x=>(x.shopName||'')===h.textContent);if(!w)return;const b=document.createElement('button');b.className='btn-blue-pill';b.textContent='প্রোফাইল';b.dataset.wsProfile='1';b.onclick=()=>openWholesalerProfile(w.id);card.appendChild(b);});};
// Backup registry is included by wrapping export with a temporary key list-compatible snapshot.
const oldBackup=window.saBackupAll;
if(typeof oldBackup==='function')window.saBackupAll=function(){try{persistRegistry();localStorage.setItem('pos_imei_duplicate_report',JSON.stringify(window.saIMEIDuplicateReport()));}catch(_){}return oldBackup.apply(this,arguments);};
// Keep category/registry changes persisted on page lifecycle.
window.addEventListener('beforeunload',persistRegistry);
})();
</script>


<script id="sa-v1-database-ready-patch">
