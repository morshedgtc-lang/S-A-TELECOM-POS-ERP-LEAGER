function getProductVariant(product,variantKey='original'){
  const variants=ensureProductVariants(product);
  const key=variants?.[variantKey]?variantKey:Object.keys(variants||{})[0];
  return variants?.[key]||{buyPrice:0,salePrice:0,stock:0};
}

function updateCartVariant(isSale,index,variantKey){
  const cart=isSale?saSaleCart:saPurchaseCart,item=cart[index];
  if(!item||!item.productId)return;
  const product=productsList.find(p=>String(p.id)===String(item.productId));
  if(!product)return;
  const variant=getProductVariant(product,variantKey);
  if(!variantUsable(variantKey)){saToast('এই ভেরিয়েন্ট বন্ধ করা আছে','error');saRenderCart(isSale);return}
  item.variantKey=variantKey;item.variantName=variantLabel(variantKey);
  item.buyPrice=Number(variant.buyPrice||0);
  item.salePrice=Number(variant.salePrice||0);
  item.rate=Number(isSale?variant.salePrice:variant.buyPrice)||0;
  saRenderCart(isSale);
  if(isSale)saveDraftCart('sale');else savePurchaseDraft();
}

function updatePurchaseCartSellPrice(index,value){
  const item=saPurchaseCart[index];if(!item)return;
  const price=Number(value);
  if(!Number.isFinite(price)||price<0){saToast('সঠিক Sell Price দিন','error');saRenderCart(false);return}
  item.salePrice=centsToMoney(moneyToCents(price));
  savePurchaseDraft();
}

function updateCartItemSupplier(index,supplierId){
  const item=saSaleCart[index];if(!item)return;
  item.supplierId=supplierId||null;
  const sup=suppliers.find(s=>s.id===supplierId);
  item.supplierName=sup?.name||null;
  if(supplierId){
    const lastPrice=getSupplierLastBuyPrice(supplierId,item.productId);
    const prod=productsList.find(p=>p.id===item.productId);
    if(lastPrice&&lastPrice.price>0){item.buyPrice=lastPrice.price}
    else if(prod&&!item.buyPrice){item.buyPrice=Number(getProductVariant(prod,item.variantKey||'original').buyPrice||0)}
  }
  saRenderCart(true);saveDraftCart('sale');
}

function posRejectInput(){
  /* error sound + vibrate + shake the active input now; returned fn shakes the re-rendered input */
  playPOSSound('error');
  if(navigator.vibrate){try{navigator.vibrate([80,40,80])}catch(e){}}
  const shake=el=>{if(!el)return;el.classList.remove('input-error-shake');void el.offsetWidth;el.classList.add('input-error-shake');setTimeout(()=>el.classList.remove('input-error-shake'),500)};
  const active=document.activeElement;if(active&&active.tagName==='INPUT')shake(active);
  return selector=>{if(selector)shake(document.querySelector(selector))};
}

function updateCartItemBuyPrice(index,val){
  const item=saSaleCart[index];if(!item)return;
  const newPrice=Number(val)||0;
  if(newPrice<0){const shakeAfter=posRejectInput();saToast('সঠিক মূল্য দিন','error');saRenderCart(true);shakeAfter('#buy-price-input-'+index);return}
  if(newPrice>Number(item.rate||0)){
    const shakeAfter=posRejectInput();
    saToast('❌ ক্রয়মূল্য ('+money(newPrice)+') বিক্রয়মূল্য ('+money(item.rate)+') এর চেয়ে বেশি হতে পারবে না!','error',4000);
    saRenderCart(true);shakeAfter('#buy-price-input-'+index);return;
  }
  item.buyPrice=newPrice;
  saRenderCart(true);saveDraftCart('sale');
}

function updateCartRate(isSale,i,v){
  if(!hasPerm('canEditPrice')){saToast('Price পরিবর্তনের অনুমতি নেই','error');saRenderCart(isSale);return}
  const cart=isSale?saSaleCart:saPurchaseCart;
  if(!cart[i])return;
  const sel='[onchange^="updateCartRate('+(isSale?'true':'false')+','+i+',"]';
  const rate=Number(v);
  if(!Number.isFinite(rate)||rate<0){
    const shakeAfter=posRejectInput();
    saToast('সঠিক মূল্য দিন','error');saRenderCart(isSale);shakeAfter(sel);return;
  }
  if(isSale&&!hasPerm('canSellBelowCost')){
    const floor=getSaleFloorPrice(cart[i]);
    if(rate+0.001<floor){
      const shakeAfter=posRejectInput();
      const floorTxt='৳'+(Math.round(floor*100)/100);
      saToast('❌ ক্রয়মূল্য '+floorTxt+' — এর নিচে বিক্রি করা যাবে না!','error',4000);
      saRenderCart(true);shakeAfter(sel);return;
    }
  }
  cart[i].rate=centsToMoney(moneyToCents(rate));saRenderCart(isSale);
  if(isSale)saveDraftCart('sale');else savePurchaseDraft();
}

function getSaleFloorPrice(item){
  const product=item?.productId?productsList.find(p=>String(p.id)===String(item.productId)):null;
  const itemCost=Number(item?.buyPrice),productCost=Number(getProductVariant(product,item?.variantKey||'original').buyPrice);
  return Math.max(Number.isFinite(itemCost)&&itemCost>0?itemCost:0,Number.isFinite(productCost)&&productCost>0?productCost:0);
}

function saRemoveCartItem(isSale,i){

function addSalePickerItem(pid,qo){
  const p=productsList.find(x=>x.id===pid);if(!p)return;
  const formType=getFormTypeByCategoryId(p.categoryId);
  const isMobileForm=formType==='mobile';
  const cat=categories.find(c=>c.id===p.categoryId);
  const subType=cat?.subType||null;
  const inp=document.getElementById('picker-qty-'+pid);
  const q=isMobileForm?1:Number(qo??inp?.value??1);
  if(!Number.isFinite(q)||q<=0){saToast('সঠিক পরিমাণ দিন','error');return}
  const ex=isMobileForm?null:saSaleCart.find(x=>x.productId===p.id&&!x.isService);
  const nq=(ex?Number(ex.qty):0)+q;
  const serial=getProductSerialInfo(p);
  
  const supOpts=getProductSupplierOptions(p.id);
  let bestSupId=saSaleGlobalSupplier?.id||null;
  let bestSupName=saSaleGlobalSupplier?.name||null;
  if(!bestSupId&&supOpts.length){
    const withStock=supOpts.find(o=>o.stock>0);
    if(withStock){bestSupId=withStock.id;bestSupName=withStock.name}
    else{bestSupId=supOpts[0].id;bestSupName=supOpts[0].name}
  }
  const lastP=bestSupId?getSupplierLastBuyPrice(bestSupId,p.id):null;
  const autoBuy=lastP?lastP.price:Number(p.buyPrice||0);

  const doAdd=imei=>{
    if(imei&&knownImeiInSale(imei)){saToast('⚠️ এই IMEI আগে বিক্রি হয়েছে','error');return}
    if(imei&&saSaleCart.some(x=>normalizeImei(x.imei)===normalizeImei(imei))){saToast('⚠️ IMEI ইতিমধ্যে কার্টে যুক্ত রয়েছে','error');return}
    if(ex){ex.qty=nq;ex.rate=Number(p.salePrice||ex.rate||0);if(imei)ex.imei=imei}
    else{
      saSaleCart.push({productId:p.id,name:p.name,qty:q,rate:Number(p.salePrice||0),buyPrice:autoBuy,categoryId:p.categoryId,formType:formType,subType:subType,supplierId:bestSupId,supplierName:bestSupName,imei:imei||'',customFields:{...(p.customFields||{})},isService:false});
    }
    saRenderCart(true);saveDraftCart('sale');
    saToast('✅ '+p.name+' যোগ হয়েছে','success',1500);
    if(inp)inp.value='1';
  };
  if(isMobileForm){
    if(serial.hasValue)doAdd(serial.value);
    else openIMEIModal(p.name,doAdd);
  }else doAdd('');
}

/* ===== VARIANT-WISE QR (v26.0) ===== */
function collectVariantQrCodes(){
  const used=new Set();
  productsList.forEach(p=>{const vs=p&&p.variants&&typeof p.variants==='object'?p.variants:{};Object.keys(vs).forEach(k=>{const c=String(vs[k]?.qrCode??'').trim();if(c)used.add(c)})});
  return used;
}
function genVariantCode(productId,variantKey,usedSet){
  const used=usedSet||collectVariantQrCodes();
  const base=/^var_/i.test(String(variantKey||''))?variantLabel(variantKey):String(variantKey||'');
  const suffix=(String(base).replace(/[^a-z0-9]/gi,'').slice(0,4).toUpperCase())||'VARI';
  let code,guard=0;
  do{code='V'+String(Math.floor(100000+Math.random()*900000))+'-'+suffix;guard++}while(used.has(code)&&guard<1000);
  used.add(code);
  return code;
}
function buildVariantQRPayload(productId,variantKey){return String(productId)+'|'+String(variantKey)}
function parseVariantQRPayload(raw){
  const text=String(raw??'').trim();if(!text)return null;
  const idx=text.indexOf('|');if(idx<=0||idx>=text.length-1)return null;
  const productId=text.slice(0,idx).trim(),variantKey=text.slice(idx+1).trim();
  if(!productId||!variantKey||/\s/.test(productId)||/\s/.test(variantKey))return null;
  return{productId,variantKey};
}
function ensureProductVariantQrCodes(product,usedSet){
  if(!product)return false;
  const vs=ensureProductVariants(product);if(!vs)return false;
  const used=usedSet||collectVariantQrCodes();let changed=false;
  Object.keys(vs).forEach(k=>{if(!String(vs[k].qrCode??'').trim()){vs[k].qrCode=genVariantCode(product.id,k,used);changed=true}});
  return changed;
}
function findVariantDuplicate(variants,selfId){
  const norm=x=>String(x??'').trim().toLowerCase();
  const seen={qrCode:{},sku:{}};
  const fields=[['qrCode','QR কোড'],['sku','SKU']];
  for(const k of Object.keys(variants)){
    const v=variants[k]||{};
    for(const [field,label] of fields){
      const val=norm(v[field]);if(!val)continue;
      if(seen[field][val]!==undefined)return '❌ এই পণ্যের "'+variantLabel(seen[field][val])+'" ও "'+variantLabel(k)+'" ভেরিয়েন্টে একই '+label+' ('+v[field]+') দেওয়া যাবে না';
      seen[field][val]=k;
      for(const p of productsList){
        if(selfId&&p.id===selfId)continue;
        const vs=p.variants||{};
        for(const pk of Object.keys(vs)){if(norm(vs[pk]?.[field])===val)return '❌ '+label+' "'+v[field]+'" আগে থেকেই "'+p.name+'" ('+variantLabel(pk)+') এ ব্যবহৃত হয়েছে'}
      }
    }
  }
  return '';
}
function findVariantByCode(code){
  const c=String(code??'').trim().toLowerCase();if(!c)return null;
  for(const p of productsList){
    const vs=ensureProductVariants(p)||{};
    for(const k of Object.keys(vs)){const v=vs[k]||{};if([v.qrCode,v.sku].some(x=>String(x??'').trim().toLowerCase()===c))return{product:p,variantKey:k}}
  }
  return null;
}
function checkScannedVariant(p,key){
  const vs=ensureProductVariants(p)||{};
  if(!vs[key])return{error:'"'+p.name+'" এ "'+variantLabel(key)+'" ভেরিয়েন্ট নেই'};
  if(!variantUsable(key))return{error:'"'+variantLabel(key)+'" ভেরিয়েন্ট বন্ধ আছে'};
  return{product:p,variantKey:key};
}
function resolveScannedVariant(code,mode){
  const raw=String(code??'').trim();
  if(!raw)return{error:'কোড খালি'};
  const parsed=parseVariantQRPayload(raw);
  if(parsed){
    const p=productsList.find(x=>String(x.id)===String(parsed.productId));
    if(!p)return{error:'QR কোডের পণ্য পাওয়া যায়নি'};
    return checkScannedVariant(p,parsed.variantKey);
  }
  const byVariant=findVariantByCode(raw);
  if(byVariant)return checkScannedVariant(byVariant.product,byVariant.variantKey);
  const p=productsList.find(x=>productMatchesScanCode(x,raw));
  if(!p)return{error:'QR কোড পাওয়া যায়নি'};
  const vs=ensureProductVariants(p)||{};
  const keys=Object.keys(vs).filter(variantUsable);
  const picked=document.getElementById((mode==='purchase'?'purchase-pick-variant-':'sale-picker-variant-')+p.id)?.value;
  const key=(picked&&keys.includes(picked))?picked:(keys.find(k=>Number(vs[k].stock||0)>0)||keys[0]);
  if(!key)return{error:'এই পণ্যের কোনো সক্রিয় ভেরিয়েন্ট নেই'};
  return{product:p,variantKey:key};
}

function scanSaleBarcodeToCart(code){
  const r=resolveScannedVariant(code,'sale');
  if(r.error){saToast('❌ '+r.error,'error',3500);return false}
  addSalePickerItem(r.product.id,1,r.variantKey);

function productMatchesScanCode(product,code){
  const scanned=String(code??'').trim().toLowerCase();
  return !!scanned&&[product?.barcode,product?.autoCode,product?.freeCode,product?.id].some(value=>String(value??'').trim().toLowerCase()===scanned);
}

function getMixCurrentValues(){
  const isSale=window.__splitMode==='sale';
  const cashReceived=Number(document.getElementById('mix-cash')?.value||0);
  const bkash=Number(document.getElementById('mix-bkash')?.value||0);
  const nagad=Number(document.getElementById('mix-nagad')?.value||0);
  const due=Number(document.getElementById('mix-due')?.value||0);
  let other=0;accounts.forEach(a=>{const el=document.getElementById('mix-acc-'+a.id);if(el)other+=Number(el.value||0)});
  const total=Number(window.__splitTotal||0);
  if(isSale){
    const nonCashPaid=bkash+nagad+other;
    const neededFromCash=Math.max(0,total-due-nonCashPaid);
    const cashApplied=Math.min(cashReceived,neededFromCash);
    const change=Math.max(0,cashReceived-cashApplied);
    const paid=cashApplied+bkash+nagad+other;
    return{cashReceived,cashApplied,bkash,nagad,other,paid,due,change,isSale};
  }else{
    const cashApplied=cashReceived;
    const paid=cashApplied+bkash+nagad+other;
    return{cashReceived,cashApplied,bkash,nagad,other,paid,due,change:0,isSale};
  }
}

function onMixFieldsInput(changedField){
  if(window.__isAutoCalculating)return;window.__isAutoCalculating=true;
  const total=Number(window.__splitTotal||0);const isSale=window.__splitMode==='sale';const vals=getMixCurrentValues();
  const dueEl=document.getElementById('mix-due');const cashEl=document.getElementById('mix-cash');
  if(isSale){
    if(changedField==='due'){const neededPaid=Math.max(0,total-vals.due);const nonCashPaid=vals.bkash+vals.nagad+vals.other;const neededFromCash=Math.max(0,neededPaid-nonCashPaid);if(cashEl&&Number(cashEl.value||0)<neededFromCash)cashEl.value=neededFromCash.toFixed(2)}
    else if(changedField==='cash'){const neededPaid=Math.max(0,total-(vals.bkash+vals.nagad+vals.other));const cashApplied=Math.min(vals.cashReceived,neededPaid);const rem=total-(cashApplied+vals.bkash+vals.nagad+vals.other);if(dueEl)dueEl.value=rem>0.001?rem.toFixed(2):'0.00'}
    else{
      const nonCashPaid=vals.bkash+vals.nagad+vals.other;
      const cashApplied=Math.min(vals.cashReceived,Math.max(0,total-nonCashPaid));
      const rem=total-(cashApplied+nonCashPaid);
      if(dueEl)dueEl.value=rem>0.001?rem.toFixed(2):'0.00';
    }
  }else{
    if(changedField==='due'){const neededPaid=Math.max(0,total-vals.due);const nonCashPaid=vals.bkash+vals.nagad+vals.other;const newCash=Math.max(0,neededPaid-nonCashPaid);if(cashEl)cashEl.value=newCash>0?newCash.toFixed(2):''}
    else{const rem=total-vals.paid;if(dueEl)dueEl.value=rem>0.001?rem.toFixed(2):'0.00'}
  }
  updateMixSummaryUI();window.__isAutoCalculating=false;
}

function fillMixFull(type){
  const total=Number(window.__splitTotal||0);
  document.getElementById('mix-cash').value='';document.getElementById('mix-bkash').value='';document.getElementById('mix-nagad').value='';document.getElementById('mix-due').value='';
  accounts.forEach(a=>{const el=document.getElementById('mix-acc-'+a.id);if(el)el.value=''});
  if(type==='cash')document.getElementById('mix-cash').value=total.toFixed(2);
  else if(type==='bkash')document.getElementById('mix-bkash').value=total.toFixed(2);
  else if(type==='nagad')document.getElementById('mix-nagad').value=total.toFixed(2);

  const splitPayments=[];const cashAcc=accounts.find(a=>a.type==='cash')||accounts[0];const bkashAcc=accounts.find(a=>a.type==='bkash');const nagadAcc=accounts.find(a=>a.type==='nagad');

/* ===== COMMIT CARTS (SALE & PURCHASE) ===== */
function saCommitCart(isSale){
  if(!requireActiveSession())return;
  const cart=isSale?saSaleCart:saPurchaseCart;
  if(!isSale){const emptyCard=saPurchaseCards.map(id=>productsList.find(p=>p.id===id)).find(p=>p&&!saPurchaseCart.some(x=>x.productId===p.id));if(emptyCard){saToast('❌ '+emptyCard.name+' — Variant নির্বাচন করুন বা কার্ড মুছুন','error',4000);return}}
  if(!cart.length){saToast('কার্ট খালি','error');return}
  if(isSale){
    const subtotal=cart.reduce((sum,item)=>sum+Number(item.qty||0)*Number(item.rate||0),0),maxDiscount=subtotal*getMaxDiscount()/100;
    if(!hasPerm('canGiveDiscount')&&saDiscount>0){saToast('Discount দেওয়ার অনুমতি নেই','error');return}
    if(saDiscount>maxDiscount+0.01){saToast('সর্বোচ্চ ডিসকাউন্ট সীমা '+money(maxDiscount),'error');return}
    if(!hasPerm('canSellBelowCost')&&cart.some(item=>Number(item.rate||0)+0.001<getSaleFloorPrice(item))){saToast('ক্রয়মূল্যের নিচে বিক্রি করা যাবে না','error');return}
   const saleImeis=cart.filter(isStockMobileSaleItem).map(x=>String(x.imei||'').trim()).filter(Boolean);
    if(new Set(saleImeis.map(normalizeImei)).size!==saleImeis.length||saleImeis.some(v=>knownImeiInSale(v))){saToast('এই IMEI ইতিমধ্যে বিক্রির রেকর্ডে আছে','error',3500);return}
    for(const x of cart){
      if(x.isService){
        if(!x.name||Number(x.rate)<=0){saToast('Service সম্পূর্ণ করুন','error');return}
        continue;
      }
      const formType=x.formType||'regular';
      if(formType==='mobile'&&!x.imei){saToast('📱 "'+x.name+'" এর IMEI দিন','error',3000);return}
      if(formType==='mobile'&&Number(x.qty||1)!==1){saToast('একটি IMEI-এর জন্য একটি Mobile line রাখুন','error',3000);return}
      if(!x.isManual&&x.productId&&!x.supplierId){saToast('⚠️ "'+x.name+'" এর Supplier নির্বাচন করুন','error',3500);return}
    }
    const status=document.getElementById('sale-status-selector')?.value||'inwork';
    if(status==='outwork'){
      const cid=document.getElementById('sale-carigor-select')?.value||'';
      if(!cid||cid==='__NEW__'){saToast('⚠️ Out Work এ কারিগর নির্বাচন করা বাধ্যতামূলক','error',3500);return}
      if(!(document.getElementById('sale-carigor-note')?.value||'').trim()){saToast('সমস্যার নোট লিখুন','error',3500);document.getElementById('sale-carigor-note')?.focus();return}
    }
  }
  if(!isSale){
    if(selectedPurchaseSupplierIndex<0||!suppliers[selectedPurchaseSupplierIndex]){saToast('⚠️ Supplier নির্বাচন করুন','error',3500);return}
    if(cart.some(x=>x.productId&&(!x.categoryId||categories.find(c=>c.id===x.categoryId)?.parentId||(x.subCategoryId&&categories.find(c=>c.id===x.subCategoryId)?.parentId!==x.categoryId)))){saToast('প্রতিটি Purchase পণ্যে সঠিক Category / Subcategory নির্বাচন করুন','error',3500);return}
    if(cart.some(x=>x.formType==='mobile'&&Number(x.qty||0)!==1)){saToast('প্রতিটি মোবাইল IMEI আলাদা লাইন ও Qty 1 হতে হবে','error',3500);return}
    const imeis=cart.filter(x=>x.formType==='mobile').map(x=>String(x.imei||'').trim());
    if(imeis.some(v=>!v)){saToast('প্রতিটি মোবাইল ক্রয়ের IMEI দিন','error',3500);return}
    if(new Set(imeis.map(normalizeImei)).size!==imeis.length||imeis.some(v=>knownImeiInPurchase(v))){saToast('এই IMEI ইতিমধ্যে ক্রয়ের রেকর্ডে আছে','error',3500);return}
  }
  const totals=saCartTotals(cart,isSale);
  if(isSale&&(document.getElementById('sale-status-selector')?.value||'inwork')!=='delivered'){
    finalizeSaleCommit(cart,totals,'Pending',null,[],0,0,0);
    return;
  }
  const method=document.getElementById(isSale?'sale-payment-method':'purchase-payment-method')?.value||'Cash';
  if(method==='Mix'){openMixPaymentModal(totals.total,isSale?'sale':'purchase');return}
  if(isSale){
    const given=Number(document.getElementById('sale-single-given-amount')?.value||totals.total);
    const change=Math.max(0,given-totals.total);
    if(method==='Due'){const isWalkIn=!selectedSaleCustomer||String(selectedSaleCustomer.name||'').toLowerCase()==='walk-in customer';if(isWalkIn){openMixPaymentModal(totals.total,'sale');saToast('বাকি দেওয়ার জন্য গ্রাহকের নাম দিন','info',3000);return}finalizeSaleCommit(cart,totals,'Due',null,[],totals.total,0,0)}
    else{const aid=document.getElementById('sale-target-account')?.value||'acc_cash';finalizeSaleCommit(cart,totals,method,aid,[],0,given,change)}
  }else{
    if(method==='Due')finalizePurchaseCommit(cart,totals,'Due',null,[],totals.total);
    else{const aid=document.getElementById('purchase-source-account')?.value||'acc_cash';finalizePurchaseCommit(cart,totals,method,aid,[],0)}
  }
}

  const purId=uid();
  const autoPurchase={
    id:purId,
    date:saleRecord.date,
    time:saleRecord.time,
    createdAt:Date.now(),
    createdBy:saleRecord.createdBy,
    createdByName:saleRecord.createdByName,
    isAuto:true,
    autoFromSaleId:saleRecord.id,
    items:[{
      productId:item.productId,
      name:item.name,
      qty:item.qty,
      rate:buyPrice,
      buyPrice:buyPrice,
      isManual:false,
      categoryId:item.categoryId||null,
      subCategoryId:item.subCategoryId||null,
      subType:item.subType||null,
      variantKey:item.variantKey||'original',variantName:item.variantName||variantLabel(item.variantKey||'original'),
      imei:item.imei||'',
      formType:item.formType||'regular',
      batchId:null,
      supplierName:supplierName,
      purchaseInvoiceId:purId
    }],
    subtotal:buyPrice*item.qty,
    discount:0,
    vat:0,
    vatPercent:0,
    amount:buyPrice*item.qty,
    total:buyPrice*item.qty,
    paymentMethod:'Due',
    qty:item.qty,
    splitPayments:[],
    dueAmount:buyPrice*item.qty,
    supplierId:supplierId,
    supplierName:supplierName,
    productName:item.name
  };
  if(!Array.isArray(p.batches))p.batches=[];
  const newBatch={
    batchId:'bat_'+uid(),
    supplierId:supplierId,
    supplierName:supplierName,
    buyPrice:buyPrice,
    variantKey:item.variantKey||'original',variantName:item.variantName||variantLabel(item.variantKey||'original'),
    qty:item.qty,
    remainingQty:item.qty,
    date:saleRecord.date,
    purchaseInvoiceId:purId,
    createdAt:Date.now(),
    isAuto:true,
    autoFromSaleId:saleRecord.id
  };
  p.batches.push(newBatch);
  adjustProductVariantStock(p,item.variantKey||'original',item.qty);
  autoPurchase.items[0].batchId=newBatch.batchId;
  item.batchId=newBatch.batchId;
  item.purchaseInvoiceId=purId;

  const sup=suppliers.find(s=>s.id===supplierId);
  if(sup){sup.balance=Number(sup.balance||0)+Number(autoPurchase.total||0)}
  purchaseRecords.unshift(autoPurchase);
  return autoPurchase;
}

function finalizeSaleCommit(cart,totals,method,aid,sp,dueAmt=0,givenAmt=0,changeAmt=0){
  if(saSaleCommitBusy||!cart?.length)return;
  if(!requireActiveSession())return;
  const saleSubtotal=cart.reduce((sum,item)=>sum+Number(item.qty||0)*Number(item.rate||0),0),saleMaxDiscount=saleSubtotal*getMaxDiscount()/100;
  if(!hasPerm('canGiveDiscount')&&Number(totals?.discount||0)>0){saToast('Discount দেওয়ার অনুমতি নেই','error');return}
  if(Number(totals?.discount||0)>saleMaxDiscount+0.01){saToast('সর্বোচ্চ ডিসকাউন্ট সীমা '+money(saleMaxDiscount),'error');return}
  if(!hasPerm('canSellBelowCost')&&cart.some(item=>Number(item.rate||0)+0.001<getSaleFloorPrice(item))){saToast('ক্রয়মূল্যের নিচে বিক্রি করা যাবে না','error');return}
  if(!hasPerm('canSellBelowCost')){
    const totalCost=cart.reduce((sum,item)=>(item.isService||item.isManual||!item.productId)?sum:sum+Number(item.qty||0)*getSaleFloorPrice(item),0);
    if(totalCost>0&&(saleSubtotal-Number(totals?.discount||0))<totalCost-0.005){saToast('ডিসকাউন্ট দেওয়ার পর মোট বিক্রয়মূল্য পণ্যগুলোর মোট ক্রয়মূল্যের নিচে নেমে যাচ্ছে! (Floor price violation)','error',4500);return}
  }
   const imeis=cart.filter(x=>isStockMobileSaleItem(x)&&x.imei).map(x=>normalizeImei(x.imei));
  if(new Set(imeis).size!==imeis.length||imeis.some(v=>knownImeiInSale(v))){saToast('এই IMEI ইতিমধ্যে বিক্রির রেকর্ডে আছে','error');return}
  if(cart.some(x=>!x.isService&&(x.formType||'regular')==='mobile'&&(!x.imei||Number(x.qty||1)!==1))){saToast('প্রতিটি Mobile পণ্যের আলাদা IMEI ও Qty 1 আবশ্যক','error');return}
  saSaleCommitBusy=true;
  const dt=getDateTime();
  const status=document.getElementById('sale-status-selector')?.value||'inwork';
  const carigorId=(status==='outwork'?document.getElementById('sale-carigor-select')?.value:null)||null;
  const carigorCost=status==='outwork'?Number(document.getElementById('sale-carigor-cost')?.value||0):0;
  const carigorNote=(document.getElementById('sale-carigor-note')?.value||'').trim();
  const carigor=carigorId?carigors.find(c=>c.id===carigorId):null;
  if(!Number.isFinite(carigorCost)||carigorCost<0){saSaleCommitBusy=false;saToast('সঠিক কারিগর মজুরি দিন','error');return}
  if(status==='outwork'&&(!carigor||!carigorNote)){saSaleCommitBusy=false;saToast('Out Work এ কারিগর ও সমস্যার নোট আবশ্যক','error');return}
  if(status==='outwork'&&carigor.active===false){saSaleCommitBusy=false;saToast('Inactive কারিগরকে নতুন কাজ assign করা যাবে না','error');return}
  const r={
    id:uid(),date:dt.date,time:dt.time,createdAt:dt.timestamp,
    createdBy:currentUser?.id||'system',createdByName:currentUser?.name||'System',
    status:status,statusUpdatedAt:Date.now(),
     carigorId:carigor?.id||null,carigorName:carigor?.name||null,carigorCost:carigorCost,carigorBookedCost:status==='outwork'?centsToMoney(moneyToCents(carigorCost)):0,carigorNote:carigorNote,
    givenAmount:method==='Pending'?0:Number(givenAmt||totals.total),changeAmount:Number(changeAmt||0),
    items:[],subtotal:totals.subtotal,discount:totals.discount,vat:totals.vat,vatPercent:saVatPercent,
    amount:totals.total,total:totals.total,paymentMethod:method,qty:cart.reduce((a,x)=>a+x.qty,0),
    splitPayments:method==='Pending'?[]:(sp||[]),dueAmount:method==='Pending'?0:Number(dueAmt||0),
    autoPurchases:[],
    moneyPosted:(status==='delivered')
  };
  
  if(status==='outwork'&&carigor&&carigorCost>0){
    if(!carigorNote){saSaleCommitBusy=false;saToast('সমস্যার নোট লিখুন','error');return}
    carigor.balance=centsToMoney(moneyToCents(carigor.balance||0)+moneyToCents(carigorCost));
    recordCarigorLedgerEvent(carigor,'job',carigorCost,'Job: '+cart.map(x=>x.name).join(', '),r.id,dt);
    saveCarigors();
  }
  const si=Number.isInteger(selectedSaleCustomer?.index)?selectedSaleCustomer.index:-1;
  let se=null;
  if(selectedSaleCustomer?.type==='wholesaler')se=wholesalers[selectedSaleCustomer.index];
  else if(si>=0)se=customers[si];
  r.customerId=se?.id||null;
  if(selectedSaleCustomer?.type==='wholesaler'){r.customerName=se?.shopName||'দোকানদার';r.customerPhone=se?.phone||'';r.wholesalerId=se?.id||null}
  else{r.customerName=se?.name||'Walk-in Customer';r.customerPhone=se?.phone||''}
  const il=[];
  const autoPurchaseIds=[];
  cart.forEach(x=>{
    if(x.isService){
      r.items.push({
        productId:null,name:x.name,qty:Number(x.qty||1),rate:Number(x.rate||0),buyPrice:Number(x.buyPrice||0),
        isManual:false,isService:true,serviceId:x.serviceId||null,serviceIcon:x.serviceIcon||'🔧',
        carigorId:x.carigorId||null,carigorName:x.carigorName||null,carigorCost:Number(x.carigorCost||0),
        note:x.note||'',modelName:x.modelName||'',imei:'',categoryId:null,subCategoryId:null,subType:null,formType:'service'
      });
      return;
    }
    const p=x.productId?productsList.find(y=>y.id===x.productId):null;
    const formType=x.formType||'regular';
    const isMobile=formType==='mobile';
    let itemBuyPrice=Number(x.buyPrice||0);
    let itemBatchSupplier=x.supplierName||null;
    let itemBatchId=null;
    let itemPurchaseInvoiceId=null;
    let itemSupplierId=x.supplierId||null;
    let autoCreated=false;
    const batchAllocations=[];
    let autoBatchAllocation=null;
    
    if(p&&!x.isManual&&itemSupplierId){
      const stockBefore=Math.max(0,Number(p.stock||0));
      const variantStockBefore=Math.max(0,Number(getProductVariant(p,x.variantKey||'original').stock||0));
      const missing=Math.max(0,Number(x.qty||0)-variantStockBefore);
      if(missing>0&&!p.nonStock){
        const autoPur=createAutoPurchaseEntry(r,{...x,qty:missing},itemSupplierId,x.supplierName||suppliers.find(s=>s.id===itemSupplierId)?.name||'Unknown',itemBuyPrice);
        if(autoPur){
          autoPurchaseIds.push(autoPur.id);autoCreated=true;
          const autoItem=autoPur.items?.[0],autoBatch=p.batches?.find(b=>String(b.batchId)===String(autoItem?.batchId||''));
           if(autoBatch)autoBatchAllocation={batchId:autoBatch.batchId,qty:missing,supplierId:autoBatch.supplierId,supplierName:autoBatch.supplierName,buyPrice:autoBatch.buyPrice,purchaseInvoiceId:autoBatch.purchaseInvoiceId};
        }
      }
      if(Array.isArray(p.batches)){
        const batches=p.batches.filter(b=>Number(b.remainingQty)>0&&String(b.variantKey||'original')===String(x.variantKey||'original')&&String(b.batchId)!==String(batchAllocations[0]?.batchId||''));
        batches.sort((a,b)=>{
          const as=String(a.supplierId||'')===String(itemSupplierId)?0:1;
          const bs=String(b.supplierId||'')===String(itemSupplierId)?0:1;
          return as-bs||Number(a.createdAt||0)-Number(b.createdAt||0);
        });
        let remaining=Math.min(variantStockBefore,Number(x.qty||0));
        for(const b of batches){
          if(remaining<=0)break;
          const deduct=Math.min(remaining,Number(b.remainingQty||0));
          if(deduct<=0)continue;
          b.remainingQty=Number(b.remainingQty||0)-deduct;
          remaining-=deduct;
          batchAllocations.push({batchId:b.batchId,qty:deduct,supplierId:b.supplierId||null,supplierName:b.supplierName||'',buyPrice:Number(b.buyPrice||itemBuyPrice),purchaseInvoiceId:b.purchaseInvoiceId||null});
        }
      }
      if(autoBatchAllocation)batchAllocations.push(autoBatchAllocation);
      if(batchAllocations.length){
        const primary=batchAllocations[0];
        itemBatchId=primary.batchId;itemPurchaseInvoiceId=primary.purchaseInvoiceId||null;
        if(!x.variantKey)itemBuyPrice=Number(primary.buyPrice||itemBuyPrice);
        itemBatchSupplier=primary.supplierName||itemBatchSupplier;
        itemSupplierId=primary.supplierId||itemSupplierId;
      }
      if(!p.nonStock&&!isMobile)adjustProductVariantStock(p,x.variantKey||'original',-Number(x.qty||0));
      if(isMobile)adjustProductVariantStock(p,x.variantKey||'original',-1);
    } else if(p){
      if(!p.nonStock&&!isMobile)adjustProductVariantStock(p,x.variantKey||'original',-Number(x.qty||0));
      if(isMobile)adjustProductVariantStock(p,x.variantKey||'original',-1);
    }
    if(x.imei)il.push(x.imei);
    const selectedCat=categories.find(c=>c.id===x.categoryId),rootCat=selectedCat?.parentId?categories.find(c=>c.id===selectedCat.parentId):selectedCat;
    const selectedSub=x.subCategoryId?categories.find(c=>c.id===x.subCategoryId):(selectedCat?.parentId?selectedCat:null);

  }),subtotal:totals.subtotal,discount:totals.discount,vat:totals.vat,vatPercent:saPurchaseVatPercent,amount:totals.total,total:totals.total,paymentMethod:method,qty:cart.reduce((a,x)=>a+x.qty,0),splitPayments:sp||[],dueAmount:Number(dueAmt||0),supplierId:ss?.id||null,supplierName:ss?.name||'General Supplier',isAuto:false,autoFromSaleId:null};
  r.productName=cart.map(x=>x.name).join(', ');
  if(method==='Mix'){
    (sp||[]).forEach(x=>{const acc=accounts.find(a=>a.id===x.accountId);if(acc)acc.balance=Number(acc.balance||0)-Number(x.amount||0);logMoneyTx({type:'out',amount:x.amount,accountId:x.accountId,note:'Purchase Mix ('+String(r.id).slice(-6)+')',ref:r.id})});
    saveAccounts();
    const mixPaid=(sp||[]).reduce((a,x)=>a+Number(x.amount||0),0),mixDue=Math.max(Number(dueAmt||0),Number((totals.total-mixPaid).toFixed(2)));
    r.dueAmount=mixDue;

  cart.forEach((x,cartIndex)=>{

      {const vv=ensureProductVariants(p),vk=x.variantKey||'original';if(vv&&!vv[vk])vv[vk]={buyPrice:0,salePrice:0,stock:0};}
      adjustProductVariantStock(p,x.variantKey||'original',x.qty);

      }
      if(!Array.isArray(p.batches))p.batches=[];
      const newBatch={batchId:'bat_'+uid(),supplierId:r.supplierId,supplierName:r.supplierName,buyPrice:x.rate,variantKey:x.variantKey||'original',variantName:x.variantName||variantLabel(x.variantKey||'original'),qty:x.qty,remainingQty:x.qty,date:dt.date,purchaseInvoiceId:r.id,createdAt:dt.timestamp,isAuto:false};
      p.batches.push(newBatch);
      const pi=r.items[cartIndex];
      if(pi){pi.batchId=newBatch.batchId;pi.supplierName=r.supplierName;pi.purchaseInvoiceId=r.id}
    }
  });
  purchaseRecords.unshift(r);
  saveProducts();savePurchaseRecords();
  saPurchaseCart=[];saPurchaseCards=[];saPurchaseDiscount=0;saPurchaseVatPercent=0;selectedPurchaseSupplierIndex=-1;purchaseDraftRestored=false;savePurchaseDraft();

  renderSupplierList();updateDashboard();updateHeaderCash();

  saToast('✅ ক্রয় সম্পন্ন: '+money(totals.total),'success',2500);
  saRenderCart(false);switchTab('purchase');
  saPurchaseCommitBusy=false;
  if(ss?.phone&&confirm('ক্রয় সংরক্ষিত হয়েছে। '+ss.name+'-কে WhatsApp-এ পূর্ণ ক্রয় মেমো পাঠাবেন?'))sendSupplierPurchaseWhatsApp(r.id);
}

function setDatePeriod(p,btn,ctx){if(ctx==='sales')salesPeriod=p;else if(ctx==='purchase')purchasePeriod=p;else reportPeriod=p;setPillActive(btn);if(ctx==='sales')renderSalesList();else if(ctx==='purchase')renderPurchaseList();else{updateReportsOverview();renderReportDetail()}}

function renderSalesList(){

  else if(salesStatusFilter==='due')rows=rows.filter(r=>r.status==='delivered'&&(String(r.paymentMethod||'').toLowerCase()==='due'||Number(r.dueAmount||0)>0));
  else if(salesStatusFilter==='paid')rows=rows.filter(r=>r.status==='delivered'&&r.moneyPosted!==false&&String(r.paymentMethod||'').toLowerCase()!=='due'&&Number(r.dueAmount||0)<=0);
  if(q)rows=rows.filter(r=>[r.productName,r.customerName,r.customerPhone,r.id,...(r.imeiList||[])].some(v=>String(v||'').toLowerCase().includes(q)));
  if(!rows.length){c.innerHTML='<div class="empty-list-box">কোনো বিক্রয় নেই</div>';return}
  c.innerHTML=rows.slice(0,200).map(r=>{
    const isPending=r.status!=='delivered';
    const hasDue=!isPending&&Number(r.dueAmount||0)>0;
    const im=(r.imeiList||[]).filter(Boolean);
    const serviceNotes=(r.items||[]).filter(it=>it.isService&&it.note).map(it=>it.name+': '+it.note);
    const stBadge=getTrackStatusBadge(r.status);
    const subs=[...new Set((r.items||[]).map(it=>it.subType).filter(Boolean))];
    const subLine=subs.length?subs.map(s=>getSubTypeBadge(s)).join(' '):'';
    const hasAuto=(r.autoPurchases||[]).length>0;
    const hasService=(r.items||[]).some(it=>it.isService);
    const hasProduct=(r.items||[]).some(it=>!it.isService);
    const typeBadge=(hasService?'<span class="service-item-badge">🔧 SERVICE</span>':'')+(hasProduct?'<span class="imei-badge">📦 PRODUCT</span>':'');
    const isFinalDelivered=r.status==='delivered';
    return `<div class="entity-card" style="flex-direction:column;align-items:stretch;">
      <div class="tap-card" onclick="openInvoiceDetail('sale','${esc(r.id)}')" style="display:flex;justify-content:space-between;align-items:flex-start;"><div style="flex:1;"><b style="font-size:13px;">${subLine} ${typeBadge} ${hasAuto?'<span class="auto-purchase-badge">🤖 Auto</span>':''} ${esc(r.productName||'Sale')}</b><p style="font-size:11px;color:#666;margin-top:3px;">📅 ${esc(r.date||'')} 🕐 ${esc(r.time||'')} • ${esc(r.customerName||'Walk-in')} • ${isPending?'Pending (ডেলিভারিতে payment)':esc(r.paymentMethod||'')}${hasDue?' (বাকি: '+money(r.dueAmount)+')':''}</p>${im.length?'<p style="font-size:11px;color:#1976d2;">📱 '+im.map(esc).join(', ')+'</p>':''}${serviceNotes.length?'<p style="font-size:11px;color:#6b7280;margin-top:3px;">📝 '+serviceNotes.map(esc).join(' • ')+'</p>':''}<p style="font-size:13px;font-weight:800;color:${isPending?'#1565c0':(hasDue?'#d32f2f':'#2e7d32')};margin-top:4px;">Total: ${money(r.total||r.amount)}</p></div><div style="text-align:right;">${stBadge}</div></div>
      <div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;">
        ${!isFinalDelivered?`<button class="btn-blue-pill status" style="flex:1;" onclick="openChangeStatusModal('${esc(r.id)}')"><i class="fa-solid fa-rotate"></i> স্ট্যাটাস</button>`:''}
        <button style="flex:1;border:0;background:#e8f5e9;color:#1b5e20;border-radius:6px;padding:8px;cursor:pointer;font-size:11px;" onclick="sendInvoiceWhatsApp('${esc(r.id)}')"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>

        ${hasPerm('canDeleteSale')?`<button style="flex:1;border:0;background:#ffebee;color:#c62828;border-radius:6px;padding:8px;cursor:pointer;font-size:11px;" onclick="deleteSaleRecord('${esc(r.id)}')"><i class="fa-solid fa-trash"></i></button>`:''}
      </div>
    </div>`;
  }).join('');

  const t=financialRows.reduce((s,r)=>s+Number(r.total||r.amount||0),0);
  const p=financialRows.reduce((s,r)=>{if(!r.moneyPosted)return s;const due=Number(r.dueAmount||(String(r.paymentMethod).toLowerCase()==='due'?r.total:0));return s+(Number(r.total||r.amount||0)-due)},0);

function deleteSaleRecord(id){
  if(!requirePermission('canDeleteSale'))return;
  if(!confirm('Sale রেকর্ডটি সম্পূর্ণ ডিলিট করতে চান?'+retLinkedNote('sale',id)))return;
  const r=salesRecords.find(x=>String(x.id)===String(id));
  if(r){
    cascadeDeleteReturns('sale',r.id);
    if(!r.partsRestored){
      (r.items||[]).forEach(it=>{
        if(it.isService)return;
        if(!it.productId)return;
        const p=productsList.find(x=>x.id===it.productId);
        if(p&&!p.nonStock&&it.formType!=='mobile')adjustProductVariantStock(p,it.variantKey||'original',Number(it.qty||0));
        if(p&&it.formType==='mobile')adjustProductVariantStock(p,it.variantKey||'original',1);
        if(p&&it.batchId&&Array.isArray(p.batches)){const b=p.batches.find(b=>b.batchId===it.batchId);if(b)b.remainingQty=Number(b.remainingQty||0)+Number(it.qty||0)}
      });
    }
    if(r.carigorId){
      const cg=carigors.find(c=>String(c.id)===String(r.carigorId));
      const bookedCents=moneyToCents(r.carigorBookedCost??r.carigorCost??0);
      if(cg&&bookedCents>0){
        const reverseCents=Math.min(Math.max(0,moneyToCents(cg.balance||0)),bookedCents);
        if(reverseCents){cg.balance=centsToMoney(moneyToCents(cg.balance||0)-reverseCents);recordCarigorLedgerEvent(cg,'adjustment',-reverseCents/100,'Deleted sale: '+String(r.id).slice(-6),r.id)}
        saveCarigors();
      }
    }
    const due=Number(r.dueAmount||(String(r.paymentMethod).toLowerCase()==='due'?r.total:0));
    if(due>0){const c=customers.find(x=>x.id===r.customerId);if(c){c.balance=Math.max(0,Number(c.balance||0)-due);saveCustomers()}const w=wholesalers.find(x=>x.id===r.wholesalerId);if(w){w.balance=Math.max(0,Number(w.balance||0)-due);saveWholesalers()}}
    (r.autoPurchases||[]).forEach(apid=>{
      const ap=purchaseRecords.find(p=>p.id===apid);
      if(ap){
        const s=suppliers.find(x=>x.id===ap.supplierId);if(s){s.balance=Math.max(0,Number(s.balance||0)-Number(ap.total||0))}
        (ap.items||[]).forEach(it=>{if(!it.productId)return;const p=productsList.find(x=>x.id===it.productId);if(p&&!p.nonStock)adjustProductVariantStock(p,it.variantKey||'original',-Number(it.qty||0));if(p&&it.batchId&&Array.isArray(p.batches)){const b=p.batches.find(b=>b.batchId===it.batchId);if(b)b.remainingQty=Math.max(0,Number(b.remainingQty||0)-Number(it.qty||0))}});
      }
    });
    purchaseRecords=purchaseRecords.filter(p=>!(r.autoPurchases||[]).includes(p.id));
    savePurchaseRecords();saveSuppliers();
    if(r.moneyPosted){
      const relatedTxs=moneyTransactions.filter(x=>x.ref===r.id);
      relatedTxs.forEach(tx=>{const acc=accounts.find(a=>a.id===tx.accountId);if(acc)acc.balance=Number(acc.balance||0)-Number(tx.amount||0)});
      saveAccounts();
      moneyTransactions=moneyTransactions.filter(x=>x.ref!==r.id);
      saveMoneyTxLog();
    }
  }
  salesRecords=salesRecords.filter(x=>String(x.id)!==String(id));
  saveSalesRecords();saveProducts();
  renderSalesList();renderSaleTrackList();renderProducts();renderCustomerList();renderSupplierList();updateDashboard();updateHeaderCash();
  logAction('sale_delete','Deleted '+String(id).slice(-6),id);
  saToast('✅ ডিলিট সফল','success');
}

  const q=(document.getElementById('purchase-search-input')?.value||'').trim().toLowerCase();
  let rows=purchaseRecords.filter(r=>dateInRange(r,range.from,range.to));
  if(q)rows=rows.filter(r=>[r.productName,r.supplierName,r.id].some(v=>String(v||'').toLowerCase().includes(q)));
  if(!rows.length){c.innerHTML='<div class="empty-list-box">কোনো ক্রয় নেই</div>';return}

        <p style="font-size:11px;color:#666;margin-top:3px;">📅 ${esc(r.date||'')} 🕐 ${esc(r.time||'')} • ${r.supplierId&&suppliers.some(sp=>sp.id===r.supplierId)?`<a class="sa-link" onclick="openSupplierProfile('${esc(r.supplierId)}')">${esc(r.supplierName||'General')}</a>`:esc(r.supplierName||'General')} • ${esc(r.paymentMethod||'')}${isMobile?' • 📱':''}${r.dueAmount?' (বাকি: '+money(r.dueAmount)+')':''}</p>
        <p style="font-size:13px;font-weight:800;color:${isDue||r.dueAmount?'#d32f2f':'#2e7d32'};margin-top:4px;">Total: ${money(r.total||r.amount)}</p>
      </div>
      <div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;">
        ${hw?`<button class="btn-blue-pill wa" style="flex:1;" onclick="sendSupplierOrderWhatsApp('${esc(r.id)}')"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>`:''}
        <button class="btn-blue-pill print" style="flex:1;" onclick="printInvoiceById('${esc(r.id)}','purchase')"><i class="fa-solid fa-print"></i> প্রিন্ট</button>
        ${isMobile?`<button class="btn-blue-pill" style="background:#6a1b9a;" onclick="printMobilePurchaseInvoice('${esc(r.id)}')"><i class="fa-solid fa-mobile-screen"></i> মোবাইল ইনভয়েস</button>`:''}
        <button class="btn-blue-pill edit" style="flex:1;" onclick="openInvoiceEdit('purchase','${esc(r.id)}')"><i class="fa-solid fa-pen"></i></button>
        <button class="btn-blue-pill danger" style="flex:1;" onclick="deletePurchaseRecord('${esc(r.id)}')"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>`;

  const t=rows.reduce((s,r)=>s+Number(r.total||r.amount||0),0);
  const ft=document.getElementById('purchase-footer-info');if(ft)ft.innerText='Purchase: '+rows.length+' | মোট: '+money(t);
}

function printMobilePurchaseInvoice(id){const r=purchaseRecords.find(x=>String(x.id)===String(id));if(!r){saToast('পাওয়া যায়নি','error');return}const html=buildInvoiceHTML(r,'purchase');const w=window.open('','_blank','width=600,height=800');if(!w){saToast('Popup ব্লক রয়েছে','error');return}w.document.write(html);w.document.close()}

function deletePurchaseRecord(id){
  if(!confirm('Purchase রেকর্ডটি ডিলিট করতে চান?'+retLinkedNote('purchase',id)))return;
  const r=purchaseRecords.find(x=>String(x.id)===String(id));
  if(r){
    cascadeDeleteReturns('purchase',r.id);
    (r.items||[]).forEach(it=>{if(!it.productId)return;const p=productsList.find(x=>x.id===it.productId);if(p&&!p.nonStock)adjustProductVariantStock(p,it.variantKey||'original',-Number(it.qty||0));if(p&&it.batchId&&Array.isArray(p.batches)){const b=p.batches.find(b=>b.batchId===it.batchId);if(b)b.remainingQty=Math.max(0,Number(b.remainingQty||0)-Number(it.qty||0))}});
    const due=Number(r.dueAmount||(String(r.paymentMethod).toLowerCase()==='due'?r.total:0));
    if(due>0){const s=suppliers.find(x=>x.id===r.supplierId);if(s){s.balance=Math.max(0,Number(s.balance||0)-due);saveSuppliers()}}
    const relatedTxs=moneyTransactions.filter(x=>x.ref===r.id);
    relatedTxs.forEach(tx=>{const acc=accounts.find(a=>a.id===tx.accountId);if(acc)acc.balance=Number(acc.balance||0)+Number(tx.amount||0)});
    saveAccounts();moneyTransactions=moneyTransactions.filter(x=>x.ref!==r.id);saveMoneyTxLog();
  }
  purchaseRecords=purchaseRecords.filter(x=>String(x.id)!==String(id));
  savePurchaseRecords();saveProducts();
  renderPurchaseList();renderProducts();updateDashboard();updateHeaderCash();
  saToast('✅ ডিলিট সম্পন্ন','success');
}

/* ===== SUPPLIER PROFILE ===== */
let currentSupplierProfileId=null;
let supplierProfileSalesFrom='';
let supplierProfileSalesTo='';
function supplierProfileSalesInRange(rows){
  const from=supplierProfileSalesFrom||'';const to=supplierProfileSalesTo||'';
  return (rows||[]).filter(x=>{const d=String(x.record?.date||'');return (!from||d>=from)&&(!to||d<=to)}).sort((a,b)=>String(b.record?.date||'').localeCompare(String(a.record?.date||''))||String(b.record?.time||'').localeCompare(String(a.record?.time||''))||Number(b.record?.createdAt||0)-Number(a.record?.createdAt||0));
}
function setSupplierProfileSalesDate(which,value){if(which==='from')supplierProfileSalesFrom=value||'';else supplierProfileSalesTo=value||'';renderSupplierProfile()}
function clearSupplierProfileSalesDates(){supplierProfileSalesFrom='';supplierProfileSalesTo='';renderSupplierProfile()}
function openSupplierProfile(supplierId){
  const s=suppliers.find(x=>x.id===supplierId);if(!s){saToast('Supplier নেই','error');return}
  currentSupplierProfileId=supplierId;
  switchTab('supplier-profile-view');
  const p=document.getElementById('page-title');if(p)p.innerText=s.name;
  renderSupplierProfile();
}

/* Supplier profile product card: same card as Products page, stock = only this supplier's stock */

  const st=x.remainQty;
  const sb=st<=0?'<span class="stock-badge out">OUT</span>':(st<=Number(p.lowStockLimit||5)?'<span class="stock-badge low">LOW '+st+'</span>':'<span class="stock-badge ok">'+st+'</span>');
  const pills=x.variants.map(v=>{
    const out=v.remainQty<=0;
    return `<span class="variant-pill" style="${variantColorStyle(v.key)}${out?'opacity:.55;':''}">${variantDotHtml(v.key)} <b>${esc(variantLabel(v.key))}</b>: ${v.remainQty} পিস${out?' • Out':''} <span style="opacity:.75">(এসেছে ${v.totalQty} • বিক্রি ${v.soldQty||0})</span></span>`;
  }).join('');
  const batchesHtml=x.batches.slice().sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)).map(b=>`<div style="font-size:11px;color:#166534;padding:2px 0;">• ${esc(variantLabel(b.variantKey||'original'))}: ${Number(b.remainingQty||0)}/${Number(b.qty||0)} pcs @ ৳${Number(b.buyPrice||0)} ${b.date?'('+esc(b.date)+')':''}${b.isAuto?' <span class="auto-purchase-badge" style="font-size:8px;">🤖</span>':''}</div>`).join('');
  return `<div class="supplier-product-stock-card" style="padding:0;overflow:hidden;">
    <div class="product-card" style="border-bottom:0;min-height:0;">
      <div class="product-card-icon tap-card" onclick="openProductInList('${esc(p.id)}')">${image}</div>
      <div class="product-card-info">
        <h4 class="tap-card" onclick="openProductInList('${esc(p.id)}')" style="color:#1d4ed8;">${esc(x.name)} <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:10px;"></i></h4>
        <span class="product-type-badge">${esc(catLabel)}</span>
        <p>🏷️ ${esc(p.barcode||'—')} • ${esc(p.brandName||p.brand||'—')}</p>
        <p>💰 এই সাপ্লায়ারের স্টক: ${sb}</p>
        <div class="variant-badges">${pills}</div>
      </div>
      <div class="product-card-actions"><button class="product-card-edit" onclick="openProductModal('${esc(p.id)}')"><i class="fa-solid fa-pen"></i></button></div>
    </div>
    <div style="padding:0 11px 11px;">
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;">
        <div class="supplier-card-stat"><span>মোট এসেছে</span><strong>${x.totalQty} pcs</strong></div>
        <div class="supplier-card-stat"><span>বিক্রি হয়েছে</span><strong>${x.soldQty||0} pcs</strong></div>
        <div class="supplier-card-stat ${x.remainQty>0?'paid':'due'}"><span>আছে</span><strong>${x.remainQty} pcs</strong></div>
      </div>
      <details style="margin-top:7px;"><summary style="font-size:11px;font-weight:700;color:#166534;cursor:pointer;">ব্যাচ বিবরণ • Avg Buy ৳${x.avgPrice.toFixed(2)} • স্টক মূল্য ${money(x.remainQty*x.avgPrice)}</summary><div style="margin-top:4px;">${batchesHtml}</div></details>
    </div>
  </div>`;
}

function renderSupplierProfile(){
  const s=suppliers.find(x=>x.id===currentSupplierProfileId);if(!s)return;
  const c=document.getElementById('supplier-profile-content');if(!c)return;
  const purchases=purchaseRecords.filter(r=>r.supplierId===s.id);
  const sales=salesRecords.filter(r=>(r.items||[]).some(it=>it.supplierId===s.id||(it.batchAllocations||[]).some(a=>a.supplierId===s.id)));
  const totalPurchase=purchases.reduce((a,r)=>a+Number(r.total||0),0);
  const totalPayable=Number(s.balance||0);
  const paidAmount=supplierTotalPaid(s,purchases);
  const supplierProducts=[];
  const productMap={};
  productsList.forEach(p=>{
    const batches=(p.batches||[]).filter(b=>b.supplierId===s.id);
    const remainQty=batches.reduce((a,b)=>a+Number(b.remainingQty||0),0);
    const totalQty=batches.reduce((a,b)=>a+Number(b.qty||0),0);
    if(totalQty>0||remainQty>0){
      const weightedQty=batches.reduce((a,b)=>a+Number(b.remainingQty||0),0);const weightedCost=batches.reduce((a,b)=>a+Number(b.remainingQty||0)*Number(b.buyPrice||0),0);
      const vmap={};batches.forEach(b=>{const k=String(b.variantKey||'original');const o=vmap[k]||(vmap[k]={key:k,totalQty:0,remainQty:0,cost:0});o.totalQty+=Number(b.qty||0);o.remainQty+=Number(b.remainingQty||0);o.cost+=Number(b.remainingQty||0)*Number(b.buyPrice||0)});
      productMap[p.id]={product:p,name:p.name,batches,variants:Object.values(vmap),totalQty,remainQty,avgPrice:weightedQty>0?weightedCost/weightedQty:(batches.length?batches.reduce((a,b)=>a+Number(b.buyPrice||0),0)/batches.length:0)};
    }
  });
  Object.values(productMap).forEach(x=>supplierProducts.push(x));
  const supplierSaleRows=supplierSalesFor(s.id);
  const filteredSupplierSaleRows=supplierProfileSalesInRange(supplierSaleRows);
  const soldByProduct={};
  supplierSaleRows.forEach(x=>{const key=String(x.item.productId||'')+'|'+String(x.item.name||'').toLowerCase();soldByProduct[key]=(soldByProduct[key]||0)+Number(x.qty||0)});
  supplierProducts.forEach(x=>{const key=String(x.product.id||'')+'|'+String(x.name||'').toLowerCase();x.soldQty=Number(soldByProduct[key]||0);x.salesAmount=supplierSaleRows.filter(z=>(String(z.item.productId||'')===String(x.product.id||'')||(String(z.item.name||'').toLowerCase()===String(x.name||'').toLowerCase()))).reduce((sum,z)=>sum+Number(z.amount||0),0)});
  supplierProducts.forEach(x=>{x.variants.forEach(v=>{v.soldQty=supplierSaleRows.filter(z=>String(z.item.productId||'')===String(x.product.id)&&String(z.item.variantKey||'original')===v.key).reduce((a,z)=>a+Number(z.qty||0),0)})});
  supplierProducts.sort((a,b)=>(b.remainQty>0)-(a.remainQty>0)||String(a.name).localeCompare(String(b.name)));
  let totalSalesQty=0,totalSalesAmount=0,totalSalesProfit=0;
  sales.forEach(r=>{
    (r.items||[]).forEach(it=>{
      const allocations=Array.isArray(it.batchAllocations)&&it.batchAllocations.length?it.batchAllocations.filter(a=>a.supplierId===s.id):null;
      if(allocations){allocations.forEach(a=>{const q=Number(a.qty||0),amt=q*Number(it.rate||0),cost=q*Number(a.buyPrice??it.buyPrice??0);totalSalesQty+=q;totalSalesAmount+=amt;totalSalesProfit+=amt-cost})}
      else if(it.supplierId===s.id){const q=Number(it.qty||0),amt=q*Number(it.rate||0),cost=q*Number(it.buyPrice||0);totalSalesQty+=q;totalSalesAmount+=amt;totalSalesProfit+=amt-cost}
    });
  });
  const autoPurchases=purchases.filter(r=>r.isAuto);
  const autoPurchaseTotal=autoPurchases.reduce((a,r)=>a+Number(r.total||0),0);
  const recentTx=[];

  supplierSalesFor(s.id).forEach(x=>recentTx.push({type:'sale',date:x.record.date,time:x.record.time||'',createdAt:x.record.createdAt||0,amount:x.amount,productName:x.item.name,qty:x.qty,rate:Number(x.item.rate||0),note:'Sale to '+(x.record.customerName||'Walk-in'),invoiceId:x.record.id}));
  (s.manualLedger||[]).forEach(l=>recentTx.push({type:supplierIsPaymentLedger(l)?'payment':'manual',date:l.date,time:l.time||'',createdAt:l.createdAt||0,amount:Number(l.amount||0),note:l.note||'Ledger entry'}));
  recentTx.sort((a,b)=>b.createdAt-a.createdAt);
  const ph=s.photo?'<img src="'+s.photo+'" style="width:60px;height:60px;border-radius:50%;object-fit:cover;float:right;">':'';
  c.innerHTML=`

    </div>
    ${supplierNidSectionHtml(s)}
    <div class="supplier-stat-grid">
      <div class="supplier-stat"><div class="lbl">মোট Purchase</div><div class="val blue">${money(totalPurchase)}</div><div style="font-size:10px;color:#888;margin-top:2px;">${purchases.length}টি এন্ট্রি</div></div>

      <div class="supplier-stat"><div class="lbl">তার মাল বিক্রি</div><div class="val orange">${money(totalSalesAmount)}</div><div style="font-size:10px;color:#888;margin-top:2px;">${totalSalesQty} pcs</div></div>
    </div>
    <div class="supplier-stat-grid">
      <div class="supplier-stat"><div class="lbl">তার মাল থেকে মোট লাভ</div><div class="val green">${money(totalSalesProfit)}</div></div>

function getSupplierSalesRange(){
  if(supplierSalesPeriod==='custom'){const f=document.getElementById('ssp-from')?.value;const t=document.getElementById('ssp-to')?.value;if(f&&t)return{from:f,to:t};return getPeriodRange('today')}
  if(supplierSalesPeriod==='week')return getPeriodRange('week');
  if(supplierSalesPeriod==='month')return getPeriodRange('month');
  return getPeriodRange('today');
}

function buildSupplierSalesData(){
  const range=getSupplierSalesRange();
  const salesInRange=salesRecords.filter(r=>dateInRange(r,range.from,range.to));
  const map=new Map();
  const addLine=(r,it,sId,sName,q,buyPrice)=>{
    q=Number(q||0);if(q<=0)return;
    const supplier=sId?suppliers.find(x=>x.id===sId):null;
    sName=supplier?.name||sName||'(অজানা)';
    const key=sId?'id:'+String(sId):'name:'+sName;
    if(!map.has(key))map.set(key,{supplierId:sId||null,supplierName:sName,qty:0,salesAmount:0,costAmount:0,profit:0,items:[]});
    const entry=map.get(key),rate=Number(it.rate||0),amt=q*rate,cost=q*Number(buyPrice??it.buyPrice??0),profit=amt-cost;
    entry.qty+=q;entry.salesAmount+=amt;entry.costAmount+=cost;entry.profit+=profit;
    entry.items.push({date:r.date,time:r.time||'',productName:it.name||'',subType:it.subType||null,imei:it.imei||'',qty:q,rate,amount:amt,cost,profit,invoiceId:r.id,customerName:r.customerName||'Walk-in',paymentMethod:r.paymentMethod||'Cash'});
  };
  salesInRange.forEach(r=>{
    (r.items||[]).forEach(it=>{
      if(it.isService)return;
      const allocations=Array.isArray(it.batchAllocations)?it.batchAllocations.filter(a=>a&&Number(a.qty||0)>0):[];
      if(allocations.length){
        allocations.forEach(a=>addLine(r,it,a.supplierId||null,a.supplierName||it.supplierName,Number(a.qty||0),a.buyPrice??it.buyPrice));
      }else addLine(r,it,it.supplierId||null,it.supplierName,Number(it.qty||0),it.buyPrice);
    });
  });
  const list=Array.from(map.values()).sort((a,b)=>b.salesAmount-a.salesAmount);
  const totalQty=list.reduce((sum,x)=>sum+x.qty,0);
  const totalSales=list.reduce((sum,x)=>sum+x.salesAmount,0);
  const totalProfit=list.reduce((sum,x)=>sum+x.profit,0);
  return{range,list,totalQty,totalSales,totalProfit};
}

/* ===== DASHBOARD (WITH HOLD AMOUNT) ===== */
function productStockValue(p){
  if(!p||p.nonStock)return 0;
  const vs=ensureProductVariants(p);
  if(!vs)return Number(p.stock||0)*Number(p.buyPrice||0);
  let total=0;
  Object.keys(vs).forEach(k=>{
    const v=vs[k],vStock=Math.max(0,Number(v.stock||0));
    const bs=(p.batches||[]).filter(b=>String(b.variantKey||'original')===k&&Number(b.remainingQty)>0);
    const bQty=bs.reduce((a,b)=>a+Number(b.remainingQty||0),0);
    const bCost=bs.reduce((a,b)=>a+Number(b.remainingQty||0)*Number(b.buyPrice||0),0);
    const counted=Math.min(bQty,vStock);
    const cost=bQty>0?bCost*(counted/bQty):0;
    total+=cost+(vStock-counted)*Number(v.buyPrice||0);
  });
  return total;
}
function isProductLow(p){
  if(!p||p.nonStock)return false;
  if(Number(p.stock||0)<=Number(p.lowStockLimit||5)&&getFormTypeByCategoryId(p.categoryId)!=='mobile')return true;
  return productVariantKeys(p).some(k=>{const v=p.variants[k];return Number(v.lowStock||0)>0&&Number(v.stock||0)<=Number(v.lowStock)});
}
function updateDashboard(){

function retRecId(x){return String(x.type==='sale'?(x.saleRecordId||''):(x.purchaseRecordId||''))}
function retReturnedQty(type,recId,idx,exceptId){
  return returnRecords.filter(x=>x.type===type&&String(x.id)!==String(exceptId||'')&&retRecId(x)===String(recId)&&retIdx(x)===idx).reduce((s,x)=>s+Number(x.qty||0),0);

function retItemReturnable(type,rec,idx,item,exceptId){
  let left=Number(item.qty||0)-retReturnedQty(type,rec.id,idx,exceptId);
  if(type==='sale'&&item.imei&&wasSaleImeiReturned(rec.id,item.imei,exceptId))left=0;

function retEntityMatchesRecord(rec){
  if(!retEntity)return true;
  if(returnType==='sale')return (rec.customerId&&String(rec.customerId)===String(retEntity.id))||(!rec.customerId&&String(rec.customerName||'').toLowerCase()===String(retEntity.name||'').toLowerCase());
  return (rec.supplierId&&String(rec.supplierId)===String(retEntity.id))||(!rec.supplierId&&String(rec.supplierName||'').toLowerCase()===String(retEntity.name||'').toLowerCase());
}
function retInvoiceItems(){
  const list=returnType==='sale'?salesRecords:purchaseRecords,out=[];
  list.forEach(rec=>{
    if(returnType==='purchase'&&(rec.isAuto||rec.autoFromSaleId))return;
    if(!retEntityMatchesRecord(rec))return;

      if(item.isService||item.formType==='service')return;
      const returnable=retItemReturnable(returnType,rec,idx,item,editingReturnId);

    });

function reverseReturnEffects(r){
  if(!r)return;
  const amt=Number(r.amount||0),p=r.productId?productsList.find(x=>String(x.id)===String(r.productId)):null,vk=r.variantKey||'original';
  if(p&&!p.nonStock){
    if(r.type==='sale'){
      const rec=r.saleRecordId?salesRecords.find(x=>String(x.id)===String(r.saleRecordId)):null;
      let item=rec&&retIdx(r)>=0?rec.items?.[retIdx(r)]:null;
      if(!item&&rec&&r.imei)item=(rec.items||[]).find(it=>normalizeImei(it.imei)===normalizeImei(r.imei));
      if(item&&String(item.productId)===String(p.id)&&r.restoreMode!=='stock')adjustSaleItemInventory(item,Number(r.qty||0),-1);
      else adjustProductVariantStock(p,vk,-Number(r.qty||0));
    }else{adjustProductVariantStock(p,vk,Number(r.qty||0));restorePurchaseReturnBatches(p,r)}
  }
  if(r.refundAccountId){
    const acc=accounts.find(a=>String(a.id)===String(r.refundAccountId));
    if(acc){acc.balance=r.type==='sale'?retAdd(acc.balance||0,amt):retAdd(acc.balance||0,-amt);saveAccounts()}
    moneyTransactions=moneyTransactions.filter(x=>String(x.ref)!==String(r.id));saveMoneyTxLog();
  }else if(r.balanceApplied!==false){
    if(r.type==='sale'){const c=(r.customerId&&customers.find(x=>String(x.id)===String(r.customerId)))||(r.entityName&&customers.find(x=>String(x.name||'').toLowerCase()===String(r.entityName).toLowerCase()));if(c){c.balance=retAdd(c.balance||0,amt);saveCustomers()}}
    else{const s=(r.supplierId&&suppliers.find(x=>String(x.id)===String(r.supplierId)))||(r.entityName&&suppliers.find(x=>String(x.name||'').toLowerCase()===String(r.entityName).toLowerCase()));if(s){s.balance=retAdd(s.balance||0,amt);saveSuppliers()}}
  }
}
function applyReturnEffects(r){
  const amt=Number(r.amount||0),p=r.productId?productsList.find(x=>String(x.id)===String(r.productId)):null;
  r.batchAllocations=[];r.restoreMode='';
  if(p&&!p.nonStock){
    if(r.type==='sale'){
      const rec=r.saleRecordId?salesRecords.find(x=>String(x.id)===String(r.saleRecordId)):null,item=rec&&retIdx(r)>=0?rec.items?.[retIdx(r)]:null;
      if(item&&String(item.productId)===String(p.id)){adjustSaleItemInventory(item,r.qty,1);r.restoreMode='sale-item'}
      else{adjustProductVariantStock(p,r.variantKey,r.qty);r.restoreMode='stock'}
    }else{
      const rec=r.purchaseRecordId?purchaseRecords.find(x=>String(x.id)===String(r.purchaseRecordId)):null,item=rec&&retIdx(r)>=0?rec.items?.[retIdx(r)]:null;
      let left=Number(r.qty||0);
      if(item?.batchId&&Array.isArray(p.batches)){const b=p.batches.find(x=>String(x.batchId)===String(item.batchId));if(b&&Number(b.remainingQty||0)>0){const take=Math.min(left,Number(b.remainingQty));b.remainingQty=Number(b.remainingQty)-take;left-=take;r.batchAllocations.push({batchId:b.batchId,qty:take,supplierId:b.supplierId||null,supplierName:b.supplierName||null,variantKey:r.variantKey})}}
      if(left>0){const sup=r.supplierId?suppliers.find(s=>String(s.id)===String(r.supplierId)):null;r.batchAllocations.push(...deductSupplierReturnBatches(p,sup||{id:'',name:''},left,r.variantKey))}
      adjustProductVariantStock(p,r.variantKey,-Number(r.qty||0));
    }
  }
  r.balanceApplied=false;
  if(r.refundAccountId){
    const acc=accounts.find(a=>String(a.id)===String(r.refundAccountId));
    if(acc){acc.balance=r.type==='sale'?retAdd(acc.balance||0,-amt):retAdd(acc.balance||0,amt);saveAccounts();logMoneyTx({type:r.type==='sale'?'out':'in',amount:amt,accountId:acc.id,note:(r.type==='sale'?'Sale Return':'Purchase Return')+' ('+String(r.id).slice(-6)+')',ref:r.id,date:r.date})}
  }else if(r.type==='sale'&&r.customerId){const c=customers.find(x=>String(x.id)===String(r.customerId));if(c){c.balance=retAdd(c.balance||0,-amt);saveCustomers();r.balanceApplied=true}}
  else if(r.type==='purchase'&&r.supplierId){const s=suppliers.find(x=>String(x.id)===String(r.supplierId));if(s){s.balance=retAdd(s.balance||0,-amt);saveSuppliers();r.balanceApplied=true}}
}

function restorePurchaseReturnBatches(product,returnRecord){
  if(!product||!Array.isArray(returnRecord?.batchAllocations)||!Array.isArray(product.batches))return;
  returnRecord.batchAllocations.forEach(a=>{
    const batch=product.batches.find(b=>String(b.batchId)===String(a.batchId));
    if(batch)batch.remainingQty=Number(batch.remainingQty||0)+Number(a.qty||0);
  });
}

function deductSupplierReturnBatches(product,supplier,qty,variantKey='original'){
  if(!product||!supplier||!Number.isFinite(qty)||qty<=0)return[];
  variantKey=PRODUCT_VARIANT_DEFS.some(def=>def.key===variantKey)?variantKey:'original';
  if(!Array.isArray(product.batches))product.batches=[];
  let remaining=qty;
  const allocations=[];
  let supplierBatches=product.batches.filter(b=>String(b.variantKey||'original')===variantKey&&String(b.supplierId||'')===String(supplier.id)&&Number(b.remainingQty)>0).sort((a,b)=>Number(a.createdAt||0)-Number(b.createdAt||0));
  const supplierAvailable=supplierBatches.reduce((sum,b)=>sum+Number(b.remainingQty||0),0);
  const allBatched=product.batches.filter(b=>String(b.variantKey||'original')===variantKey).reduce((sum,b)=>sum+Number(b.remainingQty||0),0);
  const unassigned=Math.max(0,Number(getProductVariant(product,variantKey).stock||0)-allBatched);
  if(unassigned>0){
    const legacyBatch={batchId:'bat_'+uid(),supplierId:null,supplierName:'Unassigned legacy stock',buyPrice:Number(getProductVariant(product,variantKey).buyPrice||0),variantKey,qty:unassigned,remainingQty:unassigned,date:'',purchaseInvoiceId:null,createdAt:Number(product.createdAt||Date.now()),isAdjustment:true,note:'Legacy stock synchronized before supplier return'};
    product.batches.push(legacyBatch);
  }
  const consume=(batches,supplierId,supplierName)=>{
    for(const batch of batches){
      if(remaining<=0)break;
      const take=Math.min(remaining,Number(batch.remainingQty||0));
      if(take<=0)continue;
      batch.remainingQty=Number(batch.remainingQty||0)-take;
      remaining-=take;
       allocations.push({batchId:batch.batchId,qty:take,supplierId,supplierName:supplierId?supplierName:null,variantKey});
    }
  };
  consume(supplierBatches,supplier.id,supplier.name);
  if(remaining>0){
     const unassignedBatches=product.batches.filter(b=>String(b.variantKey||'original')===variantKey&&!b.supplierId&&Number(b.remainingQty)>0).sort((a,b)=>Number(a.createdAt||0)-Number(b.createdAt||0));
    consume(unassignedBatches,null,null);
  }
  if(remaining>0)saToast('⚠️ Supplier batch-এ ফেরতের সব Qty মেলেনি; পাওয়া batch-গুলোর স্টক কমানো হয়েছে','info',4000);
  return allocations;
}

function saRenderChart(){

function renderReportDetail(){
  const th=document.getElementById('report-table-head');const tb=document.getElementById('report-detail-tbody');const sb=document.getElementById('report-summary-bar');
  if(!tb)return;
  const q=(document.getElementById('report-detail-search')?.value||'').trim().toLowerCase();
  const range=getActiveRange(reportPeriod);
  const reportWa=document.getElementById('sales-report-wa-btn');if(reportWa)reportWa.style.display=activeReportType==='sales'?'block':'none';
  if(activeReportType==='stock'){
    let list=productsList.filter(p=>!q||[p.name,p.barcode,p.brand].some(v=>String(v||'').toLowerCase().includes(q)));
    th.innerHTML='<tr><th>Product</th><th>Stock</th><th>Buy</th><th>Sale</th><th>Status</th></tr>';
    if(!list.length){tb.innerHTML='<tr><td colspan="5">কোনো ডাটা নেই</td></tr>';return}
    let qty=0,buy=0,sale=0;
    tb.innerHTML=list.slice(0,100).map(p=>{const s=Number(p.stock||0),b=s*Number(p.buyPrice||0),v=s*Number(p.salePrice||0);qty+=s;buy+=b;sale+=v;return `<tr><td>${esc(p.name)}</td><td>${p.nonStock?'∞':s}</td><td>${money(b)}</td><td>${money(v)}</td><td>${p.active===false?'Inactive':'Active'}</td></tr>`}).join('');
    sb.innerHTML=`<span>${list.length} Products</span><span>Qty ${qty}</span><span>Buy ${money(buy)}</span><span>Sale ${money(sale)}</span>`;
    return;
  }
  if(activeReportType==='product-wise'){
    th.innerHTML='<tr><th>Product</th><th>Qty</th><th>Revenue</th><th>Cost</th><th>Profit</th></tr>';
    const map={};
    salesRecords.filter(r=>dateInRange(r,range.from,range.to)).forEach(r=>{(r.items||[]).forEach(it=>{const n=it.name||'Unknown';if(!map[n])map[n]={qty:0,revenue:0,cost:0};map[n].qty+=Number(it.qty||0);map[n].revenue+=Number(it.qty||0)*Number(it.rate||0);map[n].cost+=Number(it.qty||0)*Number(it.buyPrice||0)})});
    let list=Object.entries(map).map(([n,d])=>({name:n,...d,profit:d.revenue-d.cost}));
    if(q)list=list.filter(x=>x.name.toLowerCase().includes(q));
    list.sort((a,b)=>b.revenue-a.revenue);
    let tq=0,tr=0,tp=0;
    tb.innerHTML=list.slice(0,100).map(x=>{tq+=x.qty;tr+=x.revenue;tp+=x.profit;return `<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.revenue)}</td><td>${money(x.cost)}</td><td>${money(x.profit)}</td></tr>`}).join('')||'<tr><td colspan="5">কোনো ডাটা নেই</td></tr>';
    sb.innerHTML=`<span>Total</span><span>Qty ${tq}</span><span>Rev ${money(tr)}</span><span>Profit ${money(tp)}</span>`;
    return;
  }
  if(activeReportType==='customer-wise'){
    th.innerHTML='<tr><th>Customer</th><th>Inv</th><th>Total</th><th>Received</th><th>Due</th><th>Pending</th></tr>';
    const map={};
    salesRecords.filter(r=>dateInRange(r,range.from,range.to)).forEach(r=>{if(r.status==='delivered'&&r.moneyPosted===false)return;const n=r.customerName||'Walk-in';if(!map[n])map[n]={count:0,total:0,paid:0,due:0,pending:0};const t=Number(r.total||r.amount||0);map[n].count++;map[n].total+=t;if(r.status!=='delivered'){map[n].pending+=t;return}const d=Number(r.dueAmount||(String(r.paymentMethod||'').toLowerCase()==='due'?t:0));map[n].due+=d;map[n].paid+=(t-d)});
    let list=Object.entries(map).map(([n,d])=>({name:n,...d}));
    if(q)list=list.filter(x=>x.name.toLowerCase().includes(q));
    list.sort((a,b)=>b.total-a.total);
    let tc=0,tt=0,td=0,tp=0;
    tb.innerHTML=list.slice(0,100).map(x=>{tc+=x.count;tt+=x.total;td+=x.due;tp+=x.pending;return `<tr><td>${esc(x.name)}</td><td>${x.count}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${money(x.due)}</td><td>${money(x.pending)}</td></tr>`}).join('')||'<tr><td colspan="6">কোনো ডাটা নেই</td></tr>';
    sb.innerHTML=`<span>${tc} Customers</span><span></span><span>${money(tt)}</span><span>Due ${money(td)}</span><span>Pending ${money(tp)}</span>`;
    return;
  }
  let records=activeReportType==='purchase'?purchaseRecords:salesRecords;
  records=records.filter(r=>dateInRange(r,range.from,range.to));
  records=records.filter(r=>!q||[r.productName,r.customerName,r.supplierName].some(v=>String(v||'').toLowerCase().includes(q)));
  if(activeReportType==='profit-loss'){
    th.innerHTML='<tr><th>Date</th><th>Product</th><th>Qty</th><th>Sales</th><th>Profit</th></tr>';
    let qty=0,sales=0,grossProfit=0;
    tb.innerHTML=records.slice(0,100).map(r=>{const qv=Number(r.qty||0),amt=Number(r.total||r.amount||0);const cost=(r.items||[]).reduce((a,it)=>a+Number(it.qty||0)*Number(it.buyPrice||0),0);const pr=amt-cost;qty+=qv;sales+=amt;grossProfit+=pr;return `<tr><td>${esc(recordDateKey(r))}</td><td>${esc(r.productName||'-')}</td><td>${qv}</td><td>${money(amt)}</td><td>${money(pr)}</td></tr>`}).join('')||'<tr><td colspan="5">কোনো ডাটা নেই</td></tr>';
    const operatingExpense=expenseRecords.filter(r=>dateInRange(r,range.from,range.to)&&isProfitDeductibleExpense(r)).reduce((sum,r)=>sum+Number(r.amount||0),0);
    sb.innerHTML=`<span>${records.length} Records</span><span>Qty ${qty}</span><span>Sales ${money(sales)}</span><span>Operating Expense ${money(operatingExpense)}</span><span>Net Profit ${money(grossProfit-operatingExpense)}</span>`;
    return;
  }
  th.innerHTML='<tr><th>Date</th><th>Product</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>';
  let qty=0,amount=0;
  tb.innerHTML=records.slice(0,100).map(r=>{const qv=Number(r.qty||0),amt=Number(r.total||r.amount||0);qty+=qv;amount+=amt;return `<tr><td>${esc(recordDateKey(r))}</td><td>${esc(r.productName||'-')}</td><td>${qv}</td><td>${money(r.rate)}</td><td>${money(amt)}</td></tr>`}).join('')||'<tr><td colspan="5">কোনো ডাটা নেই</td></tr>';
  sb.innerHTML=`<span>${records.length} Records</span><span>Qty ${qty}</span><span></span><span>${money(amount)}</span>`;
}

function buildDailyCashReportData(){
  const k=getDailyCashDate();
  const s=salesRecords.filter(r=>recordDateKey(r)===k);
   const e=expenseRecords.filter(r=>recordDateKey(r)===k);
   const profitExpenses=e.filter(isProfitDeductibleExpense);
  const receipts=moneyTransactions.filter(x=>x.date===k&&x.type==='in'&&/^(Customer|Wholesaler):/i.test(String(x.note||'')));
  const customerDueCollections=receipts.filter(x=>/^Customer:/i.test(String(x.note||''))).reduce((a,x)=>a+moneyToCents(x.amount||0),0)/100;
  const wholesalerDueCollections=receipts.filter(x=>/^Wholesaler:/i.test(String(x.note||''))).reduce((a,x)=>a+moneyToCents(x.amount||0),0)/100;
  const deliveryCollections=moneyTransactions.filter(x=>{
    if(x.date!==k||x.type!=='in'||!/^Delivered (Sale|Mix) #/i.test(String(x.note||'')))return false;
    const sale=salesRecords.find(r=>String(r.id)===String(x.ref||''));
    return !sale||recordDateKey(sale)!==k;
  }).reduce((a,x)=>a+moneyToCents(x.amount||0),0)/100;
  const artisanPayments=moneyTransactions.filter(x=>x.date===k&&x.type==='out'&&/^Carigor:/i.test(String(x.note||''))).reduce((a,x)=>a+moneyToCents(x.amount||0),0)/100;
  let cs=0,bs=0,ns=0,bas=0,ds=0,ms=0,ps=0;
  s.forEach(r=>{const m=String(r.paymentMethod||'').toLowerCase();const tot=Number(r.total||r.amount||0);const due=Number(r.dueAmount||0);if(r.status!=='delivered'){ps+=tot;return}if(!r.moneyPosted)return;if(m==='due')ds+=tot;else if(m==='mix'){(r.splitPayments||[]).forEach(sp=>{const t=String(sp.accountType||'').toLowerCase();const a=Number(sp.amount||0);if(t==='cash')cs+=a;else if(t==='bkash')bs+=a;else if(t==='nagad')ns+=a;else if(t==='bank')bas+=a;else cs+=a});ds+=due;ms+=tot}else if(m==='cash')cs+=tot;else if(m==='bkash')bs+=tot;else if(m==='nagad')ns+=tot;else if(m==='bank')bas+=tot});
  const recognizedSales=s.filter(saIsRealizedSale);
   const ts=recognizedSales.reduce((a,r)=>a+Number(r.total||r.amount||0),0);const te=e.reduce((a,r)=>a+Number(r.amount||0),0);const profitExpense=profitExpenses.reduce((a,r)=>a+Number(r.amount||0),0);
  const spr=recognizedSales.reduce((a,r)=>{const c=(r.items||[]).reduce((x,it)=>x+Number(it.qty||0)*Number(it.buyPrice||0),0);return a+Number(r.total||r.amount||0)-c},0);
  const totalDueCollections=centsToMoney(moneyToCents(customerDueCollections)+moneyToCents(wholesalerDueCollections));
  const totalCollections=centsToMoney(moneyToCents(cs)+moneyToCents(bs)+moneyToCents(ns)+moneyToCents(bas)+moneyToCents(totalDueCollections)+moneyToCents(deliveryCollections));
   return{dateKey:k,sales:s,expenses:e,cashSales:cs,bkashSales:bs,nagadSales:ns,bankSales:bas,dueSales:ds,mixSales:ms,pendingSales:ps,customerDueCollections,wholesalerDueCollections,totalDueCollections,deliveryCollections,totalCollections,artisanPayments,totalSales:ts,totalExpense:te,profitExpense,salesProfit:spr,customerDue:customers.filter(c=>!c.type||c.type==='regular').reduce((x,c)=>x+customerBalance(c),0)+wholesalers.reduce((x,w)=>x+wholesalerBalance(w),0),supplierDue:suppliers.reduce((x,c)=>x+supplierBalance(c),0),totalCash:totalCashPosition(),cashAccounts:accountsByType('cash'),bankAccounts:accountsByType('bank'),mobileAccounts:accountsByType('mobile')};
}

alCollections)}</span></div></div>

  const keys=['pos_users','pos_audit_log','pos_products','pos_sales_records','pos_purchase_records','pos_expense_records','pos_customers','pos_suppliers','pos_carigors','pos_wholesalers','pos_brands','pos_categories','pos_returns','pos_accounts','pos_money_tx','pos_store_profile','pos_theme','pos_wa_templates','pos_printer_paper','pos_printer_type','pos_printer_auto_print','pos_sound_enabled','pos_salary_records','pos_buy_conditions','pos_sell_conditions','pos_buy_template','pos_services','pos_sale_draft','pos_purchase_draft','pos_imei_registry_v1','pos_imei_duplicate_report','pos_v27_migration_backup_v1','pos_variant_defs','pos_variant_migration_v1','pos_printer_color_print','pos_backup_pre_variant_v1'];
  const data={app:'SA Telecom POS',version:1.0,createdAt:new Date().toISOString(),data:{}};
  keys.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)data.data[k]=v});
  downloadBlob('SA_Telecom_POS_Backup_v1.0_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json');
  logAction('backup','Full Backup Exported');saToast('✅ ব্যাকআপ ফাইল ডাউনলোড হয়েছে','success');

function saRestoreBackup(file){
  if(!file)return;
  if(!hasPerm('canBackup')){showPermissionDenied('রিস্টোর করার অনুমতি নেই');return}
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.data)throw new Error();if(!confirm('বর্তমান সকল ডাটা প্রতিস্থাপিত হবে! চালিয়ে যাবেন?'))return;Object.entries(o.data).forEach(([k,v])=>{if(/^pos_[a-z0-9_]+$/.test(k)){const stored=typeof v==='string'?v:JSON.stringify(v);if(typeof stored==='string')localStorage.setItem(k,stored)}});saToast('✅ রিস্টোর সফল, রিলোড হচ্ছে...','success');setTimeout(()=>location.reload(),1000)}catch(e){saToast('ভুল বা নষ্ট ব্যাকআপ ফাইল!','error')}};
  r.readAsText(file);
}

    ${type==='sale'?'<div class="info-row"><span><b>Status:</b> '+esc(String(record.status||'inwork').toUpperCase())+'</span><span>'+(record.carigorName?'🛠️ '+esc(record.carigorName):'')+'</span></div>':''}

function printInvoiceById(id,type='sale'){
  const r=type==='sale'?salesRecords.find(x=>String(x.id)===String(id)):purchaseRecords.find(x=>String(x.id)===String(id));
  if(!r){saToast('ইনভয়েস পাওয়া যায়নি','error');return}
  const html=buildInvoiceHTML(r,type);
  const w=window.open('','_blank','width=600,height=800');
  if(!w){saToast('Popup ব্লক রয়েছে','error');return}
  w.document.write(html);w.document.close();
  logAction('invoice_print',String(id).slice(-8)+' ('+type+')');
}
