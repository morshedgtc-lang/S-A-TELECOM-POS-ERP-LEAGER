<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#ff6600">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- SA Telecom POS v1.0 -->
<title>SA Telecom POS v1.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--primary-color:#ff6600;--bg-color:#f2f4f7;--card-bg:#fff;--text-color:#333;--green-btn:#4caf50;--orange-btn:#ff6600;--red-btn:#e53935;--sidebar-w:250px;--header-h:58px}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background-color:var(--bg-color);color:var(--text-color);overflow-x:hidden;min-height:100vh}
img{max-width:100%;display:block}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
input,select,textarea{-webkit-appearance:none;appearance:none}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#ff6600,#ff8533);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999;overflow-y:auto}
#login-screen.active{display:flex}
.login-card{background:#fff;border-radius:16px;padding:30px 24px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:slideUp .3s ease}
.login-logo{text-align:center;margin-bottom:22px}
.login-logo i{font-size:48px;color:var(--primary-color);margin-bottom:8px}
.login-logo h1{font-size:22px;color:#222;font-weight:800;margin-bottom:4px}
.login-logo p{font-size:12px;color:#888}
.login-field{margin-bottom:14px}
.login-field label{font-size:12px;font-weight:700;color:#333;display:block;margin-bottom:6px}
.login-field input{width:100%;padding:13px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:15px;outline:none;background:#fafafa}
.login-field input:focus{border-color:var(--primary-color);background:#fff;box-shadow:0 0 0 4px rgba(255,102,0,.1)}
.login-btn{width:100%;background:linear-gradient(135deg,#ff6600,#ff8533);color:#fff;border:0;padding:15px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px}
.login-hint{background:#fff7ed;border:1px dashed #ffb74d;color:#9a4d00;padding:10px 12px;border-radius:9px;font-size:11px;text-align:center;margin-top:14px;font-weight:600}
.login-error{background:#ffebee;color:#c62828;padding:10px 12px;border-radius:9px;font-size:12px;margin-bottom:12px;font-weight:700;display:none;text-align:center}
.login-error.show{display:block}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.header{background-color:var(--primary-color);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.15);height:var(--header-h)}
.header .left-section{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:bold;flex:1;min-width:0}
.header .right-section{display:flex;align-items:center;gap:8px;flex-shrink:0}
.header i{cursor:pointer;font-size:18px}
.header .menu-btn{display:none;background:rgba(255,255,255,.2);border:0;color:#fff;width:36px;height:36px;border-radius:8px;font-size:18px;cursor:pointer;align-items:center;justify-content:center}
#page-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.header-title-stack{display:flex;flex:1;min-width:0;flex-direction:column;line-height:1.15}
#app-brand-title{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(54vw,340px)}
#page-title{font-size:10px;font-weight:600;opacity:.86;max-width:none}
.header-cash{background:rgba(255,255,255,.2);padding:5px 12px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px;cursor:pointer}
.user-chip{background:rgba(255,255,255,.2);padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;max-width:140px}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99998;display:none}
.sidebar-backdrop.active{display:block}
.app-shell{display:flex;min-height:calc(100vh - var(--header-h))}
.sidebar{display:none;width:var(--sidebar-w);background:#1f2937;color:#e5e7eb;flex-shrink:0;padding:12px 0;position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow-y:auto;z-index:100}
.sidebar .side-item{display:flex;align-items:center;gap:12px;padding:12px 20px;color:#d1d5db;font-size:14px;font-weight:600;cursor:pointer;border-left:3px solid transparent;position:relative}
.sidebar .side-item.active{background:#111827;color:#fff;border-left-color:var(--primary-color)}
.sidebar .side-item i{width:22px;text-align:center;font-size:16px}
.sidebar .side-item.locked{opacity:.5;cursor:not-allowed}
.sidebar .side-section{padding:14px 20px 6px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6b7280;font-weight:700}
.sidebar .side-close{display:none;position:absolute;top:10px;right:10px;background:rgba(255,255,255,.1);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.main-area{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:0}
.container{padding:12px;max-width:100%;margin:0 auto;width:100%}
.view-section{display:none}
.view-section.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.card{background-color:var(--card-bg);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 5px rgba(0,0,0,.05)}
.track-position-card{background:linear-gradient(135deg,#1565c0,#1e88e5);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer}
.track-position-card .tp-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800}
.track-position-card .tp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;text-align:center}
.track-position-card .tp-cell{background:rgba(255,255,255,.15);border-radius:10px;padding:8px 4px}
.track-position-card .tp-count{font-size:22px;font-weight:900}
.track-position-card .tp-label{font-size:11px;font-weight:700;margin-top:2px}
.carigor-dashboard-card{background:linear-gradient(135deg,#6a1b9a,#8e24aa);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer}
.carigor-dashboard-card .cp-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800}
.carigor-dashboard-card .cp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.carigor-dashboard-card .cp-cell{background:rgba(255,255,255,.15);border-radius:10px;padding:8px 4px}
.carigor-dashboard-card .cp-count{font-size:20px;font-weight:900}
.carigor-dashboard-card .cp-label{font-size:11px;font-weight:700;margin-top:2px}
.hold-amount-card{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border-radius:14px;padding:16px;margin-bottom:14px;cursor:pointer}
.hold-amount-card .ha-label{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
.hold-amount-card .ha-total{font-size:28px;font-weight:900;margin:6px 0 10px 0;word-break:break-all}
.hold-amount-card .ha-breakup{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:11px;border-top:1px dashed rgba(255,255,255,.4);padding-top:10px}
.hold-amount-card .ha-breakup span{display:flex;justify-content:space-between;gap:6px}
.status-badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:800;text-transform:uppercase}
.status-badge.inwork{background:#fff3e0;color:#e65100;border:1px solid #ffcc80}
.status-badge.outwork{background:#e3f2fd;color:#1565c0;border:1px solid #90caf9}
.status-badge.delivered{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.status-badge.successful{background:#f3e5f5;color:#6a1b9a;border:1px solid #ce93d8}
.status-badge.unsuccessful{background:#ffebee;color:#c62828;border:1px solid #ef9a9a}
.cash-position-card{background:linear-gradient(135deg,#2e7d32,#4caf50);color:#fff;border-radius:14px;padding:18px;margin-bottom:14px;cursor:pointer}
.cash-position-card .cp-label{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
.cash-position-card .cp-total{font-size:28px;font-weight:900;margin:6px 0 10px 0;word-break:break-all}
.cash-position-card .cp-breakup{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:12px;border-top:1px dashed rgba(255,255,255,.4);padding-top:10px}
.cash-position-card .cp-breakup span{display:flex;justify-content:space-between;gap:6px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.summary-card{background:#fff;border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.1);cursor:pointer;min-width:0}
.summary-card i{font-size:22px;color:var(--primary-color);flex-shrink:0}
.summary-details{min-width:0;flex:1;overflow:hidden}
.summary-details .title{font-size:12px;color:#555;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary-details .value{font-size:15px;font-weight:bold;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-title{font-size:16px;font-weight:bold;margin:15px 0 10px 0}
.quick-access-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}
.quick-btn{background:#fff;border-radius:10px;padding:14px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;border-bottom:3px solid transparent;min-width:0}
.quick-btn i{font-size:22px;margin-bottom:6px;color:#555}
.quick-btn .label-bn{font-size:12px;font-weight:bold;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick-btn .label-en{font-size:10px;color:#777;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.settings-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:15px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.settings-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.settings-title{display:flex;align-items:center;gap:8px;font-weight:bold;font-size:15px}
.form-group{margin-bottom:10px}
.form-control{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;background-color:#fafafa}
.form-control:focus{border-color:var(--primary-color);background-color:#fff;box-shadow:0 0 0 3px rgba(255,102,0,.1)}
select.form-control{background-image:url("data:image/svg+xml;utf8,<svg fill='%23666' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 6px center;padding-right:32px;background-size:20px}
.btn-action{width:100%;background-color:var(--primary-color);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;margin-top:5px}
.btn-action:active{transform:scale(.98)}
.btn-secondary{background-color:#757575;color:#fff}
.btn-blue{background-color:#448aff;color:#fff}
.btn-danger{background-color:#e53935;color:#fff}
.btn-success{background-color:#4caf50;color:#fff}
.btn-warn{background-color:#ff9800;color:#fff}
.btn-purple{background-color:#6a1b9a;color:#fff}
.checkbox-group{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:#333;font-weight:500;cursor:pointer}
.checkbox-group input[type="checkbox"]{width:18px;height:18px;accent-color:#2e7d32;cursor:pointer;flex-shrink:0}
.filter-pill-row{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filter-pill-row::-webkit-scrollbar{display:none}
.filter-btn{background:#fff;border:1px solid #ddd;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;color:#555}
.filter-btn.active{background-color:var(--primary-color);color:#fff;border-color:var(--primary-color)}
.search-action-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search-action-bar input{flex:1;padding:11px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;min-width:0;outline:none}
.btn-add-action{padding:9px 14px;border-radius:8px;border:none;color:#fff;font-weight:bold;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.empty-list-box{background:#fff;border-radius:12px;padding:45px 20px;text-align:center;color:#777;font-weight:bold;margin:15px 0}
.list-footer-info{color:#333;font-size:12px;font-weight:bold;margin-top:10px;background:#e8ecef;padding:11px;border-radius:8px;word-break:break-word}
.top-banner-btn{width:100%;padding:14px;border-radius:8px;color:#fff;font-weight:bold;font-size:15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border:none;cursor:pointer}
.cart-summary-box{background:#e8f5e9;border-radius:10px;padding:12px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;font-weight:bold;color:#2e7d32}
.toolbar-row{display:flex;gap:8px;margin-top:12px}
.toolbar-row button{flex:1;padding:11px;border:none;border-radius:8px;color:#fff;font-weight:bold;font-size:12px;cursor:pointer}
.report-table-card{background:#fff;border-radius:8px;overflow:hidden;margin-top:10px;overflow-x:auto}
.report-table{width:100%;border-collapse:collapse;font-size:12px;min-width:500px}
.report-table th{background-color:#e9ecef;padding:9px;text-align:center;font-weight:bold;white-space:nowrap}
.report-table td{padding:10px 8px;text-align:center;color:#333;border-bottom:1px solid #f0f0f0;word-break:break-word}
.report-summary-bar{background:#e9ecef;padding:9px 12px;display:flex;justify-content:space-between;font-size:12px;font-weight:bold;gap:6px;flex-wrap:wrap}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:2000;padding:12px;overflow-y:auto}
.modal-overlay.active{display:flex}
.modal-card{background:#fff;width:100%;max-width:480px;border-radius:12px;padding:20px;max-height:92vh;overflow-y:auto;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal-header{font-size:16px;font-weight:bold;margin-bottom:15px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:62px;background-color:#fff;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #e0e0e0;z-index:1000}
.nav-item{display:flex;flex-direction:column;align-items:center;color:#757575;text-decoration:none;font-size:10px;cursor:pointer;padding:6px 8px;flex:1;min-width:0}
.nav-item i{font-size:18px;margin-bottom:2px}
.nav-item.active{color:var(--primary-color);font-weight:bold}
.entity-card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.05);gap:8px;flex-wrap:wrap}
.entity-info{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.entity-avatar{width:44px;height:44px;border-radius:10px;background:#e3f2fd;display:flex;align-items:center;justify-content:center;font-size:19px;color:#1976d2;flex-shrink:0;overflow:hidden}
.entity-avatar img{width:100%;height:100%;object-fit:cover}
.entity-details{min-width:0;flex:1}
.entity-details h4{font-size:14px;color:#333;word-break:break-word}
.entity-details p{font-size:11px;color:#777;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-blue-pill{background-color:#448aff;color:#fff;border:none;padding:7px 14px;border-radius:6px;font-size:11px;font-weight:bold;cursor:pointer;flex-shrink:0}
.btn-blue-pill.edit{background-color:#ff9800}
.btn-blue-pill.danger{background-color:#e53935}
.btn-blue-pill.wa{background-color:#25d366}
.btn-blue-pill.print{background-color:#2e7d32}
.btn-blue-pill.status{background-color:#1565c0}
.cat-node{background:#fff;border-left:3px solid var(--primary-color);border-radius:8px;padding:9px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.05);font-size:13px;font-weight:600;gap:6px;flex-wrap:wrap}
.cat-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.cat-actions button{border:none;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:bold;color:#fff;cursor:pointer}
.product-page{padding-bottom:10px}
.product-limit-row,.product-filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;margin-bottom:10px;scrollbar-width:none}
.product-limit-row::-webkit-scrollbar,.product-filter-row::-webkit-scrollbar{display:none}
.product-toolbar{display:flex;gap:8px;align-items:stretch;margin:8px 0 14px;flex-wrap:wrap}
.product-search{flex:1;min-width:0;padding:12px;border:1px solid #d8dde3;border-radius:10px;font-size:14px;outline:none;background:#fff}
.product-icon-btn{width:58px;border:none;border-radius:10px;background:#ffb74d;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
.product-add-btn{width:150px;border:none;border-radius:10px;background:var(--orange-btn);color:#fff;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0}
.product-filter-row-2{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.product-card{background:#fff;border-bottom:1px solid #cfd3d6;padding:12px 10px;display:flex;align-items:center;gap:10px;min-height:112px}
.product-card-icon{width:65px;height:65px;border:1px solid #eee;background:#f7f8fa;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#78909c;font-size:30px;flex-shrink:0;overflow:hidden}
.product-card-icon img{width:100%;height:100%;object-fit:cover}
.product-card-info{flex:1;min-width:0}
.product-card-info h4{font-size:15px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#17202a}
.product-card-info p{font-size:11px;color:#697586;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-card-actions{display:flex;gap:5px;flex-shrink:0;flex-direction:column}
.product-card-menu{border:none;border-radius:8px;background:#448aff;color:#fff;padding:10px 9px;font-size:12px;font-weight:700;cursor:pointer}
.product-card-edit{border:none;border-radius:8px;background:#ff9800;color:#fff;padding:10px 9px;font-size:12px;cursor:pointer}
.product-footer-total{padding:14px 2px;font-size:13px;font-weight:800;color:#17202a;word-break:break-word}
.product-empty{background:#fff;border-radius:10px;padding:40px 15px;text-align:center;color:#777;font-weight:600}
.product-action-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.product-action-btn{width:100%;padding:14px 18px;border:1px solid #dfe4e8;background:#fff;border-radius:12px;text-align:left;font-size:15px;font-weight:700;cursor:pointer;color:#17202a}
.product-action-btn.blue{background:#eef6ff;border-color:#b9d9f7;color:#2d5791}
.product-action-btn.danger{background:#fff2f2;border-color:#efc3c3;color:#ad3030}
.product-action-btn.green{background:#effaf1;border-color:#b9dfbf;color:#2e7d32}
.sale-product-picker .modal-card{max-width:560px;padding:0;overflow:hidden}
.sale-picker-head{background:var(--primary-color);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.sale-picker-close{border:0;background:rgba(255,255,255,.18);color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.sale-picker-tools{padding:12px;background:#f7f8fa;border-bottom:1px solid #e5e7eb}
.sale-picker-search-row{display:flex;gap:7px}
.sale-picker-search{flex:1;min-width:0;padding:11px;border:1px solid #d8dde3;border-radius:9px;font-size:14px;outline:none;background:#fff}
.sale-picker-scan{width:48px;border:0;border-radius:9px;background:#ffb74d;color:#222;font-size:18px;cursor:pointer;flex-shrink:0}
.sale-picker-count{font-size:11px;color:#666;margin-top:6px}
.sale-picker-list{max-height:58vh;overflow:auto;padding:8px}
.sale-picker-item{background:#fff;border:1px solid #e2e6ea;border-radius:11px;padding:10px;margin-bottom:8px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}

/* ===== FINAL RESPONSIVE / ACCESSIBILITY POLISH ===== */
:root{--app-radius:14px;--app-border:#e5e7eb;--app-shadow:0 4px 16px rgba(15,23,42,.055)}
button,.btn-action,.btn-add-action,.btn-blue-pill,.quick-btn,.summary-card{transition:transform .14s ease,box-shadow .14s ease,filter .14s ease}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(255,102,0,.28);outline-offset:2px}
.card,.summary-card,.quick-btn,.hold-amount-card,.cash-position-card{border-radius:var(--app-radius)}
.form-control,.product-search,.search-action-bar input{min-height:42px;border-radius:10px}
.entity-card{border:1px solid #e8ebef;border-radius:14px;box-shadow:0 3px 12px rgba(15,23,42,.045);padding:14px}
.entity-card:hover,.summary-card:hover,.quick-btn:hover{box-shadow:0 7px 20px rgba(15,23,42,.09)}
.supplier-card{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:start;background:#fff;border:1px solid #e5eaf0;border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px rgba(15,23,42,.045);min-width:0}
.supplier-card .supplier-card-avatar{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#fff1e6,#ffdfc2);color:#e66a0a;display:flex;align-items:center;justify-content:center;font-size:27px;overflow:hidden;border:1px solid #ffe0c7;flex-shrink:0}
.supplier-card .supplier-card-avatar img{width:100%;height:100%;object-fit:cover}
.supplier-card-main{min-width:0}
.supplier-card-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.supplier-card-title{font-size:15px;font-weight:900;color:#17202a;overflow-wrap:anywhere}
.supplier-card-meta{font-size:11px;color:#6b7280;line-height:1.6;overflow-wrap:anywhere}
.supplier-card-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:11px}
.supplier-card-stat{min-width:0;padding:8px;border-radius:9px;background:#f8fafc;border:1px solid #eef1f4}
.supplier-card-stat span{display:block;font-size:10px;color:#6b7280;font-weight:700;margin-bottom:4px}
.supplier-card-stat strong{display:block;font-size:12px;line-height:1.25;color:#17202a;overflow-wrap:anywhere}
.supplier-card-stat.due{background:#fff4f2;border-color:#fee2dc}.supplier-card-stat.due strong{color:#c2410c}
.supplier-card-stat.paid{background:#effaf3;border-color:#d5f2df}.supplier-card-stat.paid strong{color:#15803d}
.supplier-card-actions{display:flex;flex-direction:column;gap:6px;min-width:88px}
.supplier-card-actions button{white-space:nowrap}
.supplier-profile-header{position:relative;overflow:hidden;background:linear-gradient(135deg,#166534,#16a34a);box-shadow:0 8px 22px rgba(22,101,52,.17)}
.supplier-stat{box-shadow:0 3px 12px rgba(15,23,42,.035);border-radius:13px;min-width:0}
.supplier-stat .val{overflow-wrap:anywhere}
.supplier-product-stock-card{box-shadow:0 2px 10px rgba(15,23,42,.035)}
@media(min-width:1024px){.supplier-card{padding:16px}.supplier-card-title{font-size:16px}.supplier-card-stat strong{font-size:13px}}
@media(max-width:767px){
 .supplier-card{grid-template-columns:50px minmax(0,1fr);gap:10px;padding:11px}
 .supplier-card .supplier-card-avatar{width:50px;height:50px;font-size:22px;border-radius:10px}
 .supplier-card-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;min-width:0}
 .supplier-card-stats{grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:9px}
 .supplier-card-stat{padding:8px}
 .supplier-card-stat span{font-size:10px}
 .supplier-card-stat strong{font-size:12px}
 .supplier-card-title{font-size:14px}
 .supplier-stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .supplier-profile-header{padding:15px}
 .supplier-profile-header .name{font-size:19px;overflow-wrap:anywhere;padding-right:50px}
 .supplier-profile-header .meta{overflow-wrap:anywhere;line-height:1.6}
}
@media(max-width:360px){.supplier-card-stats{grid-template-columns:1fr 1fr}.supplier-card-stat strong{font-size:11px}.supplier-card-actions button{font-size:11px;padding:8px 5px}}

@media print{
  .bottom-nav,.header,.sidebar,.no-print,.quick-access-grid,.sidebar-backdrop{display:none!important}
  .container{max-width:none;padding:0}
  body{background:#fff;padding:0}
  .app-shell{display:block}
}

.supplier-product-stock-card .variant-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.supplier-product-stock-card .variant-pill{font-size:10.5px;padding:3px 7px;border-radius:12px;display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow-wrap:anywhere}
.supplier-product-stock-card .product-card-info p{white-space:normal}
.sa-link{color:#166534;text-decoration:underline;cursor:pointer;font-weight:800}
.sa-quick-links{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.sa-quick-links button{border:1px solid #d1d5db;background:#fff;border-radius:18px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#17202a}
.tap-card{cursor:pointer}

/* ===== SPLASH SCREEN (v1.0) ===== */
#sa-splash{position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(165deg,#fff8ea 0%,#f6fff3 50%,#e2f9dc 100%);overflow:hidden;transition:opacity .55s ease,visibility .55s ease,transform .55s ease}
#sa-splash.hide{opacity:0;visibility:hidden;transform:scale(1.04);pointer-events:none}
.sa-splash-logo-wrap{position:relative;z-index:1;width:min(86vw,60vh,430px);aspect-ratio:1/1;border-radius:30px;overflow:hidden;box-shadow:0 18px 50px rgba(46,125,50,.22),0 4px 14px rgba(255,102,0,.15);opacity:0;transform:scale(.8) translateY(14px);animation:saLogoIn .95s cubic-bezier(.2,.9,.25,1.1) .15s forwards}
.sa-splash-logo-wrap img{width:100%;height:100%;object-fit:cover;border-radius:inherit;animation:saFloat 3.2s ease-in-out 1.1s infinite}
.sa-splash-logo-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;background-position:160% 0;mix-blend-mode:soft-light;border-radius:inherit;animation:saShine 1.6s ease 1.1s 1 forwards;pointer-events:none}
.sa-splash-foot{z-index:2;position:absolute;left:0;right:0;bottom:max(34px,env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;animation:saFade .6s ease .9s forwards}
.sa-splash-bar{width:min(220px,56vw);height:5px;border-radius:99px;background:rgba(46,125,50,.16);overflow:hidden}
.sa-splash-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4caf50,#9be22b,#ff8a1f);animation:saLoad 2.5s cubic-bezier(.35,.1,.25,1) .9s forwards}
.sa-splash-text{font-size:12px;font-weight:700;color:#2e5d34;letter-spacing:.4px}
.sa-splash-ver{font-size:10px;color:#6b8a6e;letter-spacing:.8px;font-weight:600}
@keyframes saLogoIn{from{opacity:0;transform:scale(.8) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes saFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes saShine{to{background-position:-60% 0}}
@keyframes saFade{to{opacity:1}}
@keyframes saLoad{0%{width:0}60%{width:72%}100%{width:100%}}
@media (prefers-reduced-motion:reduce){#sa-splash *{animation-duration:.01s!important;animation-delay:0s!important}}
.login-logo .login-logo-box{width:210px;height:182px;margin:0 auto 10px;border-radius:16px;overflow:hidden;position:relative;background:#f4ffef;box-shadow:0 6px 18px rgba(76,175,80,.22),inset 0 0 0 1px rgba(76,175,80,.15)}
.login-logo img.login-logo-img{position:absolute;width:240px;height:240px;left:-18px;top:-24px;max-width:none;object-fit:contain}

/* ===== Supplier NID (v1.1) ===== */
.nid-form-box{border:1px dashed #f59e0b;background:#fffbeb;border-radius:11px;padding:10px;margin-bottom:12px}
.nid-form-title{font-size:12px;font-weight:800;color:#92400e;margin-bottom:8px}
.nid-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nid-slot{min-width:0}
.nid-slot-label{font-size:11px;font-weight:700;color:#475569;margin-bottom:4px}
.nid-slot-box{height:92px;border:2px dashed #cbd5e1;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:#64748b;cursor:pointer;overflow:hidden}
.nid-slot-box img{width:100%;height:100%;object-fit:cover}
.nid-slot-box.has-img{border-style:solid;border-color:#16a34a}
.nid-remove-btn{width:100%;margin-top:5px;border:0;border-radius:7px;padding:6px;background:#fee2e2;color:#b91c1c;font-weight:800;font-size:11px;cursor:pointer}
.nid-locked-note{background:#f1f5f9;border-radius:9px;padding:9px;font-size:12px;color:#64748b;margin-bottom:12px;font-weight:700}
.nid-section{margin-bottom:12px}
.nid-toggle-btn{width:100%;border:0;border-radius:10px;padding:11px;background:#1e293b;color:#fff;font-weight:800;font-size:13px;cursor:pointer}
.nid-toggle-btn.active{background:#b45309}
.nid-toggle-btn.locked{background:#94a3b8}
.nid-panel{max-height:0;overflow:hidden;transition:max-height .35s ease}
.nid-panel.open{max-height:1400px}
.nid-panel-grid{display:grid;grid-template-columns:1fr;gap:10px;padding-top:10px}
.nid-panel-grid>div{background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:8px}
.nid-panel-grid .nid-cap{font-size:11px;font-weight:800;color:#475569;margin-bottom:5px}
.nid-panel-grid img{width:100%;height:auto;border-radius:8px;display:block;cursor:zoom-in}
.nid-panel-empty{padding:12px;text-align:center;font-size:12px;color:#64748b;background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-top:10px}
@media(min-width:700px){.nid-panel-grid{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
/* splash controller: min 2.6s, max 5s, tap to skip */
(function(){
  var t0=Date.now(),MIN=2600,MAX=5000,done=false,ready=false;
  function hide(){
    if(done)return;done=true;
    var el=document.getElementById('sa-splash');if(!el)return;
    el.classList.add('hide');
    setTimeout(function(){
      try{el.remove()}catch(e){}
      var ls=document.getElementById('login-screen');
      if(ls&&ls.classList.contains('active')){var u=document.getElementById('login-userid');if(u)u.focus()}
    },600);
  }
  function tryHide(){if(ready&&Date.now()-t0>=MIN)hide();else if(!done)setTimeout(tryHide,100)}
  window.addEventListener('DOMContentLoaded',function(){
    var img=document.getElementById('sa-splash-img'),li=document.getElementById('login-logo-img');
    if(img&&li)li.src=img.src;
  });
  window.addEventListener('load',function(){ready=true;tryHide()});
  setTimeout(function(){ready=true;hide()},MAX);
  document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('#sa-splash')&&Date.now()-t0>900)hide()});
})();
</script>

<script>
/* =========================================================
   SA TELECOM POS v26.0
   Service + Product Sale | Track System | Auto Purchase
   ========================================================= */

/* ===== DATABASE-READY DATA BRIDGE (localStorage adapter; API-ready) ===== */
window.API_CONFIG = window.API_CONFIG || {
  mode: 'local', baseURL: '', timeoutMs: 15000,
  headers: { 'Content-Type': 'application/json' },
  endpoints: { customers:'/customers', suppliers:'/suppliers', products:'/products', sales:'/sales', purchases:'/purchases', payments:'/payments' }
};
window.DataService = window.DataService || {
  config: window.API_CONFIG,
  async request(path, options={}) {
    if (this.config.mode !== 'api') throw new Error('DataService API mode is not configured');
    const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = controller ? setTimeout(()=>controller.abort(), this.config.timeoutMs || 15000) : null;
    try {
      const response = await fetch(String(this.config.baseURL||'').replace(/\/$/,'') + path, {
        ...options, signal: controller ? controller.signal : undefined,
        headers: { ...(this.config.headers||{}), ...(options.headers||{}) }
      });
      if (!response.ok) throw new Error('API request failed: '+response.status);
      if (response.status===204) return null;
      return await response.json();
    } finally { if (timer) clearTimeout(timer); }
  },
  getLocal(key, fallback=[]) { try { const v=JSON.parse(localStorage.getItem(key)); return v==null?fallback:v; } catch(_) { return fallback; } },
  setLocal(key, value) { localStorage.setItem(key, JSON.stringify(value)); return value; },
  async get(path, localKey, fallback=[]) { return this.config.mode==='api' ? this.request(path) : this.getLocal(localKey,fallback); },
  async save(path, localKey, value, method='PUT') { return this.config.mode==='api' ? this.request(path,{method,body:JSON.stringify(value)}) : this.setLocal(localKey,value); }
};
window.SA_POS_SETTINGS = window.SA_POS_SETTINGS || { allowNegativeSale: false };
try { const saved=JSON.parse(localStorage.getItem('sa_pos_settings_v1')||'{}'); window.SA_POS_SETTINGS={...window.SA_POS_SETTINGS,...saved}; } catch(_) {}
window.setAllowNegativeSale = function(enabled) {
  window.SA_POS_SETTINGS.allowNegativeSale = !!enabled;
  try { localStorage.setItem('sa_pos_settings_v1',JSON.stringify(window.SA_POS_SETTINGS)); } catch(_) {}
  if (typeof saToast==='function') saToast(enabled?'নেগেটিভ সেল চালু হয়েছে':'নেগেটিভ সেল বন্ধ হয়েছে','info');
};
window.saResolveEntity = function(list, key) {
  if (!Array.isArray(list)) return null;
  const found=list.find(x=>x && String(x.id)===String(key));
  if (found) return found;
  if (/^\d+$/.test(String(key))) return list[Number(key)] || null;
  return null;
};

/* ===== UTIL ===== */
function safeGet(k,f){try{const r=localStorage.getItem(k);if(r===null)return f;return JSON.parse(r)}catch(e){return f}}

/* ===== AUDIO (v26.0): unlock + 4 sound kinds ===== */
let posAudioContext=null,posAudioUnlocked=false,posLastSound={kind:'',t:0};
function getPOSAudioContext(){
  const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return null;
  if(!posAudioContext){try{posAudioContext=new AudioCtx()}catch(e){return null}}
  return posAudioContext;
}
function unlockPOSAudio(){
  const ctx=getPOSAudioContext();if(!ctx)return;
  try{
    if(ctx.state==='suspended')ctx.resume().then(()=>{posAudioUnlocked=true}).catch(()=>{});
    else posAudioUnlocked=true;
    /* silent 1-sample buffer: fully unlocks iOS Safari */
    const buf=ctx.createBuffer(1,1,22050),src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);src.start(0);
  }catch(e){}
}
['click','touchstart','keydown','pointerdown'].forEach(ev=>document.addEventListener(ev,unlockPOSAudio,{passive:true,capture:true}));
/* v1.0 loud audio: shared master bus (gain + compressor/limiter) so stacked tones stay loud without clipping */
function getPOSMasterBus(ctx){
  if(ctx.__posBus)return ctx.__posBus;
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-10;comp.knee.value=12;comp.ratio.value=8;comp.attack.value=.002;comp.release.value=.12;
  const master=ctx.createGain();master.gain.value=.9;
  master.connect(comp);comp.connect(ctx.destination);
  ctx.__posBus=master;return master;
}
function posTone(ctx,type,hz,at,dur,vol,hzEnd){
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  const peak=Math.max(.0002,vol||.65),atk=.012;
  osc.type=type;osc.frequency.setValueAtTime(hz,at);
  if(hzEnd)osc.frequency.exponentialRampToValueAtTime(hzEnd,at+dur);
  gain.gain.setValueAtTime(.0001,at);
  gain.gain.exponentialRampToValueAtTime(peak,at+atk); /* fast 12ms attack, no click */
  gain.gain.exponentialRampToValueAtTime(.0001,at+dur); /* smooth exponential decay */
  osc.connect(gain);gain.connect(getPOSMasterBus(ctx));
  osc.start(at);osc.stop(at+dur+.03);
}
function playPOSSound(kind='success'){
  if(safeGet('pos_sound_enabled',true)===false)return;
  const nowMs=Date.now();
  if(posLastSound.kind===kind&&nowMs-posLastSound.t<180)return; /* toast + direct call must not double-play */
  posLastSound={kind,t:nowMs};
  try{
    const ctx=getPOSAudioContext();if(!ctx)return;
    const run=()=>{
      const now=ctx.currentTime+.01;
      if(kind==='error'){
        /* heavy dual buzzer: sawtooth 330Hz + square 240Hz, two punches */
        posTone(ctx,'sawtooth',330,now,.26,.70);
        posTone(ctx,'square',240,now,.26,.75);
        posTone(ctx,'sawtooth',330,now+.30,.30,.70);
        posTone(ctx,'square',240,now+.30,.30,.75);
      }else if(kind==='warning'){
        /* crisp 2-step alert */
        posTone(ctx,'triangle',700,now,.17,.65);
        posTone(ctx,'triangle',950,now+.19,.20,.65);
      }else if(kind==='scan'){
        /* supermarket laser scan beep */
        posTone(ctx,'square',2100,now,.11,.60);
      }else{
        /* bright 3-tone retail register chime: C6, E6, G6 */
        [[1046.50,0,.65],[1318.51,.12,.68],[1567.98,.24,.70]].forEach(([hz,delay,v],i)=>posTone(ctx,'triangle',hz,now+delay,i===2?.42:.24,v));
      }
    };
    if(ctx.state==='suspended'){
      const asked=Date.now();
      ctx.resume().then(()=>{posAudioUnlocked=true;if(Date.now()-asked<1500)run()}).catch(()=>{});
    }else{posAudioUnlocked=true;run()}
  }catch(e){}
}
function testPOSSounds(){
  unlockPOSAudio();
  if(safeGet('pos_sound_enabled',true)===false){saToast('সাউন্ড বন্ধ আছে — আগে "সাউন্ড চালু" টিক দিন','info');return}
  saToast('🔊 Success → Error → Warning বাজছে...','info',2500);
  posLastSound={kind:'',t:0};playPOSSound('success');
  setTimeout(()=>{posLastSound={kind:'',t:0};playPOSSound('error')},750);
  setTimeout(()=>{posLastSound={kind:'',t:0};playPOSSound('warning')},1500);
}

async function requestPersistentStorage(){
  const status=document.getElementById('storage-persistence-status');if(status)status.textContent='Browser storage persistence status checking…';
  try{
    if(!navigator.storage){if(status)status.textContent='এই browser persistent storage API সমর্থন করে না।';return false}
    let granted=false;if(typeof navigator.storage.persist==='function')granted=await navigator.storage.persist();
    const persisted=granted||(typeof navigator.storage.persisted==='function'&&await navigator.storage.persisted());
    if(status)status.textContent=persisted?'এই browser-এর storage persistence চালু আছে। তবুও নিয়মিত Backup রাখুন।':'Browser persistence অনুমোদন করেনি বা এই origin-এ পাওয়া যায়নি—নিয়মিত Backup নিন।';
    return !!persisted;
  }catch(e){if(status)status.textContent='Persistent storage অনুরোধ করা যায়নি—নিয়মিত Backup নিন।';return false}
}
function saToast(m,t='info',d=3000){const c=document.getElementById('sa-toast-container');if(!c)return;const kind=['success','error','info','wa'].includes(t)?t:'info';if(kind==='success'||kind==='error')playPOSSound(kind);const icons={success:'fa-circle-check',error:'fa-circle-exclamation',info:'fa-circle-info',wa:'fa-brands fa-whatsapp'};const el=document.createElement('div');el.className='sa-toast '+kind;el.setAttribute('role',kind==='error'?'alert':'status');const icon=document.createElement('i');icon.className='fa-solid '+icons[kind];if(kind==='wa')icon.className=icons[kind];const text=document.createElement('span');text.textContent=String(m??'');el.append(icon,text);c.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));setTimeout(()=>{el.classList.remove('show');el.classList.add('leaving');setTimeout(()=>el.remove(),300)},2700)}
function money(v){const n=Number(v);return '৳ '+(Number.isFinite(n)?n:0).toLocaleString('en-BD',{minimumFractionDigits:2,maximumFractionDigits:2})}
function moneyToCents(v){const n=Number(v);return Number.isFinite(n)?Math.round((n+Number.EPSILON)*100):0}
function centsToMoney(v){const n=Number(v);return Number.isFinite(n)?Math.round(n)/100:0}
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function splitNames(s){return (s||'').split(',').map(x=>x.trim()).filter(Boolean)}
function localDateKey(v){const d=v instanceof Date?v:new Date(v||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function recordDateKey(r){return r.date||localDateKey(r.createdAt||Date.now())}
function dateInRange(r,f,t){const k=recordDateKey(r);return (!f||k>=f)&&(!t||k<=t)}
function getPeriodRange(p){const now=new Date();const today=localDateKey(now);if(p==='today')return{from:today,to:today};if(p==='week'){const d=new Date();d.setDate(d.getDate()-6);return{from:localDateKey(d),to:today}}if(p==='month')return{from:now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01',to:today};if(p==='year')return{from:now.getFullYear()+'-01-01',to:today};return{from:'',to:''}}
function downloadBlob(n,c,t){const b=new Blob([c],{type:t||'text/plain;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(rows,fn){if(!rows.length){saToast('No data','error');return}const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];const csv='\ufeff'+[keys.map(csvCell).join(','),...rows.map(r=>keys.map(k=>csvCell(typeof r[k]==='object'&&r[k]!==null?JSON.stringify(r[k]):r[k])).join(','))].join('\r\n');downloadBlob(fn,csv,'text/csv;charset=utf-8')}
function formatDateTime(ts,f='short'){if(!ts)return '';const d=new Date(ts);if(f==='short')return d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});return d.toLocaleString('en-GB')}
function getDateTime(){const n=new Date();return{timestamp:n.getTime(),date:localDateKey(n),time:String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0')}}
function compressImage(file,maxW=300,maxH=300,q=0.65,targetKB=150){return new Promise((res,rej)=>{if(!file){rej(new Error('no file'));return}const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{try{const limit=Math.round(targetKB*1024*1.34)+30;let scale=Math.min(1,maxW/img.width,maxH/img.height),quality=q,out='';for(let a=0;a<12;a++){const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);out=c.toDataURL('image/jpeg',quality);if(out.length<=limit)break;if(quality>0.5)quality=Math.max(0.5,quality-0.1);else scale*=0.85}res(out)}catch(err){rej(err)}};img.onerror=rej;img.src=e.target.result};r.onerror=rej;r.readAsDataURL(file)})}

const LEGACY_VARIANT_NAMES={original:'Original',copy:'Copy',old:'Old'};

function variantUsable(key){const v=variantDef(key);return !v||(v.active!==false&&!v.archived)}
function productVariantKeys(p){const v=ensureProductVariants(p);return v?Object.keys(v):[]}
function ensureProductVariants(product){
  if(!product||typeof product!=='object')return null;
  const hadVariants=product.variants&&typeof product.variants==='object'&&!Array.isArray(product.variants);
  const variants=hadVariants?product.variants:{};
  if(!Object.keys(variants).length)variants.original={};
  Object.keys(variants).forEach(key=>{
    const prior=variants[key]&&typeof variants[key]==='object'?variants[key]:{},isOrig=key==='original'&&!hadVariants;
    variants[key]={...prior,
      buyPrice:Number.isFinite(Number(prior.buyPrice))&&prior.buyPrice!==undefined?Number(prior.buyPrice):(isOrig?Number(product.buyPrice||0):0),
      salePrice:Number.isFinite(Number(prior.salePrice))&&prior.salePrice!==undefined?Number(prior.salePrice):(isOrig?Number(product.salePrice||0):0),
      stock:Number.isFinite(Number(prior.stock))&&prior.stock!==undefined?Math.max(0,Number(prior.stock)):(isOrig?Math.max(0,Number(product.stock||0)):0)};
  });

function productVariantStockTotal(product){const v=ensureProductVariants(product);return v?Object.keys(v).reduce((s,k)=>s+Math.max(0,Number(v[k]?.stock||0)),0):0}
function syncProductStockTotal(product){
  if(!product)return 0;const v=ensureProductVariants(product);if(!v)return 0;
  product.stock=Object.keys(v).reduce((s,k)=>s+Math.max(0,Number(v[k]?.stock||0)),0);

function reconcileLegacyProductStock(product,desiredStock){

  const keys=Object.keys(v),desired=Math.max(0,Number(desiredStock)||0),delta=desired-productVariantStockTotal(product);
  if(delta>0){const k=v.original?'original':keys[0];v[k].stock=Number(v[k].stock||0)+delta}
  else if(delta<0){let remove=Math.abs(delta);keys.forEach(k=>{if(remove<=0)return;const av=Number(v[k].stock||0),take=Math.min(remove,av);v[k].stock=av-take;remove-=take})}
  syncProductStockTotal(product);
}

}

function adjustSaleItemInventory(item,qty,direction=1){
  const p=productsList.find(x=>String(x.id)===String(item?.productId||''));if(!p||p.nonStock)return false;
  const amount=Math.max(0,Number(qty||0));if(!amount)return false;
  adjustProductVariantStock(p,item?.variantKey||'original',direction<0?-amount:amount);
  if(!Array.isArray(p.batches))p.batches=[];
  const allocations=Array.isArray(item.batchAllocations)&&item.batchAllocations.length?item.batchAllocations:(item.batchId?[{batchId:item.batchId,qty:amount,supplierId:item.supplierId,supplierName:item.supplierName,buyPrice:item.buyPrice,purchaseInvoiceId:item.purchaseInvoiceId}]:[]);
  let left=amount;
  allocations.forEach(allocation=>{
    if(left<=0)return;
    const available=Number(allocation.qty||left),portion=Math.min(left,available);
    let batch=p.batches.find(b=>String(b.batchId)===String(allocation.batchId||''));
    if(!batch&&direction>0&&allocation.batchId){
      batch={batchId:allocation.batchId,supplierId:allocation.supplierId||item.supplierId||null,supplierName:allocation.supplierName||item.supplierName||'Unknown Supplier',buyPrice:Number(allocation.buyPrice??item.buyPrice??p.buyPrice??0),qty:0,remainingQty:0,date:localDateKey(new Date()),purchaseInvoiceId:allocation.purchaseInvoiceId||item.purchaseInvoiceId||null,createdAt:Date.now(),isRestored:true};
      p.batches.push(batch);
    }
    if(batch){
      if(direction>0)batch.remainingQty=Number(batch.remainingQty||0)+portion;
      else batch.remainingQty=Math.max(0,Number(batch.remainingQty||0)-portion);
    }
    left-=portion;
  });
  p.updatedAt=Date.now();
  return true;
}

/* ===== MIGRATION v21.2 → v22.0 ===== */
function migrateV211ToV220(){
  let needSave=false;
  const hasMobileProducts=productsList.some(p=>!p.categoryId&&p.type==='mobile');
  const hasRegularProducts=productsList.some(p=>!p.categoryId&&(p.type==='regular'||!p.type));
  let mobileCat=categories.find(c=>c.name==='Mobile'&&!c.parentId);
  if(hasMobileProducts&&!mobileCat){
    mobileCat={id:'cat_mobile',name:'Mobile',parentId:null,emoji:'📱',formType:'mobile',fields:[
      {id:'f_mobile_imei',name:'IMEI',type:'text',required:true,isSerial:true,showInList:true,options:[]},
      {id:'f_mobile_model',name:'Model Number',type:'text',required:false,isSerial:false,showInList:true,options:[]}
    ],createdAt:Date.now()};
    categories.push(mobileCat);needSave=true;
  }
  let regCat=categories.find(c=>(c.name==='Accessories'||c.name==='Regular')&&!c.parentId);
  if(hasRegularProducts&&!regCat){
    regCat={id:'cat_regular',name:'Accessories',parentId:null,emoji:'📦',formType:'regular',fields:[{id:'f_reg_stock',name:'Stock',type:'number',required:false,isSerial:false,showInList:true,options:[]}],createdAt:Date.now()};
    categories.push(regCat);needSave=true;
  }
  ensureAutoSubs();
  productsList.forEach(p=>{
    if(!p.customFields)p.customFields={};
    const savedCat=categories.find(c=>c.id===p.categoryId);
    if(savedCat?.parentId){if(!p.subCategoryId)p.subCategoryId=savedCat.id;p.categoryId=savedCat.parentId;needSave=true}
    else if(p.subCategoryId){const savedSub=categories.find(c=>c.id===p.subCategoryId);if(!savedSub||savedSub.parentId!==p.categoryId){p.subCategoryId=null;needSave=true}}
    if(!p.categoryId){
      if(p.type==='mobile'&&mobileCat){p.categoryId=mobileCat.id;if(p.imei)p.customFields['f_mobile_imei']=p.imei;if(p.modelNumber)p.customFields['f_mobile_model']=p.modelNumber}
      else if(regCat){p.categoryId=regCat.id}
    }
    if(!p.subCategoryId)p.subCategoryId=null;
    if(!Array.isArray(p.batches))p.batches=[];
    p.batches.forEach(b=>{
      if(!b.batchId)b.batchId='bat_'+uid();
      if(!b.supplierId)b.supplierId=null;
      if(!b.supplierName)b.supplierName='Unknown Supplier';
      if(b.buyPrice===undefined)b.buyPrice=Number(p.buyPrice||0);
      if(b.qty===undefined)b.qty=0;
      if(b.remainingQty===undefined)b.remainingQty=Number(b.qty||0);
      if(!b.date)b.date=localDateKey(b.createdAt||Date.now());
      if(!b.purchaseInvoiceId)b.purchaseInvoiceId=null;
      if(!b.createdAt)b.createdAt=Date.now();
      if(b.isAuto===undefined)b.isAuto=false;
    });
    if(!p.autoCode)p.autoCode=gen7DigitCodeLocal();
  });
  productsList.forEach(p=>{const cat=categories.find(c=>c.id===p.categoryId);if(cat)p.type=cat.formType==='mobile'?'mobile':'regular'});
  
  salesRecords.forEach(r=>{
    if(!r.status)r.status='inwork';
    if(r.carigorId===undefined)r.carigorId=null;
    if(r.carigorCost===undefined)r.carigorCost=0;
    if(r.carigorName===undefined)r.carigorName=null;
    if(!Array.isArray(r.autoPurchases))r.autoPurchases=[];
    if(r.moneyPosted===undefined)r.moneyPosted=(r.status==='delivered');
    (r.items||[]).forEach(it=>{
      if(it.supplierId===undefined)it.supplierId=null;
      if(it.supplierName===undefined)it.supplierName='';
      if(it.batchId===undefined)it.batchId=null;
      if(it.isService===undefined)it.isService=false;
      if(it.carigorId===undefined)it.carigorId=null;
      if(it.carigorCost===undefined)it.carigorCost=0;
      if(it.carigorName===undefined)it.carigorName=null;
    });
  });
  
  /* v26.0: every variant of every old product gets its own QR code (barcode/autoCode/freeCode untouched) */
  {const usedQr=collectVariantQrCodes();productsList.forEach(p=>{if(ensureProductVariantQrCodes(p,usedQr))needSave=true})}
  
  try{localStorage.removeItem('pos_product_types')}catch(e){}
  if(needSave){saveCats()}
  saveProducts();
  saveSalesRecords();
}

function canAccessPage(p){if(!currentUser)return false;if(currentUser.role==='owner')return true;if(p==='staff')return (currentUser.permissions?.pages||[]).includes('staff')&&!!currentUser.permissions?.canManageSalary;return (currentUser.permissions?.pages||[]).includes(p)}
function hasPerm(p){if(!currentUser)return false;if(currentUser.role==='owner')return true;return !!currentUser.permissions?.[p]}
function getMaxDiscount(){if(!currentUser)return 0;if(currentUser.role==='owner')return 100;const raw=currentUser.permissions?.maxDiscountPercent;if(raw===undefined||raw===null){if(currentUser.role==='manager')return 20;if(currentUser.role==='staff')return 5;return 0}const n=Number(raw);if(!Number.isFinite(n)||n<0)return 0;return Math.min(100,n)}
function requirePermission(p,m){if(hasPerm(p))return true;showPermissionDenied(m||'অনুমতি নেই।');return false}

/* ===== AUTH ===== */
function doLogin(){
  const userId=(document.getElementById('login-userid')?.value||'').trim().toLowerCase();
  const password=(document.getElementById('login-password')?.value||'').trim();
  const err=document.getElementById('login-error');err.classList.remove('show');
  if(!userId||!password){err.innerText='User ID এবং Password দিন';err.classList.add('show');playPOSSound('error');return}
  const user=users.find(u=>String(u.id).toLowerCase()===userId);
  if(!user||String(user.password)!==password){err.innerText='ভুল User ID অথবা Password';err.classList.add('show');playPOSSound('error');return}
  if(user.active===false){err.innerText='এই অ্যাকাউন্ট ব্লক/নিষ্ক্রিয়';err.classList.add('show');playPOSSound('error');return}
  currentUser={...user};
  const idx=users.findIndex(u=>u.id===user.id);
  if(idx>=0){users[idx].lastLogin=Date.now();saveUsers()}
  safeSet('pos_current_session',{userId:user.id,loginAt:Date.now()});
  logAction('login',`${user.name} logged in`);
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('login-password').value='';
  renderShell();switchTab('dashboard');
  saToast('✅ স্বাগতম, '+user.name,'success');
}
function logout(){
  if(currentUser&&!confirm('Logout করতে চান?'))return;
  logAction('logout',`${currentUser?.name||'User'} logged out`);
  currentUser=null;safeSet('pos_current_session',null);
  hideAllModals();closeSidebar();
  document.getElementById('app-sidebar').innerHTML='';
  document.getElementById('app-views').innerHTML='';
  document.getElementById('dynamic-modals').innerHTML='';
  document.getElementById('login-screen').classList.add('active');
  document.getElementById('login-userid').value='';
  document.getElementById('login-password').value='';
}
function forceLogout(message='এই অ্যাকাউন্ট ব্লক করা হয়েছে। আবার লগইন করতে পারবেন না।'){
  currentUser=null;safeSet('pos_current_session',null);hideAllModals();closeSidebar();
  const sidebar=document.getElementById('app-sidebar'),views=document.getElementById('app-views'),modals=document.getElementById('dynamic-modals');
  if(sidebar)sidebar.innerHTML='';if(views)views.innerHTML='';if(modals)modals.innerHTML='';
  document.getElementById('login-screen')?.classList.add('active');
  const id=document.getElementById('login-userid'),pass=document.getElementById('login-password');
  if(id)id.value='';if(pass)pass.value='';
  const error=document.getElementById('login-error');if(error){error.textContent=message;error.classList.add('show')}
  playPOSSound('error');
}
function requireActiveSession(){
  if(!currentUser)return false;
  const saved=safeGet('pos_users',null),source=Array.isArray(saved)?saved:users,latest=source.find(u=>String(u.id||'').trim().toLowerCase()===String(currentUser.id||'').trim().toLowerCase());
  if(!latest||latest.active===false){if(Array.isArray(saved))users=saved;forceLogout();return false}
  users=source;currentUser={...latest};return true;
}
function tryAutoLogin(){
  const saved=safeGet('pos_users',null);if(Array.isArray(saved))users=saved;
  const session=safeGet('pos_current_session',null);
  if(session&&session.userId){
    const user=users.find(u=>String(u.id||'').trim().toLowerCase()===String(session.userId).trim().toLowerCase());
    if(user&&user.active!==false){currentUser={...user};document.getElementById('login-screen').classList.remove('active');renderShell();switchTab('dashboard');return true}
  }
  safeSet('pos_current_session',null);
  return false;
}

function saveChangePassword(){
  const o=document.getElementById('chg-old-pass').value;
  const n1=document.getElementById('chg-new-pass').value;
  const n2=document.getElementById('chg-new-pass2').value;
  if(!o||!n1||!n2){saToast('সবগুলো পূরণ করুন','error');return}
  if(o!==currentUser.password){saToast('পুরাতন পাসওয়ার্ড ভুল','error');return}
  if(n1.length<4){saToast('কমপক্ষে ৪ ডিজিট','error');return}
  if(n1!==n2){saToast('পাসওয়ার্ড মেলেনি','error');return}
  const idx=users.findIndex(u=>u.id===currentUser.id);
  if(idx>=0){users[idx].password=n1;currentUser.password=n1;saveUsers()}
  hideModal('change-pass-modal');saToast('✅ পাসওয়ার্ড সফলভাবে পরিবর্তিত','success');
}

function renderShell(){renderSidebar();renderAllViews();renderStaffList();setTimeout(()=>{try{checkDraftCart('sale')}catch(e){}},400)}
function renderSidebar(){
  const sb=document.getElementById('app-sidebar');if(!sb)return;
  const sec={};
  ALL_PAGES.forEach(p=>{if(!sec[p.section])sec[p.section]=[];sec[p.section].push(p)});
  let html=`<button class="side-close" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>`;
  Object.entries(sec).forEach(([s,ps])=>{
    html+=`<div class="side-section">${s}</div>`;
    ps.forEach(p=>{
      const a=canAccessPage(p.id);
      const lc=a?'':'locked';
      const oc=a?`switchTab('${p.id}');closeSidebar();`:`showPermissionDenied('অনুমতি নেই')`;
      html+=`<div class="side-item ${lc}" data-tab="${p.id}" onclick="${oc}"><i class="fa-solid ${p.icon}"></i> ${esc(p.label)}</div>`;
    });
    if(s==='ওনার ও প্রশাসন'){
      html+=`<div class="side-item" onclick="closeSidebar();openChangePassword()"><i class="fa-solid fa-key"></i> Password</div>`;
      html+=`<div class="side-item" onclick="closeSidebar();logout()" style="border-left-color:#e53935;"><i class="fa-solid fa-right-from-bracket" style="color:#ff6b6b;"></i> Logout</div>`;
    }
  });
  sb.innerHTML=html;
}

/* ===== TAB ===== */
let currentTab='dashboard',prevTab='dashboard';
let navStack=[],__navGoingBack=false;
function navVisit(t){
  if(__navGoingBack){currentTab=t;navUpdateBackBtn();return}
  if(currentTab===t){navUpdateBackBtn();return}
  if(navStack.length&&navStack[navStack.length-1]===t){navStack.pop()}
  else{navStack.push(currentTab);if(navStack.length>30)navStack.shift()}
  prevTab=currentTab;currentTab=t;
  navUpdateBackBtn();
  try{history.pushState({sa:1},'')}catch(e){}
}
function navUpdateBackBtn(){
  const b=document.querySelector('.header .left-section .fa-angle-left');
  if(b)b.style.visibility=(currentTab==='dashboard'&&!navStack.length)?'hidden':'visible';
}

function getTrackStatusBadge(st){
  const s=String(st||'inwork').toLowerCase();
  if(s==='inwork')return '<span class="status-badge inwork">🟡 In Work</span>';
  if(s==='outwork')return '<span class="status-badge outwork">🔵 Out Work</span>';
  if(s==='successful'||s==='success')return '<span class="status-badge successful">🟣 Success</span>';
  if(s==='unsuccessful'||s==='unsuccess')return '<span class="status-badge unsuccessful">🔴 Unsuccess</span>';
  if(s==='delivered')return '<span class="status-badge delivered">🟢 Delivered</span>';
  return `<span class="status-badge inwork">${esc(s)}</span>`;
}

function isStatusTransitionAllowed(from,to){
  from=String(from||'inwork').toLowerCase();
  to=String(to||'').toLowerCase();
  if(from==='success')from='successful';
  if(from==='unsuccess')from='unsuccessful';
  if(to==='success')to='successful';
  if(to==='unsuccess')to='unsuccessful';
  if(from===to)return true;
  const rules={
    'inwork':['inwork','outwork','successful','unsuccessful'],
    'outwork':['outwork','inwork','successful','unsuccessful'],
    'successful':['successful','delivered'],
    'unsuccessful':['unsuccessful','delivered'],
    'delivered':['delivered']
  };
  return (rules[from]||[]).includes(to);
}

function getAvailableTransitions(current){
  current=String(current||'inwork').toLowerCase();
  if(current==='success')current='successful';
  if(current==='unsuccess')current='unsuccessful';
  const all=['inwork','outwork','successful','unsuccessful','delivered'];
  return all.filter(s=>isStatusTransitionAllowed(current,s));
}

function getSubTypeBadge(st){if(!st)return '';if(st==='original')return '<span class="sub-type-badge original">🟢 Original</span>';if(st==='copy')return '<span class="sub-type-badge copy">🟡 Copy</span>';if(st==='old')return '<span class="sub-type-badge old">🔴 Old</span>';return ''}

function getFormTypeByCategoryId(categoryId){
  const category=categories.find(c=>c.id===categoryId);
  if(!category)return 'regular';
  if(category.formType)return category.formType;
  const parent=category.parentId?categories.find(c=>c.id===category.parentId):null;
  return parent?.formType||'regular';
}

function getMergedFields(categoryId,subCategoryId){
  const selected=categories.find(c=>c.id===categoryId);
  if(!selected)return{parent:null,category:null,fields:[]};
  const root=selected.parentId?categories.find(c=>c.id===selected.parentId):selected;
  const sub=selected.parentId?selected:(subCategoryId?categories.find(c=>c.id===subCategoryId&&c.parentId===selected.id):null);
  return{parent:sub?root:null,category:sub||root,fields:[...(root?.fields||[]),...(sub&&sub.id!==root?.id?(sub.fields||[]):[])]};
}

function getProductSerialInfo(product){
  const fields=getMergedFields(product?.categoryId,product?.subCategoryId).fields;
  const field=fields.find(f=>f.isSerial);
  const stored=product?.customFields||{};
  const value=field?(stored[field.id]??product?.imei??''):'';
  const serial=String(value??'').trim();
  return{hasField:!!field,hasValue:!!field&&serial!=='',value:serial,fieldName:field?.name||'Serial'};
}

function recordCarigorLedgerEvent(artisan,type,amount,note='',saleId=null,datetime=null){
  if(!artisan)return null;
  if(!Array.isArray(artisan.ledger))artisan.ledger=[];
  const dt=datetime||getDateTime(),value=centsToMoney(moneyToCents(amount));
  const entry={id:'cl_'+uid(),type,amount:value,note:String(note||''),date:dt.date,time:dt.time,createdAt:dt.timestamp};
  if(saleId!==null)entry.saleId=String(saleId);
  artisan.ledger.push(entry);
  return entry;
}

function saveStatusChange(saleId){
  const r=salesRecords.find(x=>String(x.id)===String(saleId));if(!r)return;
  const newSt=document.getElementById('modal-status-select').value;
  const oldSt=r.status;
  if(!isStatusTransitionAllowed(oldSt,newSt)){
    saToast('❌ এই স্ট্যাটাস পরিবর্তনটি অনুমোদিত নয়!','error',3000);
    return;
  }
  
  if(newSt==='outwork'){
    const cid=document.getElementById('modal-carigor-select')?.value||null;
    const rawCost=Number(document.getElementById('modal-carigor-cost')?.value||0);
    const problemNote=(document.getElementById('modal-outwork-note')?.value||'').trim();
    if(!Number.isFinite(rawCost)||rawCost<0){saToast('সঠিক মজুরি দিন','error');return}
    const cost=centsToMoney(moneyToCents(rawCost));
    if(!cid||cid==='__NEW__'){saToast('⚠️ কারিগর নির্বাচন করা বাধ্যতামূলক','error',3000);return}
    if(!problemNote){saToast('সমস্যার নোট লিখুন','error',3000);document.getElementById('modal-outwork-note')?.focus();return}
    const carigor=carigors.find(c=>c.id===cid);
    if(!carigor){saToast('কারিগর পাওয়া যায়নি','error');return}
    const oldCarigor=r.carigorId?carigors.find(c=>String(c.id)===String(r.carigorId)):null;
    const oldBookedCents=moneyToCents(r.carigorBookedCost??(r.carigorId?Number(r.carigorCost||0):0));
    const nextCents=moneyToCents(cost);
    const dt=getDateTime();
    if(oldCarigor&&oldCarigor.id!==carigor.id&&oldBookedCents>0){
      const reversal=-Math.min(Math.max(0,moneyToCents(oldCarigor.balance||0)),oldBookedCents);
      if(reversal){oldCarigor.balance=centsToMoney(moneyToCents(oldCarigor.balance||0)+reversal);recordCarigorLedgerEvent(oldCarigor,'adjustment',reversal/100,'Job reassigned: '+String(r.id).slice(-6),r.id,dt)}
    }else if(oldCarigor&&oldCarigor.id===carigor.id){
      const delta=nextCents-oldBookedCents;
      const applied=delta<0?-Math.min(Math.max(0,moneyToCents(carigor.balance||0)),-delta):delta;
      if(applied){carigor.balance=centsToMoney(moneyToCents(carigor.balance||0)+applied);recordCarigorLedgerEvent(carigor,applied>0?'job':'adjustment',applied/100,'Job wage adjustment: '+String(r.id).slice(-6),r.id,dt)}
    }
    if(!oldCarigor||oldCarigor.id!==carigor.id){
      if(nextCents){carigor.balance=centsToMoney(moneyToCents(carigor.balance||0)+nextCents);recordCarigorLedgerEvent(carigor,'job',nextCents/100,'Job: '+String(r.id).slice(-6),r.id,dt)}
    }
    r.carigorId=carigor.id;
    r.carigorName=carigor.name;
    r.carigorCost=cost;
    r.carigorBookedCost=cost;
    r.carigorNote=problemNote;
    saveCarigors();
  }
  
  if(newSt==='delivered'){
    const isSuccess=(oldSt==='successful'||oldSt==='success');
    hideModal('status-change-modal');
    if(isSuccess){
      openDeliveredPaymentModal(saleId);
      return;
    }else{
      openUnsuccessfulDeliveredModal(saleId);
      return;
    }
  }
  
  r.status=newSt;
  r.statusUpdatedAt=Date.now();
  saveSalesRecords();
  logAction('sale_status_change','#'+String(r.id).slice(-6)+': '+oldSt+'→'+newSt,r.id);
  hideModal('status-change-modal');
  renderSaleTrackList();renderSalesList();updateDashboard();
  saToast('✅ স্ট্যাটাস আপডেট: '+newSt,'success');
}

function onDeliveryPaymentMethodChange(){
  const m=document.getElementById('delivery-payment-method')?.value||'Cash';
  const p=document.getElementById('delivery-account-picker');
  const cb=document.getElementById('delivery-change-box');
  if(['Cash','bKash','Nagad','Bank'].includes(m)){
    if(p)p.style.display='block';
    const s=document.getElementById('delivery-target-account');
    if(s){
      let pr=null;
      if(m==='Cash')pr=accounts.find(a=>a.type==='cash');
      if(m==='bKash')pr=accounts.find(a=>a.type==='bkash');
      if(m==='Nagad')pr=accounts.find(a=>a.type==='nagad');
      if(m==='Bank')pr=accounts.find(a=>a.type==='bank');
      if(pr)s.value=pr.id;
    }
    if(cb)cb.style.display=(m==='Cash')?'block':'none';
  }else{
    if(p)p.style.display='none';
    if(cb)cb.style.display='none';
  }
  calcDeliveryChange();
}

function calcDeliveryChange(){
  const m=document.getElementById('delivery-payment-method')?.value||'Cash';
  if(m!=='Cash')return;
  const r=salesRecords.find(x=>String(x.id)===String(window.__deliverySaleId));
  if(!r)return;
  const total=Number(r.total||r.amount||0);
  const given=Number(document.getElementById('delivery-given-amount')?.value||0);
  const change=Math.max(0,given-total);
  const el=document.getElementById('delivery-change-val');
  if(el)el.innerText=money(change);
}

function confirmDeliveredPayment(saleId){
  const r=salesRecords.find(x=>String(x.id)===String(saleId));if(!r)return;
  const method=document.getElementById('delivery-payment-method')?.value||'Cash';
  const total=Number(r.total||r.amount||0);
  
  if(method==='Mix'){
    hideModal('delivered-payment-modal');
    window.__mixFinalizeCallback=(payments,dueAmt)=>{
      finalizeDeliveredSale(saleId,'Mix',payments,dueAmt);
    };
    openMixForDelivery(total,saleId);
    return;
  }
  
  if(method==='Due'){
    const isWalkIn=!r.customerId||String(r.customerName||'').toLowerCase()==='walk-in customer';
    if(isWalkIn){saToast('⚠️ Walk-in কাস্টমারকে বাকি দেওয়া যাবে না। কাস্টমার তৈরি করুন।','error',3500);return}
    finalizeDeliveredSale(saleId,'Due',[],total);
    return;
  }
  
  const aid=document.getElementById('delivery-target-account')?.value;
  const acc=accounts.find(a=>a.id===aid);
  if(!acc){saToast('একাউন্ট নির্বাচন করুন','error');return}
  acc.balance=Number(acc.balance||0)+total;
  saveAccounts();
  const given=Number(document.getElementById('delivery-given-amount')?.value||total);
  const change=Math.max(0,given-total);
  r.givenAmount=given;r.changeAmount=change;
  logMoneyTx({type:'in',amount:total,accountId:aid,note:'Delivered Sale #'+String(saleId).slice(-6),ref:saleId});
  finalizeDeliveredSale(saleId,method,[{accountId:aid,amount:total,accountName:acc.name,accountType:acc.type}],0);
}

function adjustDeliveredCustomerDue(r,newDue){
  if(!r)return;
  const oldMethod=String(r.paymentMethod||'').toLowerCase();
  const oldDue=(!r.moneyPosted&&oldMethod==='due')?Number(r.dueAmount||r.total||r.amount||0):0;
  const delta=Number(newDue||0)-oldDue;
  if(Math.abs(delta)<0.01)return;
  const customer=customers.find(c=>c.id===r.customerId);
  if(customer){customer.balance=Math.max(0,Number(customer.balance||0)+delta);saveCustomers();return}
  const wholesaler=wholesalers.find(w=>w.id===r.wholesalerId);
  if(wholesaler){wholesaler.balance=Math.max(0,Number(wholesaler.balance||0)+delta);saveWholesalers()}
}

function finalizeDeliveredSale(saleId,method,payments,dueAmt){
  const r=salesRecords.find(x=>String(x.id)===String(saleId));if(!r)return;
  adjustDeliveredCustomerDue(r,dueAmt);
  r.status='delivered';
  r.statusUpdatedAt=Date.now();
  r.moneyPosted=true;
  r.deliveryPaymentMethod=method;
  r.deliveryPayments=payments||[];
  r.deliveryDueAmount=Number(dueAmt||0);
  r.paymentMethod=method;
  r.dueAmount=Number(dueAmt||0);
  saveSalesRecords();
  hideModal('delivered-payment-modal');
  hideModal('split-payment-modal');
  renderSaleTrackList();renderSalesList();updateDashboard();updateHeaderCash();
  logAction('sale_delivered','#'+String(saleId).slice(-6)+' — '+money(Number(r.total||r.amount))+' via '+method,saleId);
  saToast('✅ Delivered — টাকা একাউন্টে যোগ হয়েছে: '+money(Number(r.total||r.amount)-Number(dueAmt||0)),'success',4000);
}

function confirmMixForDelivery(saleId){
  const total=Number(window.__splitTotal||0);
  const vals=getMixCurrentValues();
  const sum=vals.paid+vals.due;
  if(Math.abs(sum-total)>0.01){saToast('⚠️ Paid + Due মোট বিলের সমান হতে হবে','error',3500);return}
  const r=salesRecords.find(x=>String(x.id)===String(saleId));if(!r)return;
  
  const dueAmt=vals.due;
  if(dueAmt>0){const isWalkIn=!r.customerId||String(r.customerName||'').toLowerCase()==='walk-in customer';if(isWalkIn){saToast('Walk-in কাস্টমারকে বাকি দেওয়া যাবে না','error');return}}
  
  const payments=[];
  const cashAcc=accounts.find(a=>a.type==='cash')||accounts[0];
  const bkashAcc=accounts.find(a=>a.type==='bkash');
  const nagadAcc=accounts.find(a=>a.type==='nagad');
  const cashApplied=vals.cashApplied;
  if(cashApplied>0&&cashAcc){cashAcc.balance=Number(cashAcc.balance||0)+cashApplied;saveAccounts();payments.push({accountId:cashAcc.id,amount:cashApplied,accountName:cashAcc.name,accountType:'cash'});logMoneyTx({type:'in',amount:cashApplied,accountId:cashAcc.id,note:'Delivered Mix #'+String(saleId).slice(-6),ref:saleId})}
  if(vals.bkash>0&&bkashAcc){bkashAcc.balance=Number(bkashAcc.balance||0)+vals.bkash;saveAccounts();payments.push({accountId:bkashAcc.id,amount:vals.bkash,accountName:bkashAcc.name,accountType:'bkash'});logMoneyTx({type:'in',amount:vals.bkash,accountId:bkashAcc.id,note:'Delivered Mix #'+String(saleId).slice(-6),ref:saleId})}
  if(vals.nagad>0&&nagadAcc){nagadAcc.balance=Number(nagadAcc.balance||0)+vals.nagad;saveAccounts();payments.push({accountId:nagadAcc.id,amount:vals.nagad,accountName:nagadAcc.name,accountType:'nagad'});logMoneyTx({type:'in',amount:vals.nagad,accountId:nagadAcc.id,note:'Delivered Mix #'+String(saleId).slice(-6),ref:saleId})}
  accounts.forEach(a=>{
    if(a.id===cashAcc?.id||a.id===bkashAcc?.id||a.id===nagadAcc?.id)return;
    const el=document.getElementById('mix-acc-'+a.id);
    const v=Number(el?.value||0);
    if(v>0){a.balance=Number(a.balance||0)+v;saveAccounts();payments.push({accountId:a.id,amount:v,accountName:a.name,accountType:a.type});logMoneyTx({type:'in',amount:v,accountId:a.id,note:'Delivered Mix #'+String(saleId).slice(-6),ref:saleId})}
  });
  saveAccounts();
  r.givenAmount=vals.cashReceived;
  r.changeAmount=vals.change;
  finalizeDeliveredSale(saleId,'Mix',payments,dueAmt);
}

function saveCarigorPayment(){
  const idx=window.__activeCarigorIndex;const c=carigors[idx];if(!c)return;
  let amt=Number(document.getElementById('cg-pay-amount')?.value||0);

  if(!Number.isFinite(amt)||amtCents<=0){saToast('সঠিক পরিমাণ দিন','error');return}
  if(amtCents>dueCents){saToast('বকেয়ার চেয়ে বেশি মজুরি পরিশোধ করা যাবে না: '+money(dueCents/100),'error');return}
  const acc=accounts.find(a=>a.id===aid);if(!acc){saToast('একাউন্ট পাওয়া যায়নি','error');return}

  amt=amtCents/100;

  c.balance=centsToMoney(dueCents-amtCents);
  const dt=getDateTime();

  recordCarigorLedgerEvent(c,'payment',amt,note||'Paid via '+acc.name,paymentId,dt);
  expenseRecords.unshift({id:'exp_'+uid(),title:'কারিগর মজুরি — '+c.name,amount:amt,category:'Carigor Fee',date:dt.date,time:dt.time,accountId:aid,createdAt:dt.timestamp,createdBy:currentUser?.id||'system',source:'carigor_payment',sourceRef:paymentId});
  saveExpenseRecords();
  saveAccounts();saveCarigors();
  logMoneyTx({type:'out',amount:amt,accountId:aid,note:'Carigor: '+c.name,ref:paymentId});
  logAction('carigor_payment',money(amt)+' to '+c.name);
  hideModal('carigor-payment-modal');renderCarigorList();renderExpenseList('month');updateDashboard();updateHeaderCash();
  saToast('✅ মজুরি পরিশোধ সম্পন্ন','success');
}

function getCarigorLedgerData(artisan){
  const source=Array.isArray(artisan.ledger)?artisan.ledger:[];
  const events=source.map((l,i)=>{
    const type=String(l.type||'').toLowerCase(),amountCents=moneyToCents(l.amount||0);
    if(!['opening','job','payment','adjustment'].includes(type)||!amountCents)return null;
    return{id:String(l.id||'ledger_'+i),type,amountCents,note:String(l.note||''),date:String(l.date||''),time:String(l.time||''),createdAt:Number(l.createdAt||0),saleId:l.saleId?String(l.saleId):null,legacy:false};
  }).filter(Boolean);
  const legacyJobs=events.filter(e=>e.type==='job'&&!e.saleId),matchedLegacy=new Set();
  const saleJobs=salesRecords.filter(r=>String(r.carigorId||'')===String(artisan.id)&&moneyToCents(r.carigorCost||0)>0);
  saleJobs.forEach(r=>{
    if(events.some(e=>e.saleId===String(r.id)))return;
    const match=legacyJobs.find(e=>!matchedLegacy.has(e.id)&&e.date===String(r.date||''));
    if(match)matchedLegacy.add(match.id);
    events.push({id:'sale_'+r.id,type:'job',amountCents:moneyToCents(r.carigorCost),note:'Job: '+String(r.id).slice(-6)+' • '+String(r.productName||r.items?.map(x=>x.name).join(', ')||''),date:String(r.date||''),time:String(r.time||''),createdAt:Number(r.createdAt||0),saleId:String(r.id),legacy:true});
  });
  const openingRows=events.filter(e=>e.type==='opening');
  const movementRows=events.filter(e=>e.type!=='opening'&&!matchedLegacy.has(e.id));
  const signedCents=e=>e.type==='payment'?-e.amountCents:e.amountCents;
  const currentCents=moneyToCents(artisan.balance||0);
  let openingCents;
  if(openingRows.length)openingCents=moneyToCents(artisan.openingBalance??openingRows.reduce((s,e)=>s+e.amountCents,0));
  else if(artisan.openingBalance!==undefined&&artisan.openingBalance!==null)openingCents=moneyToCents(artisan.openingBalance);
  else openingCents=currentCents-movementRows.reduce((s,e)=>s+signedCents(e),0);
  const earliest=[...movementRows].sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt)[0];
  const openingDate=openingRows[0]?.date||String(artisan.createdAt?localDateKey(Number(artisan.createdAt)):earliest?.date||localDateKey(new Date()));
  const openingTime=openingRows[0]?.time||'00:00:00';
  const openEvent={id:'opening_'+artisan.id,type:'opening',amountCents:openingCents,note:openingRows[0]?.note||(artisan.openingBalance===undefined?'Legacy opening / balance reconciliation':'Opening due'),date:openingDate,time:openingTime,createdAt:openingRows[0]?.createdAt||Number(artisan.createdAt||0),saleId:null};
  const chronological=[openEvent,...movementRows].sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)||a.createdAt-b.createdAt||(a.type==='opening'&&b.type!=='opening'?-1:b.type==='opening'&&a.type!=='opening'?1:0));
  let running=0;const dailyMap={};
  chronological.forEach(e=>{
    const debit=Math.max(0,e.type==='payment'?0:e.amountCents),credit=Math.max(0,e.type==='payment'?e.amountCents:-e.amountCents);
    if(!dailyMap[e.date])dailyMap[e.date]={date:e.date,openingCents:running,debitCents:0,creditCents:0,closingCents:running};
    running+=debit-credit;e.debitCents=debit;e.creditCents=credit;e.balanceCents=running;
    dailyMap[e.date].debitCents+=debit;dailyMap[e.date].creditCents+=credit;dailyMap[e.date].closingCents=running;
  });
  return{events:chronological,daily:Object.values(dailyMap),currentCents,reconciledCents:running};
}

}

/* ===== SUPPLIER OPTIONS & SMART PRICE FIX ===== */
function getSupplierLastBuyPrice(supplierId,productId){
  if(!supplierId||!productId)return null;
  let last=null;
  for(const r of purchaseRecords){
    if(r.supplierId!==supplierId)continue;
    for(const it of (r.items||[])){
      if(it.productId===productId){
        if(!last||Number(r.createdAt||0)>=Number(last.createdAt||0)){
          last={price:Number(it.buyPrice||it.rate||0),date:r.date,createdAt:r.createdAt||0,purchaseId:r.id,isAuto:r.isAuto};
        }
      }
    }
  }
  const p=productsList.find(x=>x.id===productId);
  if(p&&Array.isArray(p.batches)){
    p.batches.forEach(b=>{
      if(b.supplierId===supplierId){
        if(!last||Number(b.createdAt||0)>=Number(last.createdAt||0)){
          last={price:Number(b.buyPrice||0),date:b.date,createdAt:b.createdAt||0,fromBatch:true};
        }
      }
    });
  }
  return last;
}

function getSupplierAvailableBatches(supplierId,productId){
  const p=productsList.find(x=>x.id===productId);
  if(!p||!Array.isArray(p.batches))return[];
  return p.batches.filter(b=>b.supplierId===supplierId&&Number(b.remainingQty)>0).sort((a,b)=>Number(a.createdAt||0)-Number(b.createdAt||0));
}

function getSupplierStockForProduct(supplierId,productId){
  const p=productsList.find(x=>x.id===productId);
  if(!p||!Array.isArray(p.batches))return 0;
  return p.batches.filter(b=>b.supplierId===supplierId).reduce((s,b)=>s+Number(b.remainingQty||0),0);
}

function getProductSupplierOptions(productId){
  const p=productsList.find(x=>x.id===productId);
  const options=[];
  const seen=new Set();
  
  if(p&&Array.isArray(p.batches)){
    p.batches.filter(b=>Number(b.remainingQty)>0).forEach(b=>{
      if(b.supplierId&&!seen.has(b.supplierId)){
        seen.add(b.supplierId);
        const s=suppliers.find(x=>x.id===b.supplierId);
        if(s)options.push({id:s.id,name:s.name,stock:getSupplierStockForProduct(s.id,productId),hasStock:true,lastPrice:getSupplierLastBuyPrice(s.id,productId)});
      }
    });
  }
  purchaseRecords.forEach(r=>{
    if(!r.supplierId||seen.has(r.supplierId))return;
    if((r.items||[]).some(it=>it.productId===productId)){
      seen.add(r.supplierId);
      const s=suppliers.find(x=>x.id===r.supplierId);
      if(s)options.push({id:s.id,name:s.name,stock:getSupplierStockForProduct(s.id,productId),hasStock:false,lastPrice:getSupplierLastBuyPrice(s.id,productId)});
    }
  });
  suppliers.forEach(s=>{
    if(!seen.has(s.id)){
      seen.add(s.id);
      options.push({id:s.id,name:s.name,stock:getSupplierStockForProduct(s.id,productId),hasStock:false,lastPrice:getSupplierLastBuyPrice(s.id,productId)});
    }
  });
  return options;
}

function saCartTotals(cart,isSale){
  const safeCart=Array.isArray(cart)?cart:[];
  const subtotal=safeCart.reduce((sum,item)=>{
    const qty=Number(item?.qty)||0;
    const rate=Number(item?.rate)||0;
    return sum+moneyToCents(qty*rate);
  },0);
  const subtotalAmount=subtotal/100;
  const rawDiscount=moneyToCents(isSale?saDiscount:saPurchaseDiscount)/100;
  const discount=Math.min(subtotalAmount,Math.max(0,rawDiscount));
  const vatPercent=Math.min(100,Math.max(0,Number(isSale?saVatPercent:saPurchaseVatPercent)||0));
  const vatBase=Math.max(0,subtotalAmount-discount);
  const vat=moneyToCents(vatBase*vatPercent/100)/100;
  return{subtotal:subtotalAmount,discount,vat,total:moneyToCents(vatBase+vat)/100};
}
